[package]
name = "vam-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP control-plane CLI for VAM (vamd)"

[[bin]]
name = "vam"
path = "src/main.rs"

[lib]
name = "vam_cli"
path = "src/lib.rs"

[features]
# Test seam for `vam upgrade`: honours VAM_UPGRADE_API_URL for loopback URLs only. Built into the
# e2e `vam` by scripts/e2e/run.sh; the release gate refuses it in the default tree.
upgrade-seam = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
prost-types = "0.14"
rpassword = "7"
flate2 = "1.0"
reqwest = { workspace = true, features = ["json", "multipart"] }
base64 = "0.22"
sha2.workspace = true
tar = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
toml = "0.8"
uuid = { version = "1.8", features = ["v4"] }
tempfile = "3.8"
vam-security = { workspace = true, features = ["tls-roots", "secret-forms"] }
vam-spec.workspace = true
vam-telemetry.workspace = true

[dev-dependencies]
flate2 = "1.0"
httpmock = "0.9"
tar = "0.4"
ed25519-dalek.workspace = true

[package]
name = "vam-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP control-plane CLI for VAM (vamd)"

[[bin]]
name = "vam"
path = "src/main.rs"

[lib]
name = "vam_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
prost = "0.12"
prost-types = "0.12"
flate2 = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.22"
sha2.workspace = true
tar = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
toml = "0.8"
uuid = { version = "1.8", features = ["v4"] }
vam-security.workspace = true
vam-spec.workspace = true
vam-telemetry.workspace = true

[dev-dependencies]
flate2 = "1.0"
httpmock = "0.7"
tar = "0.4"
tempfile = "3.8"
ed25519-dalek.workspace = true

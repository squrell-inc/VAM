[package]
name = "vam-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Durable host-owned workflow orchestration for VAM"

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.6", features = ["multipart"] }
axum-server = { version = "0.5", features = ["tls-rustls"] }
rcgen = { version = "0.13", features = ["aws_lc_rs", "zeroize"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pemfile = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
time = { version = "0.3.6", default-features = false, features = ["std"] }
flate2 = "1.0"
tar = "0.4"
bytes = "1.5"
base64 = "0.22"
dotenvy = "0.15"
rand = "0.8"
futures-util = "0.3"
secrecy = "0.8"
ed25519-dalek.workspace = true
hmac = "0.12"
libc = "0.2"
prost = "0.12"
prost-types = "0.12"
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
sha2.workspace = true
thiserror.workspace = true
tempfile = "3.8"
tokio = { version = "1.34", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.10", features = ["transport"] }
http = "0.2"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"], default-features = false }
url = "2.5.8"
tower = "0.4"
tower-http = { version = "0.4", features = ["trace"] }
vam-core = { path = "../vam-core" }
vam-inference = { path = "../vam-inference" }
vam-network = { path = "../vam-network" }
vam-security = { workspace = true, features = ["ssrf-guard", "secret-forms"] }
vam-spec.workspace = true
vam-storage.workspace = true
vam-telemetry.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vam-vsock = { path = "../vam-vsock", default-features = false, features = ["host", "guest"] }


[features]
default = []
# TEST ONLY (E9 process guests): vamd can run each session's guest as a host
# process (`VAMD_PROCESS_GUEST_BIN`), with no isolation, on a mock-model-only
# loopback-only node. Never enabled by default or by a workspace dependency.
process-guest = ["vam-core/process-guest", "vam-network/process-guest"]

[[bin]]
name = "vamd"
path = "src/bin/vamd.rs"

[[bin]]
name = "hsp-echo-broker"
path = "src/bin/hsp-echo-broker.rs"

[dev-dependencies]
flate2 = "1.0"
hyper = { version = "0.14", features = ["full"] }
prost-types = "0.12"
tar = "0.4"
tempfile = "3.8"
vam-runtime = { path = "../vam-runtime" }
vam-web = { path = "../../brokers/vam-web" }

[package]
name = "vam-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Inference brokerage and provider adapter plane for VAM"

[dependencies]
thiserror.workspace = true
vam-spec.workspace = true
vam-vsock = { path = "../vam-vsock" }
tokio = { version = "1.34", features = ["fs", "io-util", "rt", "sync", "macros", "rt-multi-thread", "net", "time"] }
bytes = "1.10"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
secrecy = { version = "0.8", features = ["serde"] }
prost = "0.12"
sha2.workspace = true

[dev-dependencies]
tempfile = "3.8"

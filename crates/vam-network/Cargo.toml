[package]
name = "vam-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Network isolation, egress controls, and zero-trust secret injection for VAM"

[dependencies]
sha2.workspace = true
thiserror.workspace = true
vam-spec.workspace = true
vam-security = { path = "../vam-security", features = ["secret-forms"] }
vam-vsock = { path = "../vam-vsock" }
rusqlite = { workspace = true, features = ["bundled"] }
tokio = { version = "1.34", features = ["fs", "io-util", "rt", "sync", "macros", "rt-multi-thread", "net", "time"] }
bytes = "1.10"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ipnet = "2.9"
arc-swap = "1.7"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.7", features = ["derive"] }
libc = "0.2"
prost = "0.12"
vam-telemetry.workspace = true
tracing.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
http-body-util = "0.1"
rcgen = { version = "0.13", features = ["aws_lc_rs", "zeroize"] }
time = { version = "0.3.6", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
tower-service = "0.3"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
# TEST ONLY: the E2E egress fixture (a fake HTTPS origin and a proxy entry point
# that trusts it) and the Graph/connector mock `UpstreamRedirect` (one provider host
# answered by a loopback http server). Never enabled by default or by a workspace
# dependency; `vam-orchestrator`'s own `process-guest` feature turns it on.
process-guest = []

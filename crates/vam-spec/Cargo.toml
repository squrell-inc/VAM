[package]
name = "vam-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compiled Protocol Buffers for VAM (Virtual Agentic Machine) schemas and services"

[features]
default = ["client", "server"]
client = ["dep:tonic"]
server = ["dep:tonic"]

[dependencies]
prost = "0.12"
prost-types = "0.12"
tonic = { version = "0.10", features = ["transport"], optional = true }
prost-reflect = { version = "0.12", features = ["serde"] }
once_cell = "1.19"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2.workspace = true
thiserror.workspace = true

[build-dependencies]
tonic-build = "0.10"
protoc-bin-vendored = "3.0.0"


[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3.8"

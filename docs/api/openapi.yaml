    ReleaseSuggestion:
      type: object
      description: |
        Rules live in vamd (`catalog_suggest.rs`) so the app and CLI agree.
        `INITIAL` is the first release (`1.0.0`, or a skill package's own
        manifest version when above `0.0.0`). `NONE` means the draft equals the
        latest release; `suggested` is then `latest` with patch + 1. When several
        rules match, the highest bump wins and every reason is listed.
        Policy: any Cedar change is `MINOR` (Cedar cannot be classified reliably).
      properties:
        latest:
          $ref: "#/components/schemas/Version"
          description: Latest released version. Absent before the first release.
        suggested:
          $ref: "#/components/schemas/Version"
        bump:
          type: string
          enum: [INITIAL, NONE, PATCH, MINOR, MAJOR]
        reasons:
          type: array
          items:
            type: string
          example: ["added skill jira"]
        unchanged:
          type: boolean
          description: The draft digest equals the latest release.

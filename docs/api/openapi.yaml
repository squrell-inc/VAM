          example: 1
        response:
          type: object
          additionalProperties: true
          description: "The answer for decision 4. At most 16 KiB; checked against the question's result schema; a refused answer is a 4xx and the question stays pending."
        remember:
          type: string
          enum: [REMEMBER_UNSPECIFIED, REMEMBER_ALWAYS_ALLOW, REMEMBER_ALWAYS_DENY]
          description: "Record the decision as an agent rule. ALWAYS_ALLOW is an approval, ALWAYS_DENY a rejection."

            application/json:
              schema:
                $ref: "#/components/schemas/GetPlaybookResponse"

  /v1/skills:
    put:
      summary: Register or update a Skill Manifest (metadata only)
      description: |
        Store JSON skill manifest metadata in the catalog. This does **not** upload skill
        directory contents — use `POST /v1/skills/packages` (multipart tar.gz) or
        `vam skill publish <dir>` to publish installable packages.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSkillRequest"
      responses:
        "200":
          description: Skill manifest saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutSkillResponse"
        "400":
          description: Invalid manifest JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Bearer token lacks `catalog:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/skills/{urn}:
    get:
      summary: Get Skill by URN (metadata only)
      description: |
        Retrieve catalog metadata for a skill URN (latest released, else the caller's
        own draft). Package blobs and draft/released rows are fetched via
        `GET /v1/skills/packages/{urn}`.
      parameters:
        - name: urn
          in: path
          required: true
          description: |
            Skill URN. Because URNs contain `/`, percent-encode each path segment
            (e.g. `urn:vam:skill:local.vam.dev/vam/assistant-tools` →
            `urn%3Avam%3Askill%3Alocal.vam.dev%2Fvam%2Fassistant-tools`).
          schema:
            type: string
          example: "urn:vam:skill:local.vam.dev/vam/assistant-tools"
      responses:
        "200":
          description: Skill manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSkillResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Bearer token lacks required catalog scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Skill metadata not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/skills/packages:
    post:
      summary: Publish a skill package (draft)
      description: |
        Upload a gzip-compressed tar archive of a skill directory. The host unpacks the
        archive, validates `SKILLS.md` frontmatter and `manifest.json`, computes a content
        digest, stores the blob, and upserts a **draft** catalog row.

        Wire format is **multipart/form-data** (`file` + optional `channel=draft`) — not
        the proto `PublishSkillPackageRequest` JSON shape.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: gzip-compressed tar archive of the skill directory tree
                channel:
                  type: string
                  enum: [draft]
                  description: Optional; when present must be `draft`
            encoding:
              file:
                contentType: application/gzip
      responses:
        "200":
          description: Draft package stored (idempotent when bytes unchanged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishSkillPackageResponse"
              example:
                package:
                  resourceId:
                    urn: "urn:vam:skill:local.vam.dev/vam/assistant-tools"
                  version:
                    major: 1
                    minor: 0
                    patch: 0
                    prerelease: "draft"
                    build: ""
                  channel: "DRAFT"
                  digest: "sha256:abc123def456"
                  blobRelpath: "catalog/skills/sha256/ab/c1/sha256-abc123def456.tar.gz"
                  sizeBytes: 4096
                  spec:
                    resourceId:
                      urn: "urn:vam:skill:local.vam.dev/vam/assistant-tools"
                    version:
                      major: 1
                      minor: 0
                      patch: 0
                      prerelease: "draft"
                    description: "Offline calculator skill; filesystem and todo tools are runtime builtins."
                    systemExtension: "Use 'calculator' for math."
                    tools:
                      - name: "calculator"
                        description: "Perform basic arithmetic operations."
                        inputSchemaJson: "{\"type\":\"object\",\"properties\":{\"expression\":{\"type\":\"string\"}},\"required\":[\"expression\"]}"
                        localExec:
                          command: "bun"
                          entrypoint: "/mnt/drive9/skills/assistant-tools/execute.js"
                          defaultArgs: ["calculator"]
                  metadata:
                    revision: 1
        "400":
          description: Validation failure, path-jail violation, URN mismatch, or invalid multipart/channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: "InvalidArgument"
                message: "SKILLS.md frontmatter id does not match manifest.json resource_id.urn"
                retryable: false
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Bearer token lacks `catalog:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Released-row overwrite conflict (rare on publish).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Archive exceeds 32 MiB (`MAX_SKILL_PACKAGE_BYTES`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      summary: List skill packages
      description: |
        List the caller's own draft package rows plus every tenant-released package.
        Callers with `users:admin` also receive foreign drafts. Each package includes
        `ownerUserId`, `channel`, and `catalogTier`.
      responses:
        "200":
          description: Package list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSkillPackagesResponse"
              example:
                packages:
                  - resourceId:
                      urn: "urn:vam:skill:local.vam.dev/vam/assistant-tools"
                    version:
                      major: 1
                      minor: 0
                      patch: 0
                      prerelease: "draft"
                    channel: "DRAFT"
                    digest: "sha256:abc123def456"
                    blobRelpath: "catalog/skills/sha256/ab/c1/sha256-abc123def456.tar.gz"
                    sizeBytes: 4096
                    metadata:
                      revision: 1
                pagination: null
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Bearer token lacks `catalog:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/skills/packages/{urn}:
    get:
      summary: Get a skill package row
      description: |
        Fetch one package row by URN. Query `channel` accepts `draft` or `released`
        (default `draft`). Optional `version` is semver `X.Y.Z` (released channel only).
        Draft rows are **owner-only** (another user's draft is 404) unless the caller
        has `users:admin` (then GET is 200). Released rows are tenant-visible.
        The JSON includes `ownerUserId` and `catalogTier` on `package`.

        Response field `package.channel` is protojson `"DRAFT"` or `"RELEASED"` (uppercase).

        **Path encoding:** URNs contain `/`. Percent-encode the `{urn}` path segment
        (`:` → `%3A`, `/` → `%2F`). Example:
        `GET /v1/skills/packages/urn%3Avam%3Askill%3Alocal.vam.dev%2Fvam%2Fassistant-tools?channel=draft`
      parameters:
        - name: urn
          in: path
          required: true
          description: |
            Raw skill URN (percent-encoded in the URL). Example decoded value:
            `urn:vam:skill:local.vam.dev/vam/assistant-tools`.
          schema:
            type: string
          example: "urn%3Avam%3Askill%3Alocal.vam.dev%2Fvam%2Fassistant-tools"
        - name: channel
          in: query
          schema:
            type: string
            enum: [draft, released]
            default: draft
          description: Query spelling is lowercase; response uses uppercase protojson enum names.
        - name: version
          in: query
          schema:
            type: string
            example: "1.0.0"
          description: Optional exact version (required for released when multiple versions exist).
      responses:
        "200":
          description: Package row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSkillPackageResponse"
              example:
                package:
                  resourceId:
                    urn: "urn:vam:skill:local.vam.dev/vam/assistant-tools"
                  version:
                    major: 1
                    minor: 0
                    patch: 0
                    prerelease: "draft"
                  channel: "DRAFT"
                  digest: "sha256:abc123def456"
                  blobRelpath: "catalog/skills/sha256/ab/c1/sha256-abc123def456.tar.gz"
                  sizeBytes: 4096
                  spec:
                    resourceId:
                      urn: "urn:vam:skill:local.vam.dev/vam/assistant-tools"
                    description: "Offline calculator skill; filesystem and todo tools are runtime builtins."
                    tools: []
                  metadata:
                    revision: 1
        "400":
          description: Invalid `channel` or `version` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Bearer token lacks `catalog:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No package row for URN/channel/version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/agents/{urn}/versions:
    get:
      summary: List agent versions
      description: |
        Version history for one agent URN, newest release first. The caller's own
        draft comes first, with `channel: DRAFT` and `prerelease: "draft"`, and only
        for its owner or a `users:admin` caller. Released entries carry `releasedBy`,
        `releasedAt` and `note`. Percent-encode the URN path segment.
      parameters:
        - name: urn
          in: path
          required: true
          description: Percent-encoded agent URN.
          schema:
            type: string
      responses:
        "200":
          description: Version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogVersionsResponse"
        "404":
          description: No version of this URN is visible to the caller.

  /v1/agents/{urn}/outcomes:
    get:
      summary: Outcomes per agent version
      description: |
        What the agent's stored, signed run receipts add up to, computed on each read. Without
        `version`, lists the versions that have receipts (the caller's `draft` first, then
        releases newest first). With `version=X.Y.Z` or `version=draft`, returns one aggregate:
        `runs` (succeeded + failed + timed out), `successes`, `failed`, `timedOut`, and the
        excluded `cancelled`, `expired`, `rejected`; `successRate`; `passK {k, value}` (the
        unbiased estimator C(successes, k) / C(runs, k); `value` absent with `note` when runs
        are fewer than k); `tokensPerSuccess`, `turnsPerSuccess`; `costPerSuccessMicroUsd` with
        `priceSource` and `catalogVersion`, or `costMissing` naming unpriced models;
        `approvalsPerRun`; `effects` summed over journaled receipts. Same auth as `versions`:
        the draft is for its owner or a `users:admin` caller (a 404 for anyone else). No run or
        user ids. The wire shape is documented in `proto/vam/v1/outcomes.proto`.
      parameters:
        - name: urn
          in: path
          required: true
          description: Percent-encoded agent URN.
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: "`X.Y.Z` or `draft`."
          schema:
            type: string
        - name: k
          in: query
          required: false
          description: pass^k size, 1 to 1000 (default 5).
          schema:
            type: integer
      responses:
        "200":
          description: The version list or one aggregate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad `version` or `k`.
        "404":
          description: Unknown agent or version, or a draft the caller may not see.

  /v1/playbooks/{urn}/versions:
    get:
      summary: List playbook versions
      description: Same as `GET /v1/agents/{urn}/versions`, for playbooks.
      parameters:
        - name: urn
          in: path
          required: true
          description: Percent-encoded playbook URN.
          schema:
            type: string
      responses:
        "200":
          description: Version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogVersionsResponse"
        "404":
          description: No version of this URN is visible to the caller.

  /v1/policies/{urn}/versions:
    get:
      summary: List policy versions
      description: Same as `GET /v1/agents/{urn}/versions`, for policies.
      parameters:
        - name: urn
          in: path
          required: true
          description: Percent-encoded policy URN.
          schema:
            type: string
      responses:
        "200":
          description: Version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogVersionsResponse"
        "404":
          description: No version of this URN is visible to the caller.

  /v1/skills/{urn}/versions:
    get:
      summary: List skill metadata versions
      description: Same as `GET /v1/agents/{urn}/versions`, for skill metadata.
      parameters:
        - name: urn
          in: path
          required: true
          description: Percent-encoded skill URN.
          schema:
            type: string
      responses:
        "200":
          description: Version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogVersionsResponse"
        "404":
          description: No version of this URN is visible to the caller.

  /v1/skills/packages/{urn}/versions:
    get:
      summary: List skill package versions
      description: Same as `GET /v1/agents/{urn}/versions`, for skill packages.
      parameters:
        - name: urn
          in: path
          required: true
          description: Percent-encoded skill URN (see `GET /v1/skills/packages/{urn}`).
          schema:
            type: string
      responses:
        "200":
          description: Version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogVersionsResponse"
        "404":
          description: No version of this URN is visible to the caller.

  /v1/skills/packages/{urn}/release:
    post:
      summary: Release a skill package
      description: |
        Promote the current **draft** of the given semver version to an immutable
        **released** row. Caller must be the package **owner** and hold a live
        `publish:grant` (publisher / org_admin / operator). Request body is
        `ReleaseSkillPackageRequest` JSON (not multipart).

        **Path encoding:** same percent-encoding rules as `GET /v1/skills/packages/{urn}`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: urn
          in: path
          required: true
          description: Percent-encoded skill URN (see GET package path).
          schema:
            type: string
          example: "urn%3Avam%3Askill%3Alocal.vam.dev%2Fvam%2Fassistant-tools"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseSkillPackageRequest"
            example:
              version:
                major: 1
                minor: 0
                patch: 0
                prerelease: ""
                build: ""
      responses:
        "200":
          description: Released package row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseSkillPackageResponse"
              example:
                package:
                  resourceId:
                    urn: "urn:vam:skill:local.vam.dev/vam/assistant-tools"
                  version:
                    major: 1
                    minor: 0
                    patch: 0
                    prerelease: ""
                  channel: "RELEASED"
                  digest: "sha256:abc123def456"
                  blobRelpath: "catalog/skills/sha256/ab/c1/sha256-abc123def456.tar.gz"
                  sizeBytes: 4096
                  metadata:
                    revision: 2
        "400":
          description: Missing version, prerelease suffix on version, or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the package owner, or live role lacks `publish:grant`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No draft package to release for URN/version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Released row already exists with a different digest for this version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: "AlreadyExists"
                message: "released package digest mismatch for urn:vam:skill:local.vam.dev/vam/assistant-tools@1.0.0"
                retryable: false

  /v1/spaces:
    get:
      summary: List the caller's Spaces
      description: |
        The Spaces the caller owns, oldest first. A Space is stored under its `sp_…` id
        alone; `name` is its label (any characters, not unique, never used for lookup).
        Another owner's Space is never listed. Scope `sessions:write`.
      parameters:
        - { name: pageSize, in: query, required: false, schema: { type: integer } }
        - { name: pageToken, in: query, required: false, schema: { type: string } }
        - { name: agentUrn, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Spaces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spaces:
                    type: array
                    items:
                      type: object
                      properties:
                        spaceId: { type: string, example: sp_k3q7xw2m5b4n6a7c3d2e3f4g5h }
                        name: { type: string, description: The label. }
                        workspaceId: { type: string, description: The same as spaceId. }
                        agentUrn: { type: string }
                        createdAt: { type: string, format: date-time }
                        lastActiveAt: { type: string, format: date-time }
                  nextPageToken: { type: string }

    post:
      summary: Create a Space
      description: |
        A new Space for `agentUrn`, owned by the caller, labelled `label` (any characters, not
        unique; blank becomes `untitled`; control characters are refused). The agent must be
        one the caller may run (404 otherwise). Requires an `Idempotency-Key` header: a retry
        with the same key returns the same Space. Scope `sessions:write`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentUrn]
              properties:
                agentUrn: { type: string }
                label: { type: string }
      responses:
        "200": { description: "The Space (`spaceId`, `name`, `agentUrn`)." }
        "400": { description: Missing key or agent, or a bad label. }
        "404": { description: The agent is unknown or not runnable by the caller. }

  /v1/spaces/{id}:
    get:
      summary: Read one Space and its threads
      description: |
        `id` is an `sp_…` id the caller owns. A foreign id answers 404 exactly as a missing
        one does. `threads` lists `threadId` (`th_…`), `spaceId`, `name` (label), `createdAt`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The Space. }
        "404": { description: No such Space for this caller. }

    patch:
      summary: Rename a Space
      description: |
        Changes the label only; the id and directory never change. Same label twice is the
        same result. A foreign or unknown id answers 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "200": { description: The renamed Space. }
        "400": { description: Blank or bad label. }
        "404": { description: No such Space for this caller. }

  /v1/spaces/{id}/threads/{threadId}:
    patch:
      summary: Rename a thread
      description: |
        Changes the thread's label only (`threadId` stays). A foreign Space or an unknown
        thread answers 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: threadId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "200": { description: "The thread (`threadId`, `spaceId`, `name`, `createdAt`)." }
        "400": { description: Blank or bad label. }
        "404": { description: No such Space or thread for this caller. }

  /v1/workspaces/{id}/threads:
    get:
      summary: List a workspace's threads
      description: |
        Threads of the workspace, read from the thread log. While a session holds the
        workspace the live session tree is read (`source: live`, records appear per round);
        otherwise Drive9 HEAD (`source: head`). A thread the live tree does not hold is read
        from HEAD. Workspace access is conversation access: same scope and owner rules as the
        workspace files API (`sessions:write`; another owner's workspace is 404).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: sp_k3q7xw2m5b4n6a7c3d2e3f4g5h
          description: An `sp_…` Space id the caller owns (a name is a label, not a lookup).
      responses:
        "200":
          description: Threads, sorted by id; each entry adds `spaceId` and `name` (the label).
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceId: { type: string }
                  source: { type: string, enum: [live, head] }
                  head:
                    type: string
                    nullable: true
                    description: HEAD manifest hash; null for a live read.
                  threads:
                    type: array
                    items:
                      type: object
                      properties:
                        threadId: { type: string }
                        legacy:
                          type: boolean
                          description: True for a thread that only has a timeline (no log).
                        head:
                          type: object
                          nullable: true
                          properties:
                            seq: { type: integer }
                            digest: { type: string }
                        logBytes: { type: integer }
                        agentUrn: { type: string, nullable: true }
                        agentDigest: { type: string, nullable: true }
                        parentThread: { type: string, nullable: true }
                        forkTurn: { type: integer, nullable: true }
                        createdAt: { type: integer, nullable: true }
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Caller is missing `sessions:write`.
        "404":
          description: The workspace has no committed state for this caller.

  /v1/workspaces/{id}/threads/{thread}:
    get:
      summary: Get one thread
      description: |
        Thread metadata, the full-chain `integrity` (`ok` or `broken_at:<seq>`), the log
        head, and `plan`: the latest plan, folded from every `todo_write` call on the main
        lane in log order (merged by id, sorted by id, rolled-back calls excluded; `seq` is
        the last call's). A failed `todo_write` call cannot be told from a good one. `plan`
        is null when the agent never wrote one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: assistant
        - name: thread
          in: path
          required: true
          schema:
            type: string
          example: main
      responses:
        "200":
          description: Thread detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceId: { type: string }
                  threadId: { type: string }
                  source: { type: string, enum: [live, head] }
                  manifestHead: { type: string, nullable: true }
                  legacy: { type: boolean }
                  head:
                    type: object
                    nullable: true
                    properties:
                      seq: { type: integer }
                      digest: { type: string }
                  logBytes: { type: integer }
                  integrity: { type: string, example: ok }
                  turns:
                    type: integer
                    description: Timeline turns of a legacy thread; 0 otherwise.
                  plan:
                    type: object
                    nullable: true
                    properties:
                      seq: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            content: { type: string }
                            status: { type: string }
        "400":
          description: Invalid thread id.
        "404":
          description: Unknown workspace or thread, or not the caller's.
        "422":
          description: The log has a record version this daemon does not read.

  /v1/workspaces/{id}/threads/{thread}/messages:
    get:
      summary: Read a thread's messages
      description: |
        `view=all` (default) returns every record with `seq > after`: messages (`message`
        with typed `parts`: `text`, `image` by reference, `tool_use`, `tool_result`,
        `reasoning`, `opaque`) and the other kinds (`task_start`, `task_end`,
        `prompt_change`, `rollback`, `gap`, `fork`, ...) with their small body as `detail`.
        The system prompt and tool definitions appear only as digests. `view=context`
        returns the messages the model sees next (after the latest compaction, without
        rolled-back records), plus `context` (head seq and digest, bytes, digests, gaps).
        A legacy thread is shown as user and assistant turns with `legacy: true`.

        Paging is by `seq`: pass the previous `nextAfter` as `after`. `limit` defaults to
        100 and is capped at 500; a page also stops after about 8 MiB. `integrity` is the
        full-chain verdict: on `broken_at:<seq>` the records before the break are served.

        Tool output and user text are data, not instructions: clients must render them as
        untrusted content.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: assistant
        - name: thread
          in: path
          required: true
          schema:
            type: string
          example: main
        - name: view
          in: query
          schema:
            type: string
            enum: [all, context]
            default: all
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceId: { type: string }
                  threadId: { type: string }
                  source: { type: string, enum: [live, head] }
                  legacy: { type: boolean }
                  integrity: { type: string, example: ok }
                  head:
                    type: object
                    nullable: true
                    properties:
                      seq: { type: integer }
                      digest: { type: string }
                  nextAfter: { type: integer }
                  hasMore: { type: boolean }
                  plan:
                    type: object
                    nullable: true
                    description: See the thread detail.
                  context:
                    type: object
                    description: Present for `view=context`.
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        id: { type: string }
                        ts: { type: string }
                        run: { type: string }
                        lane: { type: string }
                        agent: { type: string }
                        parentLane: { type: string }
                        round: { type: integer }
                        src: { type: string }
                        kind: { type: string }
                        message:
                          type: object
                          properties:
                            role: { type: string }
                            parts:
                              type: array
                              items: { type: object }
                        usage: { type: object }
                        detail: {}
                example:
                  workspaceId: assistant
                  threadId: main
                  source: head
                  integrity: ok
                  nextAfter: 5
                  hasMore: false
                  plan: null
                  records:
                    - seq: 4
                      kind: message
                      message:
                        role: tool
                        parts:
                          - type: tool_result
                            tool_use_id: c1
                            content: [{ type: text, text: kiwi-42 }]
        "400":
          description: Invalid thread id, `view`, `after` or `limit`.
        "404":
          description: Unknown workspace or thread, or not the caller's.

  /v1/sessions:
    post:
      summary: Create a MicroVM Session
      description: Provision a fresh microVM isolation sandbox.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            example:
              sessionId:
                urn: "sess-dev-01"
              workspaceId: "assistant"
              storageProfileId: "default"
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
    get:
      summary: List all Sessions
      description: |
        List active and completed microVM sessions, newest first, one page at a time (50 by
        default). While `pagination.nextPageToken` is not empty, pass it as `pageToken`.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of session records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
              example:
                sessions:
                  - sessionId:
                      urn: "sess-run-948fbc10"
                    vmId: "vm-sess-run-948fbc10"
                    workspaceId: "assistant"
                    storageProfileId: "default"
                    observedState: 3
                    desiredState: 3
                    guestCid: 34
                    createdAt:
                      seconds: 1787737020
                      nanos: 0

  /v1/sessions/{id}:
    get:
      summary: Get Session Status
      description: Get detailed state and CID for a specific microVM session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "sess-run-948fbc10"
      responses:
        "200":
          description: Session status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSessionResponse"

  /v1/sessions/{id}/egress-ca:
    get:
      summary: Get the session egress CA
      description: >
        Public PEM of the per-session certificate authority minted for the
        port-55 TLS proxy. Owner or operator only. The private key stays in
        vamd memory and is never written to the data directory or this response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "sess-run-948fbc10"
      responses:
        "200":
          description: Public CA certificate.
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, pem]
                properties:
                  sessionId:
                    type: string
                  pem:
                    type: string
                    description: PEM-encoded certificate. Does not include a private key.
        "404":
          description: Session not visible to the caller, or the CA has not been minted.

  /v1/sessions/{id}/pause:
    post:
      summary: Pause a Session
      description: Suspend the microVM execution for the session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Session paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PauseSessionResponse"

  /v1/sessions/{id}/resume:
    post:
      summary: Resume a Session
      description: Resume execution of a paused microVM session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Session resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeSessionResponse"

  /v1/sessions/{id}/terminate:
    post:
      summary: Terminate a Session
      description: |
        Forcefully stop and destroy the microVM sandbox. Stopping a task that
        is running waits until the run has ended and its workspace is settled:
        files roll back to the last complete turn commit and the run ends
        `FAILED` with `reason: stopped`. A workspace commit that fails keeps the
        work under `drive9/kept` and ends the run with
        `reason: storage_commit_failed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Session terminated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateSessionResponse"
        "504":
          description: |
            `stop_pending`: the session is stopped and its workspace is still
            being settled. Retry; the call is idempotent.

  /v1/sessions/{id}/snapshots:
    post:
      summary: Create Session Snapshot
      description: Create a warm or cold checkpoint snapshot of a session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequest"
            example:
              snapshotId:
                urn: "snap-checkpoint-01"
              kind: 1
      responses:
        "200":
          description: Snapshot created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSnapshotResponse"

  /v1/sessions/restore:
    post:
      summary: Restore Session from Snapshot
      description: Spin up a new session starting from a previously captured snapshot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreSessionRequest"
            example:
              snapshotId:
                urn: "snap-checkpoint-01"
              newSessionId:
                urn: "sess-restored-01"
      responses:
        "200":
          description: Restored session status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreSessionResponse"

  /v1/runs:
    post:
      summary: Trigger an Agent Run
      description: |
        Launch an agent execution on a given workspace and thread.
        Threads maintain continuous conversational context across multiple runs.

        When the thread has a live task (running, or parked on an approval), the request is a
        message to that task, not a new run: `202` with the live run's `status` and an `inbox`
        receipt `{seq, mode, runId}`. `inboxMode` `STEER` (the default) is delivered at the task's
        next turn boundary; `QUEUE` is held for the next task. A message carries only
        `inputs.prompt` (and, optionally, the run's own `inputs.model`); anything else is `400`.
        Another thread on a busy workspace, and a run that is finalizing, still answer `409`
        (retryable). Over 20 undelivered messages: `429` `inbox_full`. This door is charged to the
        run-creation rate limit; `POST /v1/runs/{urn}/messages` is not.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
            example:
              spec:
                runId:
                  urn: "urn:vam:run:local.vam.dev/acme/run-20260826-001"
                agentRef:
                  urn: "urn:vam:agent:hub.vam.dev/acme/sql-developer"
                workspaceRefUri: "volume://assistant"
                threadRef: "session-thread-alpha"
                inputs:
                  prompt: "Inspect the orders table and generate index recommendations."
                  model: "claude-3-5-sonnet"
                maxDuration:
                  seconds: 300
                  nanos: 0
      responses:
        "202":
          description: Run accepted and queued for microVM execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
              example:
                status:
                  runId:
                    urn: "urn:vam:run:local.vam.dev/acme/run-20260826-001"
                  state: 2
                  startedAt:
                    seconds: 1787737024
                    nanos: 0
                  stepStatuses: []
                workspaceId: "assistant"
                threadRef: "session-thread-alpha"
                sessionId: "sess-run-948fbc10"
    get:
      summary: List all Runs
      description: |
        Retrieve recorded agent runs and their current statuses, newest first, one page at a time
        (50 by default). While `pagination.nextPageToken` is not empty, pass it as `pageToken`.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunsResponse"

  /v1/runs/{urn}:
    get:
      summary: Get Run Status
      description: Inspect execution progress, step statuses, accumulated outputs, and errors for a run.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:run:local.vam.dev/acme/run-20260826-001"
      responses:
        "200":
          description: Run status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRunResponse"

  /v1/runs/{urn}/events:
    get:
      summary: Get Thread / Run Real-Time Events
      description: |
        Fetch incremental event stream for a run/thread.
        Pass `after=<seq>` to poll for new events emitted since last check.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:run:local.vam.dev/acme/run-20260826-001"
        - name: after
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Only return events with sequence number strictly greater than this value.
      responses:
        "200":
          description: Chronological list of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunEventsResponse"
              example:
                events:
                  - sequence: 1
                    eventType: "TOOL_INVOCATION_REQUESTED"
                    payload: "{\"tool\": \"execute_sql_query\", \"params\": {\"query\": \"EXPLAIN ANALYZE SELECT * FROM orders;\"}}"
                    emittedAt:
                      seconds: 1787737025
                      nanos: 0
                  - sequence: 2
                    eventType: "TOOL_INVOCATION_COMPLETED"
                    payload: "{\"status\": \"success\", \"rows\": 12}"
                    emittedAt:
                      seconds: 1787737027
                      nanos: 0
                  - sequence: 3
                    eventType: "AGENT_MESSAGE"
                    payload: "{\"content\": \"The query scans 120,000 rows. Creating an index on customer_id will speed it up.\"}"
                    emittedAt:
                      seconds: 1787737030
                      nanos: 0

  /v1/runs/{urn}/cancel:
    post:
      summary: Cancel an Agent Run
      description: Cancel a running agent run and terminate its guest session.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:run:local.vam.dev/acme/run-20260826-001"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunResponse"

  /v1/runs/{urn}/messages:
    post:
      summary: Send a message to a run's inbox
      description: |
        A message to a run with a live task (running or parked on an approval). `STEER` is delivered at the task's
        next turn boundary; `QUEUE` runs as the next task and answers with the
        run it will start. The same as `POST /v1/runs` naming the thread of a live
        task, addressed by run id.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:run:local.vam.dev/acme/run-20260826-001"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRunMessageRequest"
      responses:
        "202":
          description: Message taken into the inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRunMessageResponse"
        "429":
          description: "`inbox_full`: the run already holds its cap of undelivered messages (20)."
        "409":
          description: The run is not live (finalizing, settling or finished).

  /v1/runs/{urn}/stop:
    post:
      summary: Stop a running task
      description: |
        Ends the live task cleanly (E10 Phase 3, AR-3.7): files roll back to the last
        finished step, a pending approval is rejected "stopped by user" (a pending
        question is cancelled) and the task never resumes, and messages that never
        reached the task (pending steers, queued messages) are discarded and listed in
        `discarded` with their text. The run ends FAILED, reason `stopped`, error
        "stopped by user", whatever the guest reports after the stop is recorded. A run
        that had already ended answers 200 with its own end. While the workspace is
        still settling the answer is `stop_pending`.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:run:local.vam.dev/acme/run-20260826-001"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Task stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopRunResponse"
        "504":
          description: "`stop_pending`: the run has ended; its workspace is still being settled."

  /v1/approvals:
    get:
      summary: List Pending HITL Approvals
      description: |
        List Human-in-the-Loop approval requests waiting for human decision, oldest first, one page
        at a time (50 by default). While `pagination.nextPageToken` is not empty, pass it as
        `pageToken`.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of pending approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApprovalsResponse"

  /v1/approvals/{id}:
    get:
      summary: Get Approval Request Details
      description: Get details and requested arguments for a specific approval gate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:approval:acme/appr-001"
      responses:
        "200":
          description: Approval request details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApprovalResponse"

  /v1/approvals/{id}/decide:
    post:
      summary: Decide Approval (Approve / Reject / Amend)
      description: Submit an approval decision (1=APPROVED, 2=REJECTED, 3=AMENDED) to unblock or abort a paused run.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:approval:acme/appr-001"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
            example:
              decision: 1
              rejectionReason: ""
      responses:
        "200":
          description: Approval decision processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideApprovalResponse"

  /v1/secrets:
    put:
      summary: Store Host Secret
      description: Store an encrypted secret (e.g. LLM API keys or egress credentials) in the VAMD vault. Org-scope writes require operator or org_admin. User-scope writes are the caller only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutHostSecretRequest"
            example:
              bindingId: "openai_api_key"
              value: "sk-proj-test12345678"
              kind: 1
      responses:
        "200":
          description: Secret metadata stored (secret values are never returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutHostSecretResponse"
    get:
      summary: List Secrets Metadata
      description: List metadata and fingerprints of org-scope secrets plus the caller's user-scope secrets. No user→org fallback.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [org, user]
          description: Filter to one vault partition.
      responses:
        "200":
          description: List of secret metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHostSecretsResponse"

  /v1/secrets/{id}:
    get:
      summary: Get Secret Metadata
      description: Retrieve metadata for a single host secret binding.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "openai_api_key"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [org, user]
          description: Vault partition. Unspecified follows the caller's role default (org for operator/org_admin, user otherwise).
      responses:
        "200":
          description: Secret metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSecretMetadata"
    delete:
      summary: Delete Host Secret
      description: Delete a secret binding from the vault. Org-scope deletes require operator or org_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "openai_api_key"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [org, user]
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Secret deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteHostSecretResponse"

  /v1/secrets/resolve:
    post:
      summary: Resolve secret requirements
      description: |
        Discovery for the VAM app: resolve declared SecretRequirements against the
        caller's vault and report configured vs missing. Only checks org rows
        plus the caller's own user-scope row; another user's user-scope rows are
        never revealed (org existence is shared on purpose). Always 200;
        required-but-missing entries are also listed in `missing` for fail-fast
        surfacing at run create / skill load. Run create enforces the same check
        server-side (412 on missing); tool call stays fail-closed with a typed
        missing-binding error. Invoke-path `resolved_secrets` is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveSecretRequirementsRequest"
            example:
              requirements:
                - name: "jira/auth-header"
                  required: true
                  scope: 2
      responses:
        "200":
          description: Per-requirement configured/missing statuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveSecretRequirementsResponse"

  /v1/mcp/connections:
    put:
      summary: Connect or update a remote MCP server
      description: |
        Register a remote MCP server. `authMode` is `static` (default) or `oauth`.
        Static mode stores HTTP headers in the vault as egress secrets bound to
        the connection host and snapshots `tools/list`. `secretValue` is shorthand
        for a single `Authorization` header at `{connectionId}/auth-header`. Each
        `headers[]` entry is stored at `{connectionId}/header/{lowercase-name}`.
        OAuth mode persists authorization-server metadata (`oauth`); token values
        are not accepted here (use `PUT /v1/mcp/connections/{id}/oauth/tokens`).
        Header and token values are never returned. Org-scope writes require
        operator or org_admin.
        Scope is selected by the request body's `scope`, not a query parameter.
        Omitted `authMode` preserves the existing mode on update; omitted `oauth`
        preserves existing OAuth metadata. Metadata is validated before header
        credentials are written to the vault. Static mode rejects supplied OAuth
        metadata and clears existing OAuth metadata when switching modes.
        Switching `static` to `oauth` deletes the previous mode's header vault
        bindings (except credentials stored by this request) and does not keep
        those bindings on the row. Switching `oauth` to `static` deletes
        `{id}/oauth/access-token`, `{id}/oauth/refresh-token`, and
        `{id}/oauth/client-secret`. RFC 7009 revocation runs on disconnect, not
        on a mode switch.
        Updates must retain the registered host. OAuth connections without header
        bindings skip live `tools/list`, retaining the existing snapshot (or an
        empty snapshot on create). Tool removals are accepted; additions or
        changes require `approveDrift: true`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectMcpRequest"
            example:
              connectionId: linear
              url: https://mcp.linear.app/mcp
              secretValue: "Bearer example"
              headers:
                - name: X-Example
                  value: example
      responses:
        "200":
          description: Connection stored with pinned tool snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMcpResponse"
        "403":
          description: Caller lacks `secrets:write` or org-scope write role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      summary: List MCP connections
      description: |
        Org connections plus the caller's user-scope connections. Each row includes
        `authMode` and, for OAuth connections, one status contract under `oauth`:
        `status` (`connected` or `needs_reauth`), `expiresAt` when known,
        sanitized `lastRefreshError` when a failure is stored (omitted once
        cleared), and `hasRefreshBinding` (true when `{id}/oauth/refresh-token`
        exists in the vault). Responses never include token or refresh-token
        values. Static connections stay `authMode=static` with `oauth: null`
        and do not include those OAuth-only fields. This route does not refresh
        tokens or compute `needs_reauth`; it returns the status persisted by the
        last tool-call refresh attempt. Raw authorization-server bodies are
        replaced with `refresh failed` before persist and before this response.
        There is no GET-by-id; each list item is the connection object.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [org, user]
      responses:
        "200":
          description: Visible MCP connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMcpConnectionsResponse"

  /v1/mcp/connections/{id}:
    delete:
      summary: Disconnect an MCP server
      description: |
        Delete vault egress bindings listed on the connection (including every
        `headerBindings` entry and OAuth access/refresh/client-secret bindings)
        and remove the registry row. When the connection is OAuth and
        `oauth.revocationEndpoint` is set, vamd first POSTs the refresh token
        once to that endpoint (RFC 7009, `token_type_hint=refresh_token`, with
        `client_id` and `client_secret` when a client-secret binding exists).
        Authorization-server errors, timeouts, and rejected endpoints are logged
        as a sanitized reason (HTTP status or an allowlisted `error` code only;
        never the token or response body) and do not fail disconnect. A missing
        revocation endpoint or refresh binding skips the request. The response
        names the removed connection and contains no token values. `oauth.status`
        and `oauth.lastRefreshError` are omitted: the row and bindings are gone,
        so the body must not leave a stale `needs_reauth` or refresh error.
        A later list does not include the connection.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [org, user]
      responses:
        "200":
          description: Disconnected connection (last known metadata).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMcpResponse"

  /v1/mcp/connections/{id}/refresh:
    post:
      summary: Refresh MCP tool snapshot
      description: |
        Re-fetch `tools/list` using stored header bindings. OAuth connections
        attach `Authorization: Bearer` from `{id}/oauth/access-token`. Tool
        removals are accepted without approval; additions or changes (including
        a changed annotation or server `instructions`) require
        `approveDrift: true`. A stored row that lacks metadata the server now
        sends, or whose description the old 512-character cap cut, is stored as
        `upgraded` without approval. An empty body defaults to
        `approveDrift: false`.
        This refreshes only the tool snapshot, not OAuth tokens; it does not
        implement refresh-on-401. The `connection` object uses the same OAuth
        status contract as list: `oauth.status`, `oauth.expiresAt` when known,
        sanitized `oauth.lastRefreshError` when set, and `oauth.hasRefreshBinding`.
        Static connections keep `oauth: null`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [org, user]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshMcpRequest"
      responses:
        "200":
          description: Refreshed connection and drift summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshMcpResponse"

  /v1/mcp/connections/{id}/oauth/tokens:
    put:
      summary: Upsert OAuth tokens for an MCP connection
      description: |
        After the app completes authorization-code exchange, store access and
        refresh tokens (and an optional client secret) as Egress secrets:

        - `{id}/oauth/access-token` pinned to the MCP server host
        - `{id}/oauth/refresh-token` pinned to the token endpoint host
        - `{id}/oauth/client-secret` (optional) pinned to the token endpoint host

        vamd never sees the authorization code and does not open a browser.
        Re-upsert replaces vault ciphertext for those bindings. The connection
        must already exist with `authMode=oauth`; static connections and other
        owners are rejected. Responses include binding ids and updated
        `oauth.expiresAt`, `oauth.status`, and `oauth.hasRefreshBinding` —
        never token values.
        Same `secrets:write` and org-write rules as other secret puts.
        Expiry, status, and resulting OAuth metadata are validated before any
        vault write; rejected metadata does not rotate credentials or consume
        vault idempotency. `expiresAt` takes precedence over `expiresIn` (ignored
        when `expiresAt` is supplied). Omitting both preserves stored expiry.
        Successful upsert defaults status to `connected` (clearing a persisted
        `needs_reauth` — this is the reconnect path), clears `lastRefreshError`,
        and preserves `lastRefreshAt`. Omitted or blank `clientSecret` preserves
        an existing client-secret binding and does not return its binding id.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [org, user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMcpOauthTokensRequest"
            example:
              accessToken: "example-access"
              refreshToken: "example-refresh"
              expiresIn: 3600
      responses:
        "200":
          description: Tokens stored; connection metadata and binding ids returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertMcpOauthTokensResponse"
        "400":
          description: Connection is `authMode=static`, tokens are invalid or empty, expiry/status or resulting OAuth metadata is invalid, or body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller lacks `secrets:write` or org-scope write role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Connection not found for this caller (wrong owner or unknown id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/hosted/brokers:
    get:
      summary: List hosted brokers
      description: |
        Return enabled HSP broker approvals with stored Unix endpoints and
        ListTools snapshots. See hosted protocol docs for Register/Invoke semantics.
      responses:
        "200":
          description: Hosted broker catalog entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHostedBrokersResponse"
    put:
      summary: Approve and register a hosted broker
      description: |
        Upsert an operator-approved CapabilityManifest, dial the broker over a Unix
        domain socket, then run Register + ListTools (fail-closed). Endpoint and tool
        snapshot are persisted only on success. Requires `brokers:admin` (operator-only;
        `catalog:write` is not sufficient).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutHostedBrokerRequest"
            example:
              manifest:
                brokerId: "echo-ts"
                trustTier: 2
                tools:
                  - toolName: "echo.ping"
                    sideEffect: 0
                    requiredSecrets: []
              unixPath: "/tmp/hsp-echo-ts.sock"
              idempotencyKey: "hsp-echo-ts-1"
      responses:
        "200":
          description: Broker approved and registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutHostedBrokerResponse"
        "403":
          description: |
            Missing `brokers:admin` scope, or HSP admission denied (trust tier, drift,
            connect failure). A `catalog:write` key without `brokers:admin` receives 403.

  /v1/hosted/brokers/{id}:
    get:
      summary: Get hosted broker by id
      description: Retrieve one HSP broker approval record (manifest, endpoint, tools).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "echo-ts"
      responses:
        "200":
          description: Hosted broker record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHostedBrokerResponse"
        "404":
          description: Broker not found.
    delete:
      summary: Disable a hosted broker
      description: |
        Disables the broker's approval and closes its trigger gateway socket. Requires
        `brokers:admin`. Idempotent for an approval that is already disabled; 404 when the
        broker was never approved. Grants the broker holds stop working with it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "echo-ts"
      responses:
        "200":
          description: The disabled broker record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHostedBrokerResponse"
        "404":
          description: Broker not found.

  /v1/agents/{urn}/release-suggestion:
    get:
      summary: Suggest the next agent version
      description: |
        Compares the caller's draft with the latest release and returns the
        next version (see `ReleaseSuggestion`). Caller must be the owner and
        hold a live `publish:grant`, the same check as release; others get 403.
        No draft is 404 (`no draft of agent '<urn>' to release`). Default-valued
        fields (`unchanged: false`, zero version parts) are omitted from the JSON.
      parameters:
        - name: urn
          in: path
          required: true
          description: Percent-encoded URN.
          schema:
            type: string
      responses:
        "200":
          description: The suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseSuggestion"
        "403":
          description: Caller is not the owner or lacks `publish:grant`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No draft to release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"


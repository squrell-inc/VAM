components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: "Supply token with 'Authorization: Bearer <api_key_or_session_token>'"

  responses:
    RateLimited:
      description: |
        Rate limit exceeded. `Retry-After` is the wait in seconds and `X-VAM-Rate-Limited-Reason`
        is `key-rate`, `key-create-rate` (run and session creation) or `ip-auth-rate` (requests
        without a valid key). Every endpoint except `/v1/health`, `/openapi.yaml` and `/docs` can
        answer it unless the operator set `VAMD_RATE_LIMIT=off`.
      headers:
        Retry-After:
          schema:
            type: integer
        X-VAM-Rate-Limited-Reason:
          schema:
            type: string
            enum: [key-rate, key-create-rate, ip-auth-rate]
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: RESOURCE_EXHAUSTED
              message:
                type: string
              retryable:
                type: boolean

  parameters:
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
      description: Rows per page; above 1000 is treated as 1000.
    PageToken:
      name: pageToken
      in: query
      required: false
      schema:
        type: string
      description: The opaque `pagination.nextPageToken` of the previous page.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Unique UUID for safe request retries.
      example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"

  schemas:
    ResourceId:
      type: object
      properties:
        urn:
          type: string
          example: "urn:vam:agent:hub.vam.dev/acme/sql-developer"

    Timestamp:
      type: object
      properties:
        seconds:
          type: integer
          format: int64
          example: 1787737000
        nanos:
          type: integer
          example: 0

    HealthResponse:
      type: object
      properties:
        status:
          type: integer
          description: "1 = SERVING, 2 = NOT_SERVING"
          example: 1

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: A login name (matched ignoring letter case) or a user id.
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LoginResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        token:
          type: string
          description: Short-lived access token (`vam_st_…`)
        expiresAt:
          type: integer
          format: int64
        refreshToken:
          type: string
          description: Refresh token (`vam_rt_…`)
        refreshExpiresAt:
          type: integer
          format: int64

    LogoutResponse:
      type: object
      properties:
        revoked:
          type: boolean

    GetMeResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        role:
          type: string
          description: One of operator, org_admin, publisher, member
        scopes:
          type: array
          items:
            type: string
          description: Scopes on this bearer (session role defaults, or the API key's minted set)
        registryDomain:
          type: string
          description: This node's registry domain, the org's URN domain. `local.vam.dev` when unconfigured (`VAMD_REGISTRY_DOMAIN`).
        defaultNamespace:
          type: string
          description: The URN namespace new artifacts of this caller use. The username lowercased; for an email username (one `@`) the part before the `@`, without a `+tag`, lowercased. `default` when that is not a valid URN segment.
        marketplaceDomain:
          type: string
          description: Squrell marketplace domain (`VAMD_MARKETPLACE_DOMAIN`). Omitted when none is set (proto3 JSON drops empty strings).

    NodeStatus:
      type: object
      properties:
        nodeId:
          type: string
        listenAddr:
          type: string
        draining:
          type: boolean
        ready:
          type: boolean
        activeSessions:
          type: integer
        maxSessions:
          type: integer
        totalVcpusAllocated:
          type: integer
        maxVcpus:
          type: integer
        totalMemoryMibAllocated:
          type: integer
          format: int64
        maxMemoryMib:
          type: integer
          format: int64
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        guestMode:
          type: string
          description: 'How session guests run: `vm` (Firecracker microVMs, every normal node) or `process` (host processes with no isolation; E9 test nodes only).'

    GetNodeStatusResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"

    GetOperatorAllowedModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
          description: Operator-published model ids. Empty means unrestricted.
          example: ["openai/gpt-4o", "anthropic/claude-sonnet-4"]
        defaultModel:
          type: string
          description: The operator's default model. Absent when none is set.
          example: "openai/gpt-4o"
        effectiveDefaultModel:
          type: string
          description: >-
            The model a run gets when neither the caller nor the agent names one
            that is allowed. The default, else the first listed model, else the
            catalog default.
          example: "openai/gpt-4o"
        defaultGateway:
          type: string
          enum: [vercel, openrouter]
          description: >-
            Where a `provider/model` id the catalog does not know is sent. `vercel`
            unless the operator set `openrouter`. The host picks the provider at run
            creation and records it on `vam.v1.model.resolved`.
          example: "vercel"

    PutOperatorAllowedModelsRequest:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
          description: Replacement allowlist. Order is preserved; duplicates are dropped.
          example: ["openai/gpt-4o"]
        defaultModel:
          type: string
          description: Node default model. Omitted leaves it as stored; an empty string clears it. Must be on a non-empty list.
          example: "openai/gpt-4o"
        defaultGateway:
          type: string
          enum: [vercel, openrouter]
          description: Where an unknown `provider/model` id goes. Omitted leaves it as stored.
          example: "openrouter"

    PutOperatorAllowedModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
          description: Stored allowlist after normalize (trim + dedup).
        defaultModel:
          type: string
          description: The stored node default model. Absent when none is set.
        defaultGateway:
          type: string
          enum: [vercel, openrouter]
          description: The stored node default gateway.

    ApiKeyRecord:
      type: object
      properties:
        keyId:
          $ref: "#/components/schemas/ResourceId"
        name:
          type: string
        principal:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          $ref: "#/components/schemas/Timestamp"
        revokedAt:
          $ref: "#/components/schemas/Timestamp"
        userId:
          type: string
          description: "Bound control-plane user (`users.user_id`). Bootstrap key is `operator`."
          example: "local"
        holder:
          type: string
          description: "`http` (empty reads as `http`) or `broker:<id>` for a grant."
        targetKind:
          type: string
        targetId:
          type: string
        targetLabel:
          type: string
        messagePreview:
          type: string
        issuedVia:
          type: string
        toolName:
          type: string
        expiresAt:
          $ref: "#/components/schemas/Timestamp"

    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "frontend-dashboard-key"
        principal:
          type: string
          example: "User::developer"
        scopes:
          type: array
          items:
            type: string
          description: "Requested scopes. Empty = owner's role defaults. `catalog:write` does not imply `publish:grant`. Tenant owners never receive keys:admin or brokers:admin."
          example: ["runs:write", "sessions:write", "catalog:write", "approvals:write", "node:read"]
        idempotencyKey:
          type: string
        userId:
          type: string
          description: "Optional owner to bind: a user id or a login name in any letter case. Empty = caller. Tenant keys never receive keys:admin or brokers:admin. Org-admin `publish:grant` grant/revoke is `POST`/`DELETE /v1/users/{id}/publish-grant`."
          example: "local"

    CreateApiKeyResponse:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/ApiKeyRecord"
        secret:
          type: string
          description: "Plaintext API key; shown once upon creation."
          example: "vam_sk_948fbc102e3b4a"

    ListApiKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyRecord"

    RevokeApiKeyResponse:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/ApiKeyRecord"

    UserAccount:
      type: object
      properties:
        userId:
          type: string
          description: Opaque id the node generated (`usr_` and 26 characters). Never derived from the username. Users created before ids were generated keep the id they have.
          example: usr_mfrggzdfmztwq2lknnwg23tpoa
        username:
          type: string
          description: The login name, as typed. Unique ignoring letter case.
          example: carol
        role:
          type: string
          example: member
        hasPassword:
          type: boolean
          example: true
        createdAt:
          type: integer
          format: int64
        deactivatedAt:
          type: integer
          format: int64
          description: Unix seconds; 0 when the user is active.
        deactivated:
          type: boolean
          example: false

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Login name. ASCII letters, digits and `._+@-`, at most one `@`, at most 254 characters. Not starting `usr_`, not `bootstrap`, not another user's id (400). Unique ignoring letter case (409).
          maxLength: 254
          example: carol
        password:
          type: string
          format: password
        role:
          type: string
          example: member
          description: Empty defaults to member. Cannot be operator.
        userId:
          type: string
          deprecated: true
          description: Must be empty. The node generates the id; a non-empty value is 400.

    CreateUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserAccount"

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserAccount"

    DeactivateUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserAccount"

    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: New password. Write-only. Never logged or returned.

    ResetUserPasswordResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserAccount"

    ChangeMyPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: The password the caller signed in with. Write-only. Never logged or returned.
        newPassword:
          type: string
          format: password
          description: New password. Must differ from the current one. Write-only. Never logged or returned.

    ChangeMyPasswordResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserAccount"
        reloginRequired:
          type: boolean
          description: Always true. Every session of the user, this one included, was revoked.
        passwordUpdatedAt:
          type: string
          format: int64
          description: When the password changed, Unix seconds, as a JSON string (proto3 int64).
          example: "1760000000"

    AdminMintUserApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: alice-ci
        principal:
          type: string
          description: Empty defaults to User::"<name>".
        scopes:
          type: array
          items:
            type: string
          description: Empty uses the target user's role defaults. Never includes keys:admin or brokers:admin for tenants.

    GrantPublishRightResponse:
      type: object
      properties:
        userId:
          type: string
          example: alice
        role:
          type: string
          example: publisher
        granted:
          type: boolean
          example: true

    RevokePublishRightResponse:
      type: object
      properties:
        userId:
          type: string
          example: alice
        role:
          type: string
          example: member
        granted:
          type: boolean
          example: false

    ReassignCatalogOwnerRequest:
      type: object
      required: [kind, urn, ownerUserId]
      properties:
        kind:
          type: string
          example: agent
        urn:
          type: string
          example: urn:vam:agent:local.vam.dev/acme/oracle
        ownerUserId:
          type: string
          example: bob

    ReassignCatalogOwnerResponse:
      type: object
      properties:
        kind:
          type: string
          example: agent
        urn:
          type: string
        previousOwnerUserId:
          type: string
          example: alice
        ownerUserId:
          type: string
          example: bob
        rowsUpdated:
          type: integer
          example: 2

    ModelPreference:
      type: object
      properties:
        provider:
          type: string
          example: "anthropic"
        modelId:
          type: string
          example: "claude-3-5-sonnet"
        priority:
          type: integer
          example: 1

    ModelRequirements:
      type: object
      properties:
        minContextTokens:
          type: integer
          example: 32768
        supportsTools:
          type: boolean
          example: true
        supportsVision:
          type: boolean
          example: false

    AgentSpec:
      type: object
      properties:
        resourceId:
          $ref: "#/components/schemas/ResourceId"
        displayName:
          type: string
          example: "SQL Developer"
        description:
          type: string
          example: "Specialized agent for database migrations"
        role:
          type: string
          example: "Database Engineer"
        systemInstructions:
          type: string
          example: "You are an expert SQL engineer. Analyze schemas and generate queries."
        modelRequirements:
          $ref: "#/components/schemas/ModelRequirements"
        preferredModels:
          type: array
          items:
            $ref: "#/components/schemas/ModelPreference"
        allowAnyPlaybook:
          type: boolean
          example: true

    PutAgentRequest:
      type: object
      required:
        - spec
      properties:
        spec:
          $ref: "#/components/schemas/AgentSpec"
        idempotencyKey:
          type: string

    PutAgentResponse:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/AgentSpec"

    GetAgentResponse:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/AgentSpec"
        ownerUserId:
          type: string
          description: Catalog owner (`users.user_id`). Join `GET /v1/users` for username.
        channel:
          type: string
          enum: [DRAFT, RELEASED]
        catalogTier:
          type: string
          description: "`user` for tenant-published rows; `platform` for `examples.local` artifacts stamped as platform (not boot-seeded); `marketplace` for rows installed from a trusted marketplace (read-only)."
          enum: [user, platform, marketplace]
        tier:
          type: string
          description: The same value as `catalogTier`.
        readOnly:
          type: boolean
          description: True when a marketplace installed the row; nobody but the import changes it.
        origin:
          $ref: "#/components/schemas/CatalogOrigin"

    EffectivePermissions:
      type: object
      required: [urn, version, legacy, tools, web]
      properties:
        urn:
          type: string
        version:
          type: string
          description: "`draft`, or release `X.Y.Z`."
        legacy:
          type: boolean
        tools:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveTool"
        internet:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EffectiveInternet"
        web:
          $ref: "#/components/schemas/EffectiveWeb"

    EffectiveWeb:
      type: object
      required: [enabled, available, note]
      description: |
        Web search and fetch for this agent. When `enabled`, the web broker's
        tools appear in `tools` (source `hosted <broker>`); when off they are
        not offered to the agent at all.
      properties:
        enabled:
          type: boolean
          description: "`permissions.web.enabled`. Always false for a legacy agent."
        available:
          type: boolean
          description: An enabled web broker with registered tools exists on this node.
        note:
          type: string
          description: Why web is off or unusable. Empty when it works.

    EffectiveTool:
      type: object
      required:
        - toolName
        - target
        - source
        - decision
        - decidingScope
        - decidingRule
        - locked
        - lockedReason
        - isDefault
        - defaultLabel
      properties:
        toolName:
          type: string
        target:
          type: string
        source:
          type: string
          description: "`builtin`, `skill <name> vX`, or `mcp <server>`."
        decision:
          type: string
          enum: [allow, ask, deny]
        decidingScope:
          type: string
          description: "`agent`, `source`, `org`, `platform`, or `legacy policy`."
        decidingRule:
          type: string
        locked:
          type: boolean
        lockedReason:
          type: string
        isDefault:
          type: boolean
        defaultLabel:
          type: string
          description: "Short default label, for example `default (read-only)`. Empty when `isDefault` is false."

    EffectiveInternet:
      type: object
      properties:
        default:
          type: string
          enum: [allow, deny]
        rules:
          type: array
          items:
            type: object
            properties:
              target:
                type: string
              decision:
                type: string
                enum: [allow, deny]

    PermissionExplanation:
      type: object
      required: [urn, version, kind, decision, text, deciding, scopes]
      properties:
        urn:
          type: string
        version:
          type: string
        kind:
          type: string
          enum: [tool, host]
        toolName:
          type: string
        target:
          type: string
        host:
          type: string
        decision:
          type: string
          enum: [allow, ask, deny]
        text:
          type: string
          description: §IV.9 CLI rendering.
        deciding:
          $ref: "#/components/schemas/ExplainScope"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ExplainScope"

    ExplainScope:
      type: object
      required: [scope, decision, rule, origin, deciding]
      properties:
        scope:
          type: string
        decision:
          type: string
        rule:
          type: string
        origin:
          type: string
        deciding:
          type: boolean

    PermissionPresets:
      type: object
      required: [version, presets]
      properties:
        version:
          type: integer
        presets:
          type: array
          items:
            $ref: "#/components/schemas/PermissionPreset"

    AgentPermissions:
      type: object
      description: |
        Author JSON from design §IV.2. Enums use the short spelling
        (`bySideEffect`, `allow`, `ask`, `deny`), not the proto names.
      properties:
        tools:
          $ref: "#/components/schemas/ToolPermissions"
        internet:
          $ref: "#/components/schemas/InternetPermissions"
        web:
          $ref: "#/components/schemas/WebPermissions"
        advanced:
          type: array
          description: Optional hand-written Cedar policy artifact refs.
          items:
            type: object

    WebPermissions:
      type: object
      description: |
        Web access (search and fetch). Absent means off.
        Author JSON: `{"web": {"enabled": true}}`.
      properties:
        enabled:
          type: boolean

    ToolPermissions:
      type: object
      properties:
        default:
          type: string
          enum: [allow, ask, deny, bySideEffect]
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PermissionRule"

    InternetPermissions:
      type: object
      properties:
        default:
          type: string
          enum: [allow, deny]
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PermissionRule"

    PermissionRule:
      type: object
      required: [target, decision]
      properties:
        target:
          type: string
        decision:
          type: string
          enum: [allow, ask, deny]

    PermissionPreset:
      type: object
      required: [id, name, description, version, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        permissions:
          $ref: "#/components/schemas/AgentPermissions"

    ListAgentsResponse:
      type: object
      properties:
        specs:
          type: array
          items:
            $ref: "#/components/schemas/AgentSpec"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"
        records:
          type: array
          description: Same rows as `specs`, with owner / channel / catalog tier.
          items:
            $ref: "#/components/schemas/AgentRecord"

    AgentRecord:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/AgentSpec"
        ownerUserId:
          type: string
        channel:
          type: string
          enum: [DRAFT, RELEASED]
        catalogTier:
          type: string
          enum: [user, platform, marketplace]
        tier:
          type: string
          description: The same value as `catalogTier`.
        readOnly:
          type: boolean
          description: True when a marketplace installed the row; nobody but the import changes it.
        origin:
          $ref: "#/components/schemas/CatalogOrigin"
        version:
          $ref: "#/components/schemas/Version"
          description: "Released rows carry their semver. The owner's draft carries prerelease `draft`; its numbers are a storage slot, not a version."

    PolicyRecord:
      type: object
      properties:
        resourceId:
          $ref: "#/components/schemas/ResourceId"
        cedar:
          type: string
          description: Cedar policy source text
        digest:
          type: string
          description: SHA-256 hex digest of cedar bytes
        catalogTier:
          type: string
          description: "`user` for caller-published rows; `platform` for `examples.local` artifacts stamped as platform (not boot-seeded)."
          enum: [user, platform]
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
        channel:
          type: string
          enum: [DRAFT, RELEASED]
        version:
          $ref: "#/components/schemas/Version"
          description: "Released rows carry their semver. The owner's draft carries prerelease `draft`; its numbers are a storage slot, not a version."

    PutPolicyRequest:
      type: object
      required:
        - urn
        - cedar
      properties:
        urn:
          type: string
        cedar:
          type: string
        idempotencyKey:
          type: string

    PutPolicyResponse:
      type: object
      properties:
        record:
          $ref: "#/components/schemas/PolicyRecord"

    GetPolicyResponse:
      type: object
      properties:
        record:
          $ref: "#/components/schemas/PolicyRecord"

    ListPoliciesResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRecord"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"

    PlaybookSpec:
      type: object
      properties:
        resourceId:
          $ref: "#/components/schemas/ResourceId"
        displayName:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        activation:
          $ref: "#/components/schemas/PlaybookActivation"

    PlaybookActivation:
      type: object
      description: |
        How the model decides to start this playbook. The agent offers every
        attached playbook's `when` to the model, which starts one with the
        `start_playbook` host tool. A draft may omit this; **publishing (a
        release) requires `when`**. Additive field 10 of `PlaybookSpec`.
      properties:
        when:
          type: string
          maxLength: 280
          description: One or two sentences saying when to start this playbook. Required at release.
          example: Use when the user wants to draft a pull request.
        examples:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 200
          description: Sample requests. Need a `when`.
        mode:
          type: string
          enum: [ACTIVATION_MODE_UNSPECIFIED, ACTIVATION_MODE_ASK, ACTIVATION_MODE_AUTO]
          description: |
            `ASK` (the default) shows the user an ask card first. `AUTO` starts
            without asking, only for playbooks with no mutating step. It is
            refused at save when a step binds a mutating builtin tool, and the
            host still asks at start time when a step can change something, or
            when the run has seen untrusted text and a step lets the model pick
            its tool.

    PutPlaybookRequest:
      type: object
      required:
        - spec
      properties:
        spec:
          $ref: "#/components/schemas/PlaybookSpec"
        idempotencyKey:
          type: string

    PutPlaybookResponse:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/PlaybookSpec"

    GetPlaybookResponse:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/PlaybookSpec"

    SkillManifest:
      type: object
      description: Skill manifest as stored in catalog metadata and package `spec` (proto `vam.v1.SkillManifest`).
      properties:
        resourceId:
          $ref: "#/components/schemas/ResourceId"
        version:
          $ref: "#/components/schemas/Version"
        description:
          type: string
          example: "Offline calculator skill; filesystem and todo tools are runtime builtins."
        systemExtension:
          type: string
          description: Instruction extension appended to agent baseline system prompt.
          example: "Use 'calculator' for math. Use runtime primitives for workspace files."
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolSpec"
        runtimeCompatibility:
          $ref: "#/components/schemas/CompatibilityRange"
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
        locators:
          type: array
          items:
            $ref: "#/components/schemas/ResourceLocator"

    Version:
      type: object
      description: Semantic version (SemVer 2.0.0).
      properties:
        major:
          type: integer
          example: 1
        minor:
          type: integer
          example: 0
        patch:
          type: integer
          example: 0
        prerelease:
          type: string
          description: Draft packages use `"draft"`; released rows use empty string.
          example: "draft"
        build:
          type: string
          example: ""

    CompatibilityRange:
      type: object
      properties:
        minVersionInclusive:
          type: string
          example: ">=1.0.0"
        maxVersionExclusive:
          type: string
          example: "<2.0.0"

    ResourceLocator:
      type: object
      properties:
        provider:
          type: string
          example: "git"
        uri:
          type: string
          example: "https://example.com/skills/assistant-tools.git"
        coordinates:
          $ref: "#/components/schemas/RegistryCoordinates"

    RegistryCoordinates:
      type: object
      properties:
        registry:
          type: string
          example: "local.vam.dev"
        namespace:
          type: string
          example: "vam"
        name:
          type: string
          example: "assistant-tools"

    ResourceMetadata:
      type: object
      properties:
        revision:
          type: integer
          format: int64
          example: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        createdBy:
          $ref: "#/components/schemas/ResourceId"
        parentRevisionHash:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/Label"

    Label:
      type: object
      properties:
        key:
          type: string
        value:
          type: string

    PaginationResponse:
      type: object
      nullable: true
      properties:
        nextPageToken:
          type: string
          description: Opaque token for the next page; empty when no more results.

    ToolSpec:
      type: object
      properties:
        name:
          type: string
          example: "calculator"
        description:
          type: string
          example: "Perform basic arithmetic operations."
        inputSchemaJson:
          type: string
          description: JSON Schema (draft-07) for tool arguments.
        localExec:
          $ref: "#/components/schemas/LocalExecSpec"
        mcpServer:
          $ref: "#/components/schemas/McpServerSpec"
        builtin:
          $ref: "#/components/schemas/BuiltinExecSpec"
        hostExec:
          $ref: "#/components/schemas/HostExecSpec"
        requiredSecrets:
          type: array
          items:
            $ref: "#/components/schemas/SecretRequirement"
        sideEffect:
          type: integer
          description: "1=READ_ONLY, 2=MUTABLE_LOCAL, 3=MUTABLE_EXTERNAL"
        outputSchemaJson:
          type: string
        ui:
          $ref: "#/components/schemas/ToolUi"
        egress:
          type: array
          description: Hosts this tool may reach through the member's connection. Needs a `localExec` provider and `requiresConnector` on the skill.
          items:
            $ref: "#/components/schemas/ToolEgress"
        timeout:
          type: object
          properties:
            seconds:
              type: integer
              format: int64
            nanos:
              type: integer

    ToolEgress:
      type: object
      description: |
        One host, with methods and paths, a tool may reach through a connector binding. A request is
        admitted when its path equals one of `paths` or lies at or beneath one of `pathPrefixes`.
        At least one of `pathPrefixes` or `paths` is required.
      properties:
        binding:
          type: string
          example: graph
        host:
          type: string
          description: Exact lowercase DNS name.
          example: graph.microsoft.com
        methods:
          type: array
          items:
            type: string
            enum: [GET, HEAD, POST, PUT, PATCH, DELETE]
        pathPrefixes:
          type: array
          description: Each starts with `/` (`/` is the whole host). Admits the prefix and everything beneath it, on a segment boundary. Use for reads.
          items:
            type: string
          example: ["/v1.0/me/messages"]
        paths:
          type: array
          description: |
            Exact paths, each starting with `/` and with no trailing `/`, `.`/`..` segment, `//`, `?`, `#` or `%`.
            A request is admitted only when its path equals one of these after the usual decoding
            (so `/v1.0/me/events` does not admit `/v1.0/me/events/x/forward` or `/v1.0/me/events/`).
            Use for writes; publish warns when a write method is declared by `pathPrefixes`.
          items:
            type: string
          example: ["/v1.0/me/events"]

    ToolUi:
      type: object
      description: Names of the skill's cards for one tool. Names match `[a-z][a-z0-9_]{0,63}`.
      properties:
        show:
          type: string
          description: Card shown on a successful result. Needs a non-empty `outputSchemaJson`.
        ask:
          type: string
          description: Card shown when a call of this tool asks for approval.

    ApprovalCard:
      type: object
      properties:
        jig:
          type: string
          description: "`<skill>.<jig>`"
        ir:
          type: object
          additionalProperties: true
        data:
          type: object
          additionalProperties: true

    LocalExecSpec:
      type: object
      properties:
        command:
          type: string
          example: "bun"
        entrypoint:
          type: string
          example: "/mnt/drive9/skills/assistant-tools/execute.js"
        defaultArgs:
          type: array
          items:
            type: string
        envVars:
          type: object
          additionalProperties:
            type: string

    McpServerSpec:
      type: object
      properties:
        command:
          type: string
        args:
          type: array
          items:
            type: string
        envVars:
          type: object
          additionalProperties:
            type: string

    BuiltinExecSpec:
      type: object
      properties:
        version:
          type: string
          example: "v1"

    HostExecSpec:
      type: object
      properties:
        adapterId:
          type: string
        config:
          type: object
          additionalProperties:
            type: string

    SecretRequirement:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        scope:
          type: integer
          description: "0=unspecified (defaults to either), 1=org, 2=user, 3=either"
          example: 3

    SecretRequirementStatus:
      type: object
      properties:
        bindingId:
          type: string
        scope:
          type: integer
          description: "Requested scope (unspecified reported as either): 1=org, 2=user, 3=either"
        required:
          type: boolean
        configured:
          type: boolean
        satisfiedScope:
          type: integer
          description: "Where satisfied when configured: 1=org, 2=user, 0=missing"

    ResolveSecretRequirementsRequest:

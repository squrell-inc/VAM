    ApprovalRequest:
      type: object
      description: |
        A pending approval. An approval for the `start_playbook` host tool
        (`claims.targetToolName == "start_playbook"`) is the ask card for a
        model-chosen playbook start:

        - `requestedArgs`: `{ "urn": "<playbook urn>", "inputs": { ... } }`, with
          `inputs` prefilled from the request. `inputs` is `{}` for a playbook with no inputs.
        - `approvalMessage`: "Start playbook '<name>'? <when>".
        - `amendableSchema` (JSON Schema draft-07): `title` is the playbook name,
          `description` its `when`; `x-vam-playbook` is `{ "urn", "version", "has_inputs" }`;
          `properties.urn` is `{ "const": "<urn>" }` and `properties.inputs` is the
          playbook's `input_schema`. When `has_inputs` is `false`, `properties.inputs`
          is `{ "type": "object", "properties": {}, "additionalProperties": false }`
          and the app shows no form (Confirm and Decline only).
        - Approve starts it with `requestedArgs`. Amend sends the full
          `{ "urn", "inputs" }` as `amendedArgs`; `urn` must be unchanged and
          `inputs` must satisfy the input schema. Reject declines. "Always" is never offered.
      properties:
        claims:
          $ref: "#/components/schemas/ApprovalRequestClaims"

    ApprovalStatus:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/ResourceId"
        state:
          type: integer
          description: "1=PENDING, 2=APPROVED, 3=AMENDED, 4=REJECTED, 5=EXPIRED"
          example: 1
        decisionRevision:
          type: integer
          format: int64

    ListApprovalsResponse:

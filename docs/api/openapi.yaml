    ConnectMcpOauthInput:
      type: object
      required:
        - resource
        - authorizationServer
        - tokenEndpoint
        - clientId
        - registrationMethod
      properties:
        resource:
          type: string
          format: uri
          description: Canonical MCP server URI (RFC 8707 resource). Must be https.
        authorizationServer:
          type: string
          format: uri
          description: Authorization server issuer URL (https).
        tokenEndpoint:
          type: string
          format: uri
          description: OAuth token endpoint (https).
        revocationEndpoint:
          type: string
          format: uri
          description: Optional RFC 7009 revocation endpoint (https).
        clientId:
          type: string
          maxLength: 256
          description: Public OAuth client id (not a secret).
        registrationMethod:
          type: string
          enum: [dcr, cimd, manual]
        scopes:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        expiresAt:
          type: integer
          format: int64
          minimum: 0
          description: Access-token expiry (unix seconds). Typically set by token upsert.
        status:
          type: string
          enum: [connected, needs_reauth]
          description: Defaults to `connected` when omitted.
        lastRefreshAt:
          type: integer
          format: int64
          minimum: 0
          description: Timestamp (unix seconds) of the last successful host-side token refresh. Failed refreshes do not change it.
        lastRefreshError:
          type: string
          maxLength: 512
          description: Sanitized reason for the last failed host-side refresh (see `McpOauthConnectionMetadata.lastRefreshError`); must not contain token material.

    ConnectMcpRequest:
      type: object
      required:
        - connectionId
        - url
      properties:
        connectionId:
          type: string
          pattern: "^[a-z0-9_-]{1,64}$"
        url:
          type: string
          format: uri
          description: HTTPS MCP server URL (host pinned for egress).
        secretBindingId:
          type: string
          description: >
            Existing Authorization vault binding when not passing `secretValue`.
            With nonblank `secretValue`, must be omitted/empty or equal
            `{connectionId}/auth-header`. Existing header bindings are preserved
            when no new headers are written.
        secretValue:
          type: string
          writeOnly: true
          description: Shorthand for one `Authorization` header at `{connectionId}/auth-header`.
        scope:
          type: string
          enum: [org, user]
        approveDrift:
          type: boolean
          description: >
            Also approves vendor text (a tool description or the server
            instructions) that matched the injection scan, by its exact text.
            Until approved, such a description keeps the 512-character form and
            such instructions are left out of the prompt.
        acceptReadOnlyHints:
          type: boolean
          description: >
            Treat tools the server marks `readOnlyHint: true` as read-only. A
            hint alone never changes the side-effect class; it is only offered
            in `suggestedSideEffects`.
        sideEffects:
          type: object
          description: >
            Vendor tool name to side-effect override: true/external/3, local/2,
            or false/read/readonly/1 (case-insensitive strings). Missing tools
            default to mutable external; an empty map preserves existing overrides.
          additionalProperties:
            type: string
        effects:
          type: object
          description: >
            Vendor tool name to an effect declaration the owner sets: `class`
            (EFFECT_CLASS_READ, _IDEMPOTENT or _NON_IDEMPOTENT) and an optional
            `verify` read (`tool`, `argsTemplate`, `found`) that names another tool
            on this connection. A vendor hint is never used. Omitted preserves the
            stored map.
          additionalProperties:
            type: object
        headers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/ConnectMcpHeaderInput"
        authMode:
          type: string
          enum: [static, oauth]
          description: >
            Authentication mode. Defaults to `static` on create; omitted on update
            preserves the existing mode. `oauth` requires validated metadata
            (omitted metadata is preserved on update); `static` rejects supplied
            OAuth metadata. Use the token-upsert endpoint for token values.
        oauth:
          $ref: "#/components/schemas/ConnectMcpOauthInput"

    McpHeaderBinding:
      type: object
      properties:
        name:
          type: string
        bindingId:
          type: string

    McpOauthMetadata:
      type: object
      description: >
        Durable OAuth identity for an MCP connection. Never includes access tokens,
        refresh tokens, or client secrets (those live only in the secrets vault).
      properties:
        resource:
          type: string
        authorizationServer:
          type: string
        tokenEndpoint:
          type: string
        revocationEndpoint:
          type: string
        clientId:
          type: string
        registrationMethod:
          type: string
          enum: [dcr, cimd, manual]
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: integer
          description: Access-token expiry as unix seconds, when known. Omitted if unknown.
        status:
          type: string
          enum: [connected, needs_reauth]
          description: >
            Stored OAuth status. vamd persists `needs_reauth` when a tool-call
            refresh (after an MCP 401) fails definitively: the authorization
            server rejects the grant (e.g. `invalid_grant`, `invalid_client`,
            or any 4xx other than 408/429) or no refresh-token binding exists.
            While `needs_reauth`, OAuth tool calls fail immediately with a tool
            error prefixed `mcp needs_reauth:` and neither the MCP server nor the
            authorization server is contacted. Transient failures (network,
            5xx, 408, 429, malformed token response, local storage) record
            `lastRefreshError` but keep `connected`. A successful refresh or a
            token upsert sets `connected` again. Vault bindings are never
            deleted on refresh failure. List, connect, and snapshot responses
            read the stored value; they never trigger a refresh.
        hasRefreshBinding:
          type: boolean
          description: >
            True when the vault holds `{connectionId}/oauth/refresh-token`.
            The refresh token is never returned. Present on OAuth connection
            objects only (`oauth` is null for static connections).
        lastRefreshAt:
          type: integer
          description: Unix seconds of the last successful host-side token refresh.
        lastRefreshError:
          type: string
          maxLength: 512
          description: >
            Sanitized reason for the last failed refresh; cleared by a
            successful refresh or token upsert, and omitted from the JSON when
            clear. Either an allowlisted RFC 6749 error code (`invalid_grant`,
            `invalid_client`, `unauthorized_client`, `invalid_scope`,
            `invalid_request`, `unsupported_grant_type`, `invalid_target`) or a
            fixed vamd message such as `refresh token unavailable`,
            `OAuth token endpoint rejected refresh (HTTP 403)`,
            `OAuth token endpoint unavailable (HTTP 503)`,
            `OAuth token endpoint rejected` (restricted address; sets `needs_reauth`),
            `OAuth token endpoint could not be resolved` (DNS failure; transient),
            `OAuth token endpoint request failed`, or `refresh failed`.
            Raw authorization-server bodies, `error_description`, URLs, and
            token-shaped text are replaced with `refresh failed` before persist
            and again before list, connect, snapshot, and token-upsert JSON.
            Disconnect omits this field. Never contains response bodies or token
            material.

    McpConnectionView:
      type: object
      properties:
        connectionId:
          type: string
        scope:
          type: string
        ownerUserId:
          type: string
        url:
          type: string
        secretBindingId:
          type: string
          description: Authorization vault binding when present (read-compat).
        authMode:
          type: string
          enum: [static, oauth]
          description: Defaults to `static` for connections created before OAuth support.
        oauth:
          allOf:
            - $ref: "#/components/schemas/McpOauthMetadata"
          nullable: true
          description: Present only when `authMode` is `oauth`. Never includes token values.
        headerBindings:
          type: array
          items:
            $ref: "#/components/schemas/McpHeaderBinding"
        tools:
          type: array
          description: >
            The pinned `tools/list`. Besides `name`, `description` and
            `inputSchema`, each tool carries the server's optional `title`,
            `annotations` (`readOnlyHint`, `destructiveHint`, `idempotentHint`,
            `openWorldHint`, `title`) and `outputSchema`. All of these are
            vendor claims.
          items:
            type: object
        instructions:
          type: string
          description: >
            The server's `instructions` from `initialize`. Empty when the server
            sent none or the row was stored before this field existed.
        suggestedSideEffects:
          type: object
          description: >
            Tools the server marks `readOnlyHint: true` whose class is still
            mutating, mapped to `read`. A suggestion only.
          additionalProperties:
            type: string
        flaggedVendorText:
          type: array
          description: >
            Vendor texts (`tool:<name>` or `instructions`) with an injection-scan
            finding that the owner has not approved. Carries rule ids, never the
            text.
          items:
            type: object
            properties:
              target:
                type: string
              rules:
                type: array
                items:
                  type: string
        capabilities:
          type: array
          items:
            type: object
        sideEffects:
          type: object
          additionalProperties:
            type: integer
        effects:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: integer
        updatedAt:
          type: integer

    ConnectMcpResponse:
      type: object
      properties:
        connection:
          $ref: "#/components/schemas/McpConnectionView"

    ListMcpConnectionsResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/McpConnectionView"

    RefreshMcpRequest:
      type: object
      properties:
        approveDrift:
          type: boolean
          description: >
            Accept added or changed tools, a changed annotation or server
            instruction, and approve flagged vendor text by its exact text.
        acceptReadOnlyHints:
          type: boolean
          description: "Treat `readOnlyHint: true` tools as read-only."

    RefreshMcpResponse:
      type: object
      properties:
        connection:
          $ref: "#/components/schemas/McpConnectionView"
        drift:
          type: string
          enum: [identical, shrunk, reapproved, upgraded]
        removedTools:
          type: array
          items:
            type: string

    UpsertMcpOauthTokensRequest:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          writeOnly: true
          description: OAuth access token. Stored at `{id}/oauth/access-token`; never returned.
        refreshToken:
          type: string
          writeOnly: true
          description: OAuth refresh token. Stored at `{id}/oauth/refresh-token`; never returned.
        clientSecret:
          type: string
          writeOnly: true
          description: >
            Optional confidential-client secret from DCR. Stored at
            `{id}/oauth/client-secret`. Omit for public clients. Omitted or blank
            values preserve any existing binding.
        expiresAt:
          type: integer
          format: int64
          minimum: 0
          description: Access-token expiry as unix seconds. Takes precedence over `expiresIn`, which is ignored when this field is supplied.
        expiresIn:
          type: integer
          format: int64
          minimum: 0
          description: Access-token lifetime in seconds from server time; used when `expiresAt` is omitted. If both expiry fields are omitted, stored expiry is preserved.
        status:
          type: string
          enum: [connected, needs_reauth]
          description: Defaults to `connected` on successful upsert.

    UpsertMcpOauthTokenBindings:
      type: object
      properties:
        accessToken:
          type: string
          description: Vault binding id `{connectionId}/oauth/access-token`.
        refreshToken:
          type: string
          description: Vault binding id `{connectionId}/oauth/refresh-token`.
        clientSecret:
          type: string
          description: Vault binding id `{connectionId}/oauth/client-secret` when a secret was written.

    UpsertMcpOauthTokensResponse:
      type: object
      properties:
        connection:
          $ref: "#/components/schemas/McpConnectionView"
        bindings:
          $ref: "#/components/schemas/UpsertMcpOauthTokenBindings"

    ListMarketplacesResponse:
      type: object
      required: [marketplaces]
      properties:
        marketplaces:
          type: array
          items:
            $ref: "#/components/schemas/Marketplace"
        gitAvailable:
          type: boolean
    MarketplaceResponse:
      type: object
      required: [marketplace]
      properties:
        marketplace:
          $ref: "#/components/schemas/Marketplace"
    AddMarketplaceRequest:
      type: object
      required: [url, publisherDomain]
      additionalProperties: false
      properties:
        url:
          type: string
          description: https URL of a Git repository.
        publisherDomain:
          type: string
          description: The domain the admin confirms the index declares.
    Marketplace:
      type: object
      required: [id, name, url, publisherDomain, trust, preconfigured, enabled, tagsSeen]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        publisherDomain:
          type: string
        trust:
          type: string
          enum: [squrell, unverified]
        preconfigured:
          type: boolean
        enabled:
          type: boolean
        lastCheckedAt:
          type: integer
          description: Unix seconds; absent until the first read.
        lastError:
          type: string
          description: Why the last read failed; absent when it was clean.
        indexDigest:
          type: string
          description: SHA-256 of the `marketplace.json` last read.
        tagsSeen:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string
              commit:
                type: string
    ListMarketplaceListingsResponse:
      type: object
      required: [listings]
      properties:
        listings:
          type: array
          items:
            type: object
            required: [id, displayName, description, ref, installed, updateAvailable]
            properties:
              id:
                type: string
              displayName:
                type: string
              description:
                type: string
              ref:
                type: string
                description: The tag the listing installs at.
              commit:
                type: string
                description: The commit the tag is pinned to.
              requiresNode:
                type: string
              connector:
                type: string
              installed:
                type: object
                nullable: true
                properties:
                  ref:
                    type: string
                  commit:
                    type: string
                  installedAt:
                    type: integer
              updateAvailable:
                type: boolean
              artifacts:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                    path:
                      type: string
                    urn:
                      type: string
              summary:
                type: object
                description: tools, egress (per host), connector, and the per-artifact capability summaries.
              error:
                type: string
    InstallListingResponse:
      type: object
      required: [marketplace, listing, installed]
      properties:
        marketplace:
          type: string
        listing:
          type: string
        installed:
          type: object
          required: [ref, commit, changed, artifacts]
          properties:
            ref:
              type: string
            commit:
              type: string
            changed:
              type: boolean
              description: False when the listing was already installed at this tag.
            capabilitiesChanged:
              type: array
              description: URNs of artifacts installed before whose capability summary (what they can reach or do) differs from the one just installed. Empty on a first install. A connector URN here was set back to not enabled in the same transaction and its members' connections need reconnecting.
              items:
                type: string
            artifacts:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                  urn:
                    type: string
                  version:
                    type: string
                    description: The release the install wrote or kept (`X.Y.Z`).
                  digest:
                    type: string
    CatalogOrigin:
      type: object
      description: Where a catalog row a marketplace installed came from. Absent on every other row.
      properties:
        marketplace:
          type: string
          description: Id of the trusted marketplace on this node (`squrell` for the preconfigured one).
        listing:
          type: string
        ref:
          type: string
        commit:
          type: string
        packageDigest:
          type: string
    ListConnectorsResponse:
      type: object
      required: [connectors]
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorEntry"
    PutConnectorNodeRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        consent:
          type: [object, "null"]
          additionalProperties: false
          required: [tenantId]
          properties:
            tenantId:
              type: string
              description: Microsoft tenant GUID the admin consented for.
    PutConnectorConnectionRequest:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, idToken]
      properties:
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        idToken:
          type: string
          writeOnly: true
          description: OpenID Connect id token; read for `tid` and `preferred_username`, not stored.
        expiresIn:
          type: integer
          minimum: 0
          description: Seconds the access token lives (optional).
    ConnectorEntry:
      type: object
      required: [id, displayName, publisher, description, icon, state, label, node]
      properties:
        id: { type: string }
        displayName: { type: string }
        publisher: { type: string }
        description: { type: string }
        icon: { type: string }
        state:
          type: string
          enum: [askAdmin, waitingForConsent, connect, connected, needsReconnect]
        label:
          type: string
          description: "The tile text; for a connected REST connector, the account (`preferred_username`)."
        node:
          type: object
          required: [enabled, configured]
          properties:
            enabled: { type: boolean }
            configured:
              type: boolean
              description: False while the client id is the shipped placeholder.
            consent:
              type: object
              properties:
                tenantId: { type: string }
                recordedAt: { type: integer }
                recordedBy:
                  type: string
                  description: Only for callers with `users:admin`.
            updatedAt:
              type: integer
              description: Only for callers with `users:admin`.
        source:
          type: string
          enum: [builtin, marketplace]
        trust:
          type: string
          enum: [squrell, unverified]
          description: "`squrell` for a built-in connector; otherwise the trust of the marketplace that installed it."
        origin:
          type: object
          description: Marketplace connectors only. Where the installed definition came from.
          properties:
            marketplace: { type: string }
            marketplaceName: { type: string }
            publisherDomain: { type: string }
            listing: { type: string }
            ref: { type: string }
            commit: { type: string }
            packageDigest: { type: string }
        capabilities:
          type: object
          description: Marketplace connectors only; for callers with `users:admin`, or for everyone once the connector is enabled. What the admin approves when enabling it; an update that changes it sets the connector back to not enabled.
          properties:
            publisher: { type: string }
            provider: { type: string }
            profile: { type: string }
            clientId: { type: string }
            clientSecret: { type: string }
            orgConsent: { type: string }
            scopes:
              type: array
              items: { type: string }
            mcpUrl: { type: string }
            mcpHost: { type: string }
            hosts:
              type: array
              items: { type: string }
            tools:
              type: array
              items:
                type: object
                properties:
                  remote: { type: string }
                  sideEffect: { type: string }
                  default: { type: string }
        urn: { type: string, description: Present once enabled. }
        version: { type: string, description: Present once enabled. }
        provider:
          type: object
          description: Present once enabled. `clientId` is this node's; there is no `resource`.
        connection:
          type: object
          description: Present once enabled.
        bindings:
          type: array
          items: { type: object }
          description: Present once enabled, for REST connectors.
        mcp:
          type: object
          description: Present once enabled, for MCP connectors (url and vetted tools).
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: "InvalidArgument"
        message:
          type: string
          example: "workspaceRefUri is required"
        retryable:
          type: boolean
          example: false

openapi: 3.1.0
info:
  title: VAMD (Virtual Agent Machine Daemon) Control Plane API
  version: 1.0.0
  description: |
    REST/JSON Control Plane API for operating the Virtual Agent Machine (VAM).
    Supports registering Agent specifications, executing isolated agent runs on workspaces,
    tracking conversation threads, monitoring microVM sessions, and handling Human-in-the-Loop (HITL) approvals.
servers:
  - url: https://127.0.0.1:8080
    description: Local VAMD daemon. TLS is on by default; plain HTTP only with --insecure-dev.

security:
  - BearerAuth: []

paths:
  /v1/health:
    get:
      summary: Health check
      description: Returns the health and serving status of the VAMD orchestrator node.
      security: []
      responses:
        "200":
          description: Node is healthy and serving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: 1

  /v1/login:
    post:
      summary: Create a session token
      description: |
        Exchange a username and password for a short-lived access token and refresh token.
        `username` is a login name or a user id. A login name matches ignoring letter case.
        Wrong password, unknown user, and password-less users return 401.
        No email, OIDC, SAML, or SCIM.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: local
              password: "********"
      responses:
        "200":
          description: Session issued. Store token + refreshToken locally; do not log them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid username or password.

  /v1/login/refresh:
    post:
      summary: Refresh a session token
      description: Rotate a refresh token into a new access + refresh pair. The previous family is revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Refresh token missing, expired, or revoked.

  /v1/logout:
    post:
      summary: Revoke the current session
      description: >-
        Revokes the session-token family for a Bearer session token. API keys are a no-op (`revoked: false`).
      responses:
        "200":
          description: Logout result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Missing or invalid bearer token.

  /v1/me:
    get:
      summary: Get the authenticated caller
      description: |
        Identity read for any authenticated caller (password session or API key).
        Members can call this; it is not `users:admin`. Returns `userId`, `username`,
        `role`, and the scopes on this bearer (not necessarily the role default).
        Deactivated users and revoked keys return 401, not an identity body.
      responses:
        "200":
          description: Caller identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
              example:
                userId: alice
                username: alice
                role: member
                scopes:
                  - sessions:write
                  - runs:write
                  - approvals:write
                  - node:read
                  - secrets:write
        "401":
          description: Missing, invalid, deactivated, or revoked bearer.

  /v1/me/password:
    post:
      summary: Change your own password
      description: |
        The signed-in user sets a new password for themselves. Any role may call it,
        the operator included. It needs a **password session** (`vam login`); an API
        key is refused with 403. The body carries the current password and the new one.
        Both are write-only: they are never logged or returned, and the password is
        stored as argon2id only.

        **Every session is signed out, this one included. API keys stay.** The answer
        sets `reloginRequired` to true; sign in again with the new password.

        **Five wrong current passwords per user, then a wait.** The limit is per user
        and always on (it does not depend on `VAMD_RATE_LIMIT`). One more try comes back
        every 60 seconds; the 429 says how long to wait. A correct password, a refused
        new password and a missing key do not count against it.

        The new password must differ from the current one and follow the same rules as
        any password (not empty, at most 1024 bytes). A reset by an admin
        (`POST /v1/users/{id}/password`) does not need the current password.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMyPasswordRequest"
      responses:
        "200":
          description: Password replaced. Every session of the user was revoked. API keys unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeMyPasswordResponse"
        "400":
          description: |
            `currentPassword is required`; `new password must differ from the current
            password`; a password rule (`password must be non-empty`, `password exceeds
            1024 bytes`); or no `Idempotency-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, expired, deactivated or revoked bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: |
            Two causes, told apart by `message`. `changing a password needs a password
            session (vam login); API keys cannot change a password`: the caller used an
            API key. `current password is incorrect`: the current password did not match;
            this counts against the attempt limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: |
            Too many wrong current passwords. `message` reads `too many wrong password
            attempts; retry after Ns`. `code` is `RESOURCE_EXHAUSTED`.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
            X-VAM-Rate-Limited-Reason:
              schema:
                type: string
                enum: [password-attempt-rate]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/node:
    get:
      summary: Get node status
      description: |
        Retrieve resource allocation, session capacity, and drain status of the local node.
        Requires `node:read`. Member, org_admin, publisher, and operator role defaults include
        that scope, so password sessions and default-scope API keys return 200. The VAM app may
        probe this after GET /v1/health. The snapshot is node capacity, not a list of other
        users' runs. A key minted without `node:read` is 403.
      responses:
        "200":
          description: Node status details. Member, org admin, and operator callers with `node:read` receive this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNodeStatusResponse"
              example:
                status:
                  nodeId: "local"
                  listenAddr: "127.0.0.1:8080"
                  draining: false
                  ready: true
                  activeSessions: 2
                  maxSessions: 64
                  totalVcpusAllocated: 4
                  maxVcpus: 128
                  totalMemoryMibAllocated: 1024
                  maxMemoryMib: 65536
                  updatedAt:
                    seconds: 1787737000
                    nanos: 0
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Authenticated caller is missing `node:read`.

  /v1/node/allowed-models:
    get:
      summary: List operator-allowed models
      description: |
        Return the operator-published model ids this node may use on CreateRun
        (`inputs.model`), the operator's `defaultModel` when set, and the
        `effectiveDefaultModel` a run gets when nothing names a model. Empty
        list means unrestricted (not published yet). Requires `node:read`. Role defaults include that scope, so members can
        load the composer picker.
      responses:
        "200":
          description: Allowed model ids, in operator order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOperatorAllowedModelsResponse"
              example:
                models:
                  - openai/gpt-4o
                  - anthropic/claude-sonnet-4
                defaultModel: openai/gpt-4o
                effectiveDefaultModel: openai/gpt-4o
                defaultGateway: vercel
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Authenticated caller is missing `node:read`.
    put:
      summary: Replace operator-allowed models
      description: |
        Replace the node model allowlist. Requires `brokers:admin` (operator
        only; org admin is 403). Idempotency-Key is required. When the list is
        non-empty, a model named in CreateRun `inputs.model` must match an entry
        or the run is 400 InvalidArgument (the answer names the allowed models).
        That is the only refusal: an agent's preferred models never block a run.
        `defaultModel` sets the node default (`""` clears it, omitted leaves it)
        and must be on a non-empty list. `defaultGateway` (`vercel` or
        `openrouter`, omitted leaves it) sets where a `provider/model` id the
        catalog does not know is sent; the host decides the provider at run
        creation and a bare unknown id is 400.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutOperatorAllowedModelsRequest"
            example:
              models:
                - openai/gpt-4o
                - anthropic/claude-sonnet-4
      responses:
        "200":
          description: The stored allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutOperatorAllowedModelsResponse"
        "400":
          description: Empty model ids, a default model off the list, or missing Idempotency-Key.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Authenticated caller is missing `brokers:admin`.

  /v1/keys:
    post:
      summary: Create an API key
      description: Generate a new scoped API key for authenticating with the VAMD control plane.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
            example:
              name: "frontend-dashboard-key"
              principal: "User::developer"
              scopes:
                - "runs:write"
                - "sessions:write"
                - "catalog:write"
                - "approvals:write"
                - "node:read"
      responses:
        "200":
          description: API key created successfully. The secret is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponse"
              example:
                key:
                  keyId:
                    urn: "key-a1b2c3d4"
                  name: "frontend-dashboard-key"
                  principal: "User::developer"
                  scopes:
                    - "runs:write"
                    - "sessions:write"
                    - "catalog:write"
                    - "approvals:write"
                    - "node:read"
                  createdAt:
                    seconds: 1787737000
                    nanos: 0
                secret: "vam_sk_948fbc102e3b4a"
    get:
      summary: List API keys
      description: |
        List API keys and their assigned scopes. With no `holder`, only `http` keys (the keys
        and bearer secrets of people and scripts). `holder=broker` lists the grants issued to
        brokers, `holder=all` both. Grants are always owner-scoped, `keys:admin` included. A
        grant row carries its holder, target, target label, a message preview, `issuedVia`,
        `toolName` and `expiresAt`; the secret is never listed.
      parameters:
        - name: holder
          in: query
          required: false
          schema:
            type: string
            enum: [broker, all]
      responses:
        "200":
          description: List of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApiKeysResponse"

  /v1/keys/{id}:
    delete:
      summary: Revoke an API key
      description: Revoke an active API key by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "key-a1b2c3d4"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: API key revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeApiKeyResponse"

  /v1/users:
    get:
      summary: List control-plane users
      description: |
        Org admin (`users:admin`) lists every user, including deactivated rows.
        Non-admin callers receive 403.
      responses:
        "200":
          description: Users ordered by createdAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "403":
          description: Caller lacks `users:admin`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a control-plane user
      description: |
        Org admin (`users:admin`) creates a loginable user. The node generates the
        `userId` (`usr_` and 26 lower-case letters and digits); leave `userId` empty, a
        non-empty one is 400. `username` is the login name: ASCII letters, digits and
        `._+@-`, at most one `@`, at most 254 characters, not starting `usr_`, not
        `bootstrap`, and not equal to another user's id (400). Names are unique ignoring
        letter case (409). The name keeps the case it was typed in. Default role is
        `member`. Cannot create `operator`.
        Password is stored as argon2id only and is never returned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "400":
          description: Invalid username, or a non-empty `userId` (`userId is generated by the node; leave it empty`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller lacks `users:admin`, or role is operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A user with this username already exists, ignoring letter case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/users/{id}/deactivate:
    post:
      summary: Deactivate a control-plane user
      description: |
        Org admin (`users:admin`) marks the user inactive and revokes their API
        keys and session tokens. **Does not unpublish** catalog versions.
        Idempotent. Cannot deactivate `operator`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: alice
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: User deactivated (or already inactive).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeactivateUserResponse"
        "403":
          description: Caller lacks `users:admin`, or target is operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/users/{id}/password:
    post:
      summary: Reset a user's password
      description: |
        Org admin (`users:admin`) sets a new password for `id`. The admin types
        the secret and tells the person out of band — **no email**. Password is
        stored as argon2id only and is never returned.

        **Sessions are revoked. API keys stay.** Deactivate already revokes both
        keys and sessions; a password reset only invalidates `vam_st_` / `vam_rt_`
        tokens so a stolen password cannot keep an old login. CI keys remain until
        an admin revokes them (`DELETE /v1/users/{id}/keys/{key_id}`) or
        deactivates the user.

        Cannot reset `operator`. Does not create a missing user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: alice
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "200":
          description: Password replaced. Sessions revoked. Keys unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetUserPasswordResponse"
        "403":
          description: Caller lacks `users:admin`, or target is operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/users/{id}/publish-grant:
    post:
      summary: Grant catalog publish right
      description: |
        Org admin (`users:admin`) grants `publish:grant` by promoting a **member**
        to **publisher**. Already-publisher / org_admin / operator is idempotent.
        Only the artifact **owner** who also holds this live grant may
        `POST …/release`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: alice
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: User now holds `publish:grant`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantPublishRightResponse"
        "403":
          description: Caller lacks `users:admin`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Revoke catalog publish right
      description: |
        Org admin demotes a **publisher** to **member**. Revoke sticks on the
        next release even if an old token still lists `publish:grant`.
        Cannot revoke operator or org_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: alice
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Publish right revoked (or already absent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokePublishRightResponse"
        "403":
          description: Caller lacks `users:admin`, or target is operator/org_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/users/{id}/keys:
    get:
      summary: List a user's API keys
      description: |
        Org admin (`users:admin`) lists every API key owned by `id`, including
        revoked rows. `id` is a user id or a login name in any letter case; a user id wins
        when both match. Cannot target `operator`. Distinct from `GET /v1/keys`
        (caller-owned keys; `keys:admin` lists all).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: alice
      responses:
        "200":
          description: Keys ordered by createdAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApiKeysResponse"
        "403":
          description: Caller lacks `users:admin`, or target is operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Mint an API key for a user
      description: |
        Org admin (`users:admin`) creates a long-lived key bound to `id`.
        Scopes follow the target user's role (empty list uses role defaults).
        Tenants never receive `keys:admin` or `brokers:admin`. Distinct from
        operator `POST /v1/keys` (`keys:admin`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: alice
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMintUserApiKeyRequest"
      responses:
        "200":
          description: Key minted; plaintext `secret` shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponse"
        "403":
          description: Caller lacks `users:admin`, target is operator/deactivated, or invalid scopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/users/{id}/keys/{key_id}:
    delete:
      summary: Revoke a user's API key
      description: |
        Org admin (`users:admin`) revokes one key owned by `id` (a user id or a login name
        in any letter case). Foreign or
        missing keys return 404. Distinct from `DELETE /v1/keys/{id}`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: alice
        - name: key_id
          in: path
          required: true
          schema:
            type: string
          example: key-7f3a2b1c
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Key revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeApiKeyResponse"
        "403":
          description: Caller lacks `users:admin`, or target is operator/deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User or key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/catalog/reassign-owner:
    post:
      summary: Reassign catalog artifact ownership
      description: |
        Org admin (`users:admin`) sets `owner_user_id` on **every version** of a
        catalog URN (`agent`, `playbook`, `skill`, `policy`, `skill_package`).
        **Released rows stay released.** The new owner can draft the next version.
        Deactivation does not unpublish.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignCatalogOwnerRequest"
      responses:
        "200":
          description: Ownership moved. Published channel unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignCatalogOwnerResponse"
        "403":
          description: Caller lacks `users:admin`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Artifact or new owner not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/marketplaces:
    get:
      summary: List the trusted marketplaces
      description: |
        Org admin (`users:admin`); a member gets 403. The Git marketplaces this
        node trusts. The preconfigured Squrell marketplace (`id: squrell`,
        `trust: squrell`) is there from the first boot. `lastError` is absent
        when the last read was clean. `gitAvailable` is false when the node has
        no `git` binary (marketplaces cannot be read until it is installed).
      responses:
        "200":
          description: Every trusted marketplace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMarketplacesResponse"
        "403":
          description: Caller lacks `users:admin`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Trust a Git marketplace
      description: |
        Org admin. Adds a marketplace by URL and reads it once; it is stored
        only if that read is clean. The URL must be `https://` with a public
        host name (no user name, no port other than 443, no query), and every
        address the host resolves to must be public (private, loopback,
        link-local and cloud-metadata addresses are refused, again at connect
        time). `publisherDomain` is the domain the admin confirms; it must equal
        the domain the index declares and must not be one the node reserves:
        Squrell's, the org's registry domain, `local.vam.dev`, `*.local`,
        `examples.local`, another trusted marketplace's, or one the org's
        catalog already publishes under. An added marketplace is always
        `trust: unverified`. Idempotency-Key is required. 400: a refused URL or
        domain, an unreadable or broken index. 409: already trusted, or the
        domain has catalog rows.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMarketplaceRequest"
      responses:
        "201":
          description: The marketplace as listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceResponse"
        "400":
          description: Refused URL, domain or index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller lacks `users:admin`.
        "409":
          description: Already trusted, or the domain already has artifacts in the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/marketplaces/{id}:
    put:
      summary: Enable or disable a marketplace
      description: |
        Org admin. A disabled marketplace is not read and shows no listings;
        anything already installed from it stays. The preconfigured marketplace
        can be disabled too. Idempotency-Key is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The marketplace as listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceResponse"
        "403":
          description: Caller lacks `users:admin`.
        "404":
          description: No such marketplace.
    delete:
      summary: Remove an added marketplace
      description: |
        Org admin. Removes an added marketplace, its pinned tags and its
        cache. The preconfigured marketplace answers 409 (disable it instead).
        Idempotency-Key is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Removed.
        "403":
          description: Caller lacks `users:admin`.
        "404":
          description: No such marketplace.
        "409":
          description: The preconfigured marketplace cannot be removed.

  /v1/marketplaces/{id}/refresh:
    post:
      summary: Read a marketplace now
      description: |
        Org admin. Reads the index at the default branch head, the tags, and for
        each listing the artifacts at the listing's tag (checked with the same
        package check as publish). Reads only: nothing reaches the catalog.
        Each marketplace is also read on its own timer (every 6 hours,
        `VAMD_MARKETPLACE_REFRESH_SECS`). A broken index, a network failure or
        a limit answers 200 with `lastError` set on that marketplace only; the
        last good listings stay. 409: the read refused to follow a tag that now
        names another commit than the one it was pinned to (the text says
        "moved"), or a publisher domain that changed, or the marketplace is
        disabled. Idempotency-Key is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: The marketplace as listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceResponse"
        "403":
          description: Caller lacks `users:admin`.
        "404":
          description: No such marketplace.
        "409":
          description: A moved tag, a changed publisher domain, or a disabled marketplace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/marketplaces/{id}/listings:
    get:
      summary: List a marketplace's listings
      description: |
        Org admin. What the last good read found: each listing's tag and pinned
        commit, the artifacts it installs, and a capability summary (tools with
        side effect and approval, and per host the methods and paths they can
        reach; `anyPath` is true when a tool declares the whole host). A listing
        that cannot be installed as it stands carries `error`. `installed` is
        `{ ref, commit, installedAt }` once an admin installed the listing, else
        null; `updateAvailable` is true when the index now names another tag
        than the installed one and that tag exists and can be read (a refresh
        computes it and installs nothing).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The listings (none for a disabled marketplace).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMarketplaceListingsResponse"
        "403":
          description: Caller lacks `users:admin`.
        "404":
          description: No such marketplace.

  /v1/marketplaces/{id}/listings/{listing}/install:
    post:
      summary: Install a listing at its tag
      description: |
        Org admin (`users:admin`). Imports the listing at the tag the last read
        of the index named (the same import as `vam catalog import`). The tag is
        looked up again and must still name the commit it is pinned to; each
        artifact is exported from that commit, run through the package check,
        and written in one transaction as a released, read-only catalog row
        (skills, then playbooks, then agents) with owner `marketplace:<id>`,
        tier `marketplace` and an `origin` (marketplace, listing, ref, commit,
        package digest). A failing artifact leaves no row. Nothing installs by
        itself: refresh only reads.

        Admission: a listing with a `connector` installs only from the
        preconfigured Squrell marketplace (400 otherwise); every artifact URN
        must be under the marketplace's own `publisherDomain`, which for an
        added marketplace must not be Squrell's, the org's registry domain,
        `local.vam.dev`, `*.local`, `examples.local` or another marketplace's;
        refs inside the listing may name only the listing's own artifacts; a
        URN the org already publishes under is never overwritten (409). A
        moved or missing tag is refused (409, "moved"). A repeat at the same tag
        is a no-op (`changed: false`). If an older tag is installed the answer
        is 409: use `update`. Idempotency-Key is required. The optional body
        `{ "ref": "<tag>" }` is the tag the client believes it is installing;
        a different one from the index is a 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: listing
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  type: string
      responses:
        "200":
          description: Installed (or already installed at this tag).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallListingResponse"
        "400":
          description: The listing is refused (connector, reserved domain, failing package, a ref outside the listing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller lacks `users:admin`.
        "404":
          description: No such marketplace or listing.
        "409":
          description: A moved or missing tag, a different installed tag, a disabled marketplace, or org content under the same URN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/marketplaces/{id}/listings/{listing}/update:
    post:
      summary: Update an installed listing to the tag the index now names
      description: |
        Org admin. The same import as `install`, for a listing that is installed
        at an older tag. A changed agent or playbook becomes the next patch
        release, a changed skill must carry a new version in its manifest, and
        unchanged artifacts keep their release. Earlier releases stay, so an
        agent pinned to them still resolves. 409 when the listing is not
        installed. Idempotency-Key is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: listing
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  type: string
      responses:
        "200":
          description: Updated (or already at this tag).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallListingResponse"
        "400":
          description: The listing is refused, as for `install`.
        "403":
          description: Caller lacks `users:admin`.
        "404":
          description: No such marketplace or listing.
        "409":
          description: A moved or missing tag, or the listing is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/connectors:
    get:
      summary: List connectors
      description: |
        The built-in connectors (`microsoft-365`, `linear`), then the connectors
        marketplace listings installed, merged with this node's enablement and
        the caller's own state. Every entry carries `source` (`builtin` or
        `marketplace`) and `trust` (`squrell` or `unverified`); a marketplace
        connector adds `origin` (marketplace, listing, tag, commit) and, for
        an admin always and for others once it is enabled, `capabilities`
        (publisher, sign-in profile, client id, scopes, MCP server, hosts,
        vetted tools). Requires `node:read`
        (members have it). A connector the org admin has not enabled lists name,
        publisher, description and icon only, with state `askAdmin`: no scopes,
        client id or endpoint. An enabled one adds the public definition (the
        provider block carries this node's client id). `state` is one of
        `askAdmin`, `waitingForConsent`, `connect`, `connected`,
        `needsReconnect`; `label` is the text for the tile. The answer never
        carries a vault id or a token.
      responses:
        "200":
          description: One entry per built-in connector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConnectorsResponse"
              example:
                connectors:
                  - id: linear
                    displayName: Linear
                    publisher: Squrell
                    description: Issues and comments in the member's own Linear workspace.
                    icon: linear
                    state: askAdmin
                    label: Ask your admin
                    node: { enabled: false, configured: true }
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Authenticated caller is missing `node:read`.

  /v1/connectors/{id}/node:
    put:
      summary: Enable or disable a connector for the node
      description: |
        Org admin (`users:admin`; an `OrgAdmin` user or the operator key)
        enables or disables a connector for every member of the node.
        Idempotency-Key is required. `consent.tenantId` records the Microsoft
        admin consent and must be a tenant GUID (`organizations`, `common` and
        domain names are refused); a connector whose `orgConsent` is `none`
        refuses a consent (400). Omitting `consent` keeps the recorded one, so a
        disable and a re-enable need no new consent and members stay connected;
        `"consent": null` clears the record (an admin withdrawing consent).
        A connector whose client id is not configured on this node cannot be
        enabled (409). An unknown id is 404. A member gets 403 and nothing
        changes. The body is validated before anything is written.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Connector id, for example `linear` or `microsoft-365`.
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutConnectorNodeRequest"
            example:
              enabled: true
              consent:
                tenantId: 11111111-1111-4111-8111-111111111111
      responses:
        "200":
          description: The connector's list entry as the admin sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorEntry"
        "400":
          description: Unknown body field, a tenant that is not a GUID, or consent on a connector that takes none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller lacks `users:admin`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such connector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The connector is not configured on this node (its client id is the placeholder).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/connectors/{id}/connection:
    put:
      summary: Connect a REST connector (Microsoft 365)
      description: |
        The app signs the member in with Microsoft and passes the tokens here
        (`secrets:write`; Idempotency-Key required). Only for a REST connector
        (`microsoft-365`); an MCP connector connects through
        `/v1/mcp/connections`. Refused, and nothing written, unless the node
        enabled the connector (403) with an admin consent recorded (409), and
        the id token's `tid` claim is the consent tenant (409; the claim is
        read, its signature is not checked in this phase). The access and
        refresh tokens are stored as `connection`-kind vault rows
        `connector/<id>/oauth/access-token` and `.../refresh-token` (readable
        by `vamd` only, never a guest binding, not writable through
        `/v1/secrets`); the id token is read and dropped. The token endpoint
        is `https://login.microsoftonline.com/<consent tenant>/oauth2/v2.0/token`
        and cannot be set by a request. The account label comes from the id
        token's `preferred_username`. The answer is the caller's list entry
        (`state: connected`, `label` the account) and carries no token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Connector id, `microsoft-365`.
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutConnectorConnectionRequest"
      responses:
        "200":
          description: Connected. The caller's list entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorEntry"
        "400":
          description: Unknown body field, an empty token, an id token that cannot be read, or an MCP connector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller lacks `secrets:write`, or the node has not enabled the connector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such connector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No admin consent is recorded, or the sign-in is from another Microsoft tenant than the consented one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      summary: Disconnect a REST connector
      description: |
        Removes the caller's own token rows and connection row (`secrets:write`;
        Idempotency-Key required). Allowed while the connector is disabled. 404
        when the caller is not connected. The answer is the caller's list entry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: "Disconnected. The caller's list entry (state `connect`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorEntry"
        "400":
          description: An MCP connector (use `/v1/mcp/connections`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller lacks `secrets:write`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such connector, or the caller is not connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/connectors/{id}/connection/check:
    post:
      summary: Check a REST connection with one refresh
      description: |
        One token refresh at the consent tenant's token endpoint
        (`secrets:write`; Idempotency-Key required; empty or `{}` body). The
        request carries `grant_type=refresh_token`, `refresh_token`,
        `client_id` and the definition's `scope`; it never carries `resource`
        or a client secret. Success stores the new tokens and answers
        `state: connected`. A refusal by Microsoft (`invalid_grant`) answers 200
        with `state: needsReconnect`; this is the only call that moves a
        connection to `needsReconnect`. A connection from a tenant other than
        the one now consented for is `needsReconnect` without a request. When
        Microsoft cannot be reached the answer is 502 and the state is unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: The caller's list entry after the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorEntry"
        "403":
          description: Caller lacks `secrets:write`, or the node has not enabled the connector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such connector, or the caller is not connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No admin consent is recorded, or the connector is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Microsoft could not be reached or answered with a temporary error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/org/secrets:
    get:
      summary: List org-scope secrets
      description: |
        Org admin (`users:admin`) lists org-scope host secrets only (metadata
        plus 8-character fingerprint). User-scope rows are omitted. Never
        returns plaintext. Distinct from mixed `GET /v1/secrets`
        (`secrets:write`).
      responses:
        "200":
          description: Org-scope secret metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHostSecretsResponse"
        "403":
          description: Caller lacks `users:admin`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Store an org-scope secret
      description: |
        Org admin (`users:admin`) upserts an org-scope host secret. Request
        `scope` is ignored — the row is always org. Response is metadata plus
        fingerprint; plaintext is never returned. Vault writes remain
        operator / org_admin only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutHostSecretRequest"
            example:
              bindingId: "jira/auth-header"
              value: "Basic dXNlcjpwYXNz"
              kind: 2
      responses:
        "200":
          description: Secret metadata stored (secret values are never returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutHostSecretResponse"
        "403":
          description: Caller lacks `users:admin`, or is not operator/org_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/org/secrets/{id}:
    delete:
      summary: Delete an org-scope secret
      description: |
        Org admin (`users:admin`) deletes the org-scope row for `id`. A
        user-scope row with the same `binding_id` is left in place. Never
        returns plaintext.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "jira/auth-header"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Org-scope secret deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteHostSecretResponse"
        "403":
          description: Caller lacks `users:admin`, or is not operator/org_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Org-scope binding not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/agents:
    get:
      summary: List all Agents
      description: |
        Authenticated callers with `runs:write` (members) or `catalog:write` may list.
        Return the caller's own draft agents plus every tenant-released agent, newest first.
        Members without drafts see released rows only. Foreign drafts are omitted.
        Callers with `users:admin` also receive every tenant URN including other people's drafts.
        Each `records[]` entry includes `ownerUserId`, `channel`, and `catalogTier`
        (`user` / `platform`). `specs[]` remains the AgentSpec for compatibility.
        Username is not on the row — join `GET /v1/users`.
      responses:
        "200":
          description: Agent catalog entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
    put:
      summary: Register or update an Agent
      description: Create or update an Agent specification catalog entry.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAgentRequest"
            example:
              spec:
                resourceId:
                  urn: "urn:vam:agent:hub.vam.dev/acme/sql-developer"
                displayName: "SQL Developer"
                description: "Specialized agent for database migrations and queries"
                role: "Database Engineer"
                systemInstructions: "You are an expert SQL engineer. Analyze schemas and generate optimized queries."
                modelRequirements:
                  minContextTokens: 32768
                  supportsTools: true
                  supportsVision: false
                preferredModels:
                  - provider: "anthropic"
                    modelId: "claude-3-5-sonnet"
                    priority: 1
                allowAnyPlaybook: true
      responses:
        "200":
          description: Agent specification saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutAgentResponse"

  /v1/agents/{urn}:
    get:
      summary: Get Agent by URN
      description: |
        Retrieve the latest released Agent specification, or the caller's own draft when no
        released row exists. Another user's draft is 404 unless the caller has `users:admin`
        (then GET is 200). The JSON body includes `ownerUserId`, `channel`, and `catalogTier`
        beside `spec`.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:agent:hub.vam.dev/acme/sql-developer"
      responses:
        "200":
          description: Agent specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAgentResponse"

  /v1/agents/{urn}/permissions/effective:
    get:
      summary: Effective permissions of an agent
      description: |
        One row per tool the caller can see: builtins, the agent's skills, and
        the caller's visible MCP connections. Omit `version` for the owner's
        draft (a foreign draft is 404, including for other members). Set
        `version` to `X.Y.Z` for a release any member who can read the catalog
        can see. `decision` is `allow`, `ask`, or `deny`. `source` is `builtin`,
        `skill <name> vX`, or `mcp <server>`. `locked` is true when a source or
        org rule decides. `isDefault` is true when the deciding rule is the
        tool default, and `defaultLabel` is the short form (`default (read-only)`,
        `default (mutable external)`). `internet` is the host default and host
        rules. A legacy agent (`capabilityPolicy` or `hitlPolicy`, no
        `permissions`) returns rows from the legacy Cedar with
        `decidingScope` and `lockedReason` `legacy policy`, and `internet` null.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: false
          schema:
            type: string
          description: Release `X.Y.Z`. Omit for the owner's draft.
      responses:
        "200":
          description: Effective permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectivePermissions"
        "404":
          description: Draft or release is not visible to the caller.

  /v1/agents/{urn}/permissions/explain:
    get:
      summary: Explain one tool or host
      description: |
        Pass `tool` (guest name or target, such as `create_issue` or
        `skill:jira/create_issue`) or `host`. The response is the §IV.9 shape:
        per-scope rows `{scope, decision, rule, origin, deciding}` and the
        deciding row. `text` is the CLI rendering. `version` follows the same
        rule as the effective view. A legacy agent can explain a tool
        (`deciding.scope` is `legacy policy`) and rejects a host.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: false
          schema:
            type: string
        - name: tool
          in: query
          required: false
          schema:
            type: string
        - name: host
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionExplanation"
        "400":
          description: Neither `tool` nor `host` was set, or both were.
        "404":
          description: The agent is not visible, or the tool is not in the caller's view.
        "409":
          description: Host explain was requested for a legacy agent.

  /v1/permission-presets:
    get:
      summary: Squrell permission presets
      description: |
        Starting rule sets copied into an agent. They are not referenced and
        have no release. `version` is the compiled set. The three sets are a
        proposal for the product owner: Ask before writes (the defaults),
        Open internet (every tool allowed, internet open), and Read-only
        (read builtins allowed, everything else denied, internet denied).
      responses:
        "200":
          description: Preset catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionPresets"

  /v1/policies:
    get:
      summary: List all Policies
      description: Return the caller's own draft policies plus every tenant-released policy, newest first.
      responses:
        "200":
          description: Policy catalog entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPoliciesResponse"
    put:
      summary: Register or update a Policy
      description: Create or update a Cedar policy catalog entry. Cedar text is compile-validated against the default schema on admit.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPolicyRequest"
            example:
              urn: "urn:vam:policy:local.vam.dev/vam/assistant-egress-only"
              cedar: |
                permit (
                  principal,
                  action == Action::"ExecuteTool",
                  resource == Tool::"read_file"
                );
      responses:
        "200":
          description: Policy saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutPolicyResponse"
        "400":
          description: Invalid Cedar or missing URN.

  /v1/policies/{urn}:
    get:
      summary: Get Policy by URN
      description: Retrieve the latest released Cedar policy, or the caller's own draft when no released row exists. Another user's draft is 404.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:policy:local.vam.dev/vam/assistant-egress-only"
      responses:
        "200":
          description: Policy record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPolicyResponse"

  /v1/playbooks:
    put:
      summary: Register or update a Playbook
      description: Save a multi-step DAG playbook workflow specification.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPlaybookRequest"
      responses:
        "200":
          description: Playbook saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutPlaybookResponse"

  /v1/playbooks/{urn}:
    get:
      summary: Get Playbook by URN
      description: Retrieve the latest released Playbook, or the caller's own draft when no released row exists. Another user's draft is 404.
      parameters:
        - name: urn
          in: path
          required: true
          schema:
            type: string
          example: "urn:vam:playbook:hub.vam.dev/acme/erp-monthly-close"
      responses:
        "200":
          description: Playbook specification.

syntax = "proto3";

package vam.v1;

option go_package = "github.com/squrell-inc/vam/spec/v1;vamv1";
option java_multiple_files = true;
option java_package = "com.vam.spec.v1";

import "google/protobuf/struct.proto";

message SpiffeIdentity {
  string spiffe_id = 1;                   // E.g., "spiffe://vam.local/ns/default/agent/finance-1"
  bytes x509_cert_der = 2;                // DER-encoded X.509 certificate
  reserved 3;
  reserved "private_key_der";             // Private keys must never cross this protocol boundary
  bytes trust_bundle_der = 4;             // CA trust store for validation
}

message CedarEvaluationRequest {
  string principal = 1;                   // The entity executing the tool (e.g., "User::\"alice\"" or "Agent::\"finance\"")
  string action = 2;                      // The action requested (e.g., "Action::\"ExecuteTool\"")
  string resource = 3;                    // The target tool (e.g., "Tool::\"run_shell_command\"")
  google.protobuf.Struct context = 4;     // Variables (e.g., {"command": "rm -rf /"})
}

message CedarEvaluationResponse {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_ALLOW = 1;
    DECISION_DENY = 2;
  }
  Decision decision = 1;
  repeated string matching_policies = 2;  // Rules that triggered the decision
  string diagnostic_message = 3;          // Explanation if denied
}

message MaskingRule {
  string id = 1;
  string regex_pattern = 2;               // Regular expression matching secrets
  string mask_replacement = 3;            // Replacing text (defaults to "[REDACTED_API_KEY]")
}

message MaskingMetadata {
  repeated MaskingRule rules = 1;
}

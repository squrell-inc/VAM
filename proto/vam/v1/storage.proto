syntax = "proto3";

package vam.v1;

option go_package = "github.com/squrell-inc/vam/spec/v1;vamv1";
option java_multiple_files = true;
option java_package = "com.vam.spec.v1";

import "google/protobuf/timestamp.proto";
import "vam/v1/common.proto";

message OpenRequest {
  string path = 1;
  uint32 flags = 2;
  uint32 mode = 3;
}

message OpenResponse {
  uint64 fd = 1;
  ErrorStatus error = 2;
}

message ReadRequest {
  uint64 fd = 1;
  uint64 offset = 2;
  uint32 size = 3;
}

message ReadResponse {
  bytes data = 1;
  ErrorStatus error = 2;
}

message WriteRequest {
  uint64 fd = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message WriteResponse {
  uint32 bytes_written = 1;
  ErrorStatus error = 2;
}

message CloseRequest {
  uint64 fd = 1;
}

message CloseResponse {
  ErrorStatus error = 1;
}

message FsyncRequest {
  uint64 fd = 1;
  bool datasync = 2;
}

message FsyncResponse {
  ErrorStatus error = 1;
}

message StatRequest {
  string path = 1;
}

message FileStat {
  uint64 size = 1;
  uint32 mode = 2;
  google.protobuf.Timestamp mtime = 3;
  google.protobuf.Timestamp ctime = 4;
  bool is_dir = 5;
}

message StatResponse {
  FileStat stat = 1;
  ErrorStatus error = 2;
}

message ReaddirRequest {
  string path = 1;
}

message DirEntry {
  string name = 1;
  FileStat stat = 2;
}

message ReaddirResponse {
  repeated DirEntry entries = 1;
  ErrorStatus error = 2;
}

message MkdirRequest {
  string path = 1;
  uint32 mode = 2;
}

message MkdirResponse {
  ErrorStatus error = 1;
}

message RmdirRequest {
  string path = 1;
}

message RmdirResponse {
  ErrorStatus error = 1;
}

message UnlinkRequest {
  string path = 1;
}

message UnlinkResponse {
  ErrorStatus error = 1;
}

message RenameRequest {
  string old_path = 1;
  string new_path = 2;
}

message RenameResponse {
  ErrorStatus error = 1;
}

message SymlinkRequest {
  string target = 1;
  string link_path = 2;
}

message SymlinkResponse {
  ErrorStatus error = 1;
}

message FlushRequest {
  string session_id = 1;
}

message FlushResponse {
  ErrorStatus error = 1;
}

message CheckpointRequest {
  string session_id = 1;
  string description = 2;
}

message CheckpointResponse {
  ArtifactRef checkpoint_ref = 1;
  ErrorStatus error = 2;
}

message InvalidateMetadataRequest {
  string path = 1;
}

message InvalidateMetadataResponse {
  ErrorStatus error = 1;
}

service Drive9Service {
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Close(CloseRequest) returns (CloseResponse);
  rpc Fsync(FsyncRequest) returns (FsyncResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc Readdir(ReaddirRequest) returns (ReaddirResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  rpc Rmdir(RmdirRequest) returns (RmdirResponse);
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc Symlink(SymlinkRequest) returns (SymlinkResponse);
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  rpc InvalidateMetadata(InvalidateMetadataRequest) returns (InvalidateMetadataResponse);
}

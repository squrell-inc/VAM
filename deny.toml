# Licence policy for dependencies: permissive licences only. Run `cargo deny check licenses`.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# webpki-roots is the Mozilla CA bundle as data (MPL-2.0, file-level copyleft). Used unmodified via
# reqwest's rustls-tls; MPL obligations apply only to modified MPL files, which we do not ship.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "webpki-roots"

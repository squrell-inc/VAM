piece: skill-egress-probe
kind: skill
requires: [egress-token]
body:
  spec:
    resourceId: { urn: "urn:vam:skill:local.vam.dev/e2e/{{name}}" }
    version: { major: 1, minor: 0, patch: 0 }
    description: A host tool that plays a guest asking the egress proxy for oversize bodies (test nodes only)
    tools:
      - name: host_egress_probe
        description: Asks the fake origin for a small body and two oversize bodies through the egress proxy and reports whether any secret came back
        inputSchemaJson: "{\"type\":\"object\"}"
        sideEffect: SIDE_EFFECT_CLASS_READ_ONLY
        host_exec:
          adapter_id: egress_probe
          config: {}
        required_secrets:
          - { name: "e2e/oversize-echo", required: true }

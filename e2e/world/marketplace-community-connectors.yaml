piece: marketplace-community-connectors
kind: git-marketplace
# A marketplace an admin adds, whose listings ship connector files: two that install (a remote MCP
# server with discovery; `filebox-connector`, whose OAuth client the org's admin supplies, with a secret
# the node holds) and four that must be refused (a Squrell-reserved id, an unknown profile, a client secret
# of the Squrell relay, and `org-secret-without-org-client`, an org-held secret with no admin-supplied client).
# Three more for a company address: `ticketdesk-connector` (a REST connector on `{subdomain}.ticketdesk.example`, a skill that
# reads and creates tickets, an assistant) installs; `company-address-outside-its-suffix` and
# `rest-connector-with-a-foreign-placeholder` are refused.
# Three more for an API key: `notesdesk-connector` (a REST connector with `provider.kind: api_key`, one field, bearer inject on
# `api.notesdesk.example`, a skill with `note_search` and `note_create`, an assistant and the test file
# `tests/connector-test.json` that `mock-notesdesk-server` serves) and `keyed-bugwatch-connector` (an MCP connector with an API key,
# vetted `list_issues` and `get_issue`) are meant to install; `api-key-with-two-fields` is refused.
# Overlay `marketplace-community-connectors-notesdesk-update/` is the tag `notesdesk-connector-v1.1.0`: the connector and the skill also name `eu.api.notesdesk.example`.
# Overlay `marketplace-community-connectors-update/` is a newer tag of the good listing whose connector asks for one more scope and offers one more tool.

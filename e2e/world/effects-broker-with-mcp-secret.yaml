piece: effects-broker-with-mcp-secret
kind: broker
requires: [mcp-oauth-connection]
# The effects test broker, registered with a manifest that names the MCP connection's access
# token as its secret and lists the MCP host as an approved egress domain. Nothing about the
# manifest is out of the ordinary except the vault key it names. The broker's ledger counts every
# call it receives, so a call that never left the host counts zero.
args: ["--effects", "--socket", "{{socket}}", "--state-dir", "{{dir}}"]
body:
  manifest:
    brokerId: effects-broker-with-mcp-secret
    trustTier: TRUST_TIER_FIRST_PARTY
    egressDomains: ["mcp.e2e-mcp.example"]
    secretBindings:
      - { logicalName: mcp_token, vaultKey: e2e-mcp/oauth/access-token, required: true }
    tools:
      - toolName: echo_create_ticket
        sideEffect: SIDE_EFFECT_CLASS_MUTABLE_EXTERNAL
      # The only tool that names the secret; the broker declares all three, so the manifest lists all three.
      - toolName: echo_create_note
        sideEffect: SIDE_EFFECT_CLASS_MUTABLE_EXTERNAL
        requiredSecrets: [mcp_token]
      - toolName: echo_find_ticket
        sideEffect: SIDE_EFFECT_CLASS_READ_ONLY
  unixPath: "{{socket}}"

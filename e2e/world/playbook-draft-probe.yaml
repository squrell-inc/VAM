piece: playbook-draft-probe
kind: playbook
# Not written at `given`: a `put-draft` step writes it, as an identity, and the answer is the result.
deferred: true
body:
  spec:
    resourceId: { urn: "urn:vam:playbook:local.vam.dev/e2e/{{name}}" }
    displayName: Playbook draft written by a put-draft step
    description: Summarise a topic.
    activation: { when: Use only in end-to-end scenarios. }
    inputSchema:
      type: object
      properties: { topic: { type: string } }
      required: [topic]
      additionalProperties: false
    steps:
      - id: summarise
        description: Summarise the topic.
        kind: STEP_KIND_TASK
        mode: STEP_MODE_AGENTIC
        instruction: "Summarise {{inputs.topic}} in one line."

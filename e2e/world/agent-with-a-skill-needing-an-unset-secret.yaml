piece: agent-with-a-skill-needing-an-unset-secret
kind: agent
release: true
requires: [skill-needing-an-unset-secret]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent whose skill needs a secret nobody set
    description: Agent with a skill whose tool requires the secret never-set-token
    role: Tester
    systemInstructions: Use the tools when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-needing-an-unset-secret}}" }
        version: { major: 1, minor: 0, patch: 0 }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "skill:{{name:skill-needing-an-unset-secret}}/*", decision: allow }

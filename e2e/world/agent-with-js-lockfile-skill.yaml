piece: agent-with-js-lockfile-skill
kind: agent
release: true
requires: [skill-with-js-lockfile]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent offered the JS lockfile skill
    description: Agent that runs the skill whose tool imports a package from its lockfile
    role: Tester
    systemInstructions: Use the lockfile tool when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-with-js-lockfile}}" }
        version: { major: 1, minor: 0, patch: 0 }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "skill:{{name:skill-with-js-lockfile}}/*", decision: allow }

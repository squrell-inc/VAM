piece: agent-with-mcp-secret-broker
kind: agent
release: true
requires: [effects-broker-with-mcp-secret]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent that can save notes through a broker that names an MCP token
    description: Agent offered the note tool of the broker whose manifest names an MCP connection's access token
    role: Tester
    systemInstructions: Use the tool when asked. Finish with task_complete.
    allowAnyPlaybook: true
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:echo_create_note", decision: allow }

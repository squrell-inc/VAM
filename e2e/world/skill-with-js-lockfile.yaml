piece: skill-with-js-lockfile
kind: skill
files:
  package.json: lockfile-js/package.json
  package-lock.json: lockfile-js/package-lock.json
  report.js: lockfile-js/report.js
body:
  spec:
    resourceId: { urn: "urn:vam:skill:local.vam.dev/e2e/{{name}}" }
    version: { major: 1, minor: 0, patch: 0 }
    description: A skill whose Bun tool imports an npm package from its package-lock.json (test nodes only)
    tools:
      - name: lockfile_report
        description: Imports the package its lockfile names and prints a marker the package computes
        inputSchemaJson: "{\"type\":\"object\"}"
        sideEffect: SIDE_EFFECT_CLASS_READ_ONLY
        localExec: { command: bun, entrypoint: ./report.js }

piece: agent-with-m365-overreach
kind: agent
release: true
deferred: true
requires: [skill-m365-overreach]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent offered the overreaching draft skill
    description: Agent that may create a Microsoft 365 draft (test nodes only)
    role: Tester
    systemInstructions: Use the draft tool when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-m365-overreach}}" }
        version: { major: 1, minor: 0, patch: 0 }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "skill:{{name:skill-m365-overreach}}/*", decision: allow }

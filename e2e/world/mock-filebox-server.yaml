piece: mock-filebox-server
kind: mock-provider
# A runner-hosted loopback stand-in for a Box-like service (fictional "Filebox"), one listener for three
# hosts: the MCP server `https://mcp.filebox.example/mcp` (`search_files`, `read_file`; bearer required),
# its RFC 9728 metadata (pointing at `https://auth.filebox.example`) and the authorization server's
# RFC 8414 metadata (authorize, token, revocation, S256, no registration endpoint). `GET /authorize` mints a
# code for the registered client id (`e2e-filebox-client*`), redirect URI and S256 challenge (the runner plays
# the browser). The token endpoint is a confidential client (`client_secret_post`): it checks code, verifier,
# redirect URI and the client secret, issues access tokens and single-use rotating refresh tokens (a reused
# one answers `invalid_grant`). It logs field names, `grant_type`, `client_id`, `client-secret=current|old|
# wrong|none` and `refresh=fresh|reused|unknown`, never a value. Controls: `mock-provider: { piece, expire,
# holdToken, rotateSecret }`. Reached through the seam keys `mcp:<https url>` and `oauth:<https origin>`.
provider: filebox

piece: agent-member-draft-with-m365-probe
kind: agent
# Not written at `given` and never released: a `put-draft` step saves it as an identity's draft, in that
# identity's namespace. It pins the released `skill-m365-probe` at 1.0.0; the skill needs a connector, and the
# agent names none.
deferred: true
requires: [skill-m365-probe]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/{{ns}}/{{name}}" }
    displayName: Member draft agent offered the Microsoft 365 probe skill
    description: Member draft agent that reads mail through the member's Microsoft 365 connection
    role: Tester
    systemInstructions: Use the probe tools when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-m365-probe}}" }
        version: { major: 1, minor: 0, patch: 0 }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "skill:{{name:skill-m365-probe}}/*", decision: allow }

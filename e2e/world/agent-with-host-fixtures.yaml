piece: agent-with-host-fixtures
kind: agent
release: true
requires: [skill-host-fixtures]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent offered the host fixture tools
    description: Agent offered the host fixture tools
    role: Tester
    systemInstructions: Use the host tools when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-host-fixtures}}" }
        version: { major: 1, minor: 0, patch: 0 }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "skill:{{name:skill-host-fixtures}}/*", decision: allow }

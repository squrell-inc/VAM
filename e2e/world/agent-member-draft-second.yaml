piece: agent-member-draft-second
kind: agent
# A second agent of the same shape as `agent-member-draft-with-host-echo`, so one identity can save a new URN
# after an earlier save (a new URN is checked against the namespace; an edit of its own row is not).
deferred: true
requires: [skill-host-echo]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/{{ns}}/{{name}}" }
    displayName: Second member draft agent offered the echo tool
    description: Member draft agent offered the echo tool
    role: Tester
    systemInstructions: Use the host tools when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-host-echo}}" }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "builtin:step_complete", decision: allow }
          - { target: "skill:{{name:skill-host-echo}}/*", decision: allow }

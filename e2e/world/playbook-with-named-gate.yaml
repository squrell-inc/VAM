piece: playbook-with-named-gate
kind: playbook
release: true
# The steps of `playbook-with-gate`, under a fixed urn so a mock script can name it in the run a
# trigger grant asks for (a mock rule cannot read a run-unique urn).
body:
  spec:
    resourceId: { urn: "urn:vam:playbook:local.vam.dev/e2e/gate-started-by-a-trigger" }
    displayName: Playbook with one gate, started by a trigger
    description: Prepare, ask a human whether to go on, then finish.
    activation: { when: Use only in end-to-end scenarios. }
    steps:
      - id: prepare
        description: Prepare the work.
        kind: STEP_KIND_TASK
        mode: STEP_MODE_AGENTIC
        instruction: Prepare the work and finish.
      - id: confirm
        description: Pause for a human to go on or stop.
        kind: STEP_KIND_GATE
        after: [prepare]
        question: Go on?
        options:
          - { label: go, description: Finish the work }
          - { label: stop, description: Stop here, terminal: OUTCOME_TERMINAL_SUCCEEDED }
      - id: finish
        description: Finish the work.
        kind: STEP_KIND_TASK
        mode: STEP_MODE_AGENTIC
        after: ["confirm:go"]
        instruction: Finish the work.

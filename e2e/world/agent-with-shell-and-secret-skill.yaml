piece: agent-with-shell-and-secret-skill
kind: agent
release: true
requires: [skill-host-fixtures]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent offered run and a skill that needs an org secret
    description: Agent offered run and the host fixture skill, whose tool requires the org secret
    role: Tester
    systemInstructions: Use the tools when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-host-fixtures}}" }
        version: { major: 1, minor: 0, patch: 0 }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "builtin:run", decision: allow }
          - { target: "skill:{{name:skill-host-fixtures}}/*", decision: allow }

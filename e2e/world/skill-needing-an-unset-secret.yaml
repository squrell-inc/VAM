piece: skill-needing-an-unset-secret
kind: skill
body:
  spec:
    resourceId: { urn: "urn:vam:skill:local.vam.dev/e2e/{{name}}" }
    version: { major: 1, minor: 0, patch: 0 }
    description: A host tool whose required secret no scenario ever sets
    tools:
      - name: host_needs_secret
        description: Echoes its arguments once its secret is set
        inputSchemaJson: "{\"type\":\"object\"}"
        sideEffect: SIDE_EFFECT_CLASS_READ_ONLY
        host_exec:
          adapter_id: echo
          config: {}
        required_secrets:
          - { name: "never-set-token", required: true }

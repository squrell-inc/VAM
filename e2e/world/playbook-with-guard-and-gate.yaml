piece: playbook-with-guard-and-gate
kind: playbook
release: true
body:
  spec:
    resourceId: { urn: "urn:vam:playbook:local.vam.dev/e2e/{{name}}" }
    displayName: Playbook whose guard opens after a gate
    description: Prepare, ask a human whether to go on, then finish. Writing a file is denied until the gate says go.
    activation: { when: Use only in end-to-end scenarios. }
    steps:
      - id: prepare
        description: Prepare the work.
        kind: STEP_KIND_TASK
        mode: STEP_MODE_AGENTIC
        instruction: Prepare the work and finish.
      - id: confirm
        description: Pause for a human to go on or stop.
        kind: STEP_KIND_GATE
        after: [prepare]
        question: Go on?
        options:
          - { label: go, description: Finish the work }
          - { label: stop, description: Stop here, terminal: OUTCOME_TERMINAL_SUCCEEDED }
      - id: finish
        description: Write the result, then finish.
        kind: STEP_KIND_TASK
        mode: STEP_MODE_AGENTIC
        after: ["confirm:go"]
        instruction: Write the note and finish.
    guards:
      - { tools: [write_file], allowedWhen: ["confirm:go"] }

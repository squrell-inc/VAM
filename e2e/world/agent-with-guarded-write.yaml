piece: agent-with-guarded-write
kind: agent
release: true
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent whose write_file waits for approval, other tools allowed
    description: Agent whose write_file waits for approval; playbook tools stay available.
    role: Tester
    systemInstructions: Write files when asked. Finish with task_complete.
    allowAnyPlaybook: true
    permissions:
      tools:
        default: allow
        rules:
          - { target: "builtin:write_file", decision: ask }

piece: agent-with-egress-probe
kind: agent
release: true
requires: [skill-egress-probe]
body:
  spec:
    resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/{{name}}" }
    displayName: Agent offered the egress probe tool
    description: Agent offered the egress probe host tool
    role: Tester
    systemInstructions: Use the host tools when asked. Finish with task_complete.
    allowAnyPlaybook: true
    skillRefs:
      - resourceId: { urn: "{{urn:skill-egress-probe}}" }
        version: { major: 1, minor: 0, patch: 0 }
    permissions:
      tools:
        default: deny
        rules:
          - { target: "builtin:load_skill", decision: allow }
          - { target: "skill:{{name:skill-egress-probe}}/*", decision: allow }

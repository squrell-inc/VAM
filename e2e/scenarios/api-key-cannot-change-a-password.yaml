id: api-key-cannot-change-a-password
title: An API key cannot change a password, the member's key and the bootstrap key alike
description: >
  Changing a password needs a password session. The member's API key and the node's bootstrap key
  are both answered 403 with a message that says so, and the member's password is unchanged.
tags: [members]
needs: process
given:
  - org-admin
  - { piece: org-member, as: member }
when:
  - change-password: { as: member, via: key, status: 403, contains: password session }
then:
  - change-password: { via: key, status: 403, contains: password session }
  - login: { as: member }
guards:
  - vam:crates/vam-orchestrator/src/api/me.rs
  - vam:crates/vam-orchestrator/src/users.rs
  - vam:crates/vam-orchestrator/src/session_tokens.rs
status: active

id: missing-secret-refusal-names-the-secret-to-set
title: Starting a run whose skill needs a secret nobody set is refused with a typed denial that names the secret and the fix
description: >
  A member starts a run of an agent whose skill requires a secret that was never set. The start
  is refused 412. The text is unchanged, and the body also carries a typed denial: reason secret
  missing, subject the binding, fix to set the secret, and the same denial in a list of denials.
  Today the start is not refused at all: the admission check reads the skill from the `skills`
  table, and a skill published as a package (the only way a scenario can publish one) is not
  there, so the check skips it. The change that adds the denial must make the check see package
  skills; until then this scenario fails at its first step.
tags: [chat, members]
needs: process
given:
  - org-member
  - skill-needing-an-unset-secret
  - agent-with-a-skill-needing-an-unset-secret
when:
  - chat: { text: "e2e-step:go Use the skill", as: org-member, refused: true }
then:
  - expect: { refused: true, status: 412, contains: "missing required secrets" }
  - expect: { refused: true, contains: "\"denial\":{" }
  - expect: { refused: true, contains: "\"denials\":[" }
  - expect: { refused: true, contains: SECRET_MISSING }
  - expect: { refused: true, contains: SET_SECRET }
  - expect: { refused: true, contains: "\"subject\":\"never-set-token\"" }
guards:
  - vam:crates/vam-orchestrator/src/secret_requirements.rs
  - vam:crates/vam-orchestrator/src/api/error.rs
  - vam:crates/vam-orchestrator/src/api/mod.rs
mock:
  - when: { step: go }
    reply: { text: Not reached. }
status: active

id: member-connects-a-company-address-connector-through-the-node-without-a-secret
title: A member connects a company-address connector through the node, which holds no secret and never sends one
description: >
  The administrator enabled the Ticketdesk connector with the address `acme` and the client id registered with the
  provider (a public client: there is no secret). The member connects from the tile: the app asks the provider's
  authorization endpoint at `acme.ticketdesk.example` for a code and hands the code, the verifier and the redirect
  URI to the node, which exchanges them at the token endpoint filled at Enable (the provider sees the admin's client
  id, the verifier and the redirect URI, no client secret and no resource). The tile reads connected. An app that
  holds the tokens itself is refused. When the administrator changes the address to `globex` and saves the client
  again, the member's tile reads needs reconnect and nothing was sent to the new address. Neither the tokens nor any
  value the provider issued is in a connector listing or in the connections.
tags: [connectors, members, permissions]
needs: process
given:
  - org-admin
  - org-member
  - org-administrator
  - marketplace-community-connectors
  - mock-ticketdesk-server
when:
  - marketplace-add: { piece: marketplace-community-connectors, as: org-admin }
  - marketplace-refresh: { marketplace: marketplace-community-connectors, as: org-admin }
  - marketplace-install: { marketplace: marketplace-community-connectors, listing: ticketdesk-connector, as: org-admin }
  - connector-node: { id: ticketdesk, enabled: true, as: org-administrator, tenant: { subdomain: acme }, client: { clientId: e2e-ticketdesk-client } }
  - connector-connect: { id: ticketdesk, piece: mock-ticketdesk-server, via: tokens, as: org-member, refused: true, contains: exchange }
  - connector-connect: { id: ticketdesk, piece: mock-ticketdesk-server, as: org-member }
  - expect: { mock-requests: { piece: mock-ticketdesk-server, path: /oauth/tokens, with: "grant_type=authorization_code", count: 1, has: ["host=acme", "client_id=e2e-ticketdesk-client", code_verifier, "redirect_uri=squrell://oauth", "client-secret=none", "resource=none"], lacks: ["client-secret=present", "resource=present"] } }
  - expect: { connectors: { id: ticketdesk, as: org-member, fields: { state: connected, trust: unverified } } }
  - api-call: { path: /v1/connectors, as: org-administrator, absent: mock-ticketdesk-server }
  - api-call: { path: /v1/connectors, as: org-member, absent: mock-ticketdesk-server }
  - api-call: { path: /v1/mcp/connections, as: org-member, absent: mock-ticketdesk-server }
  - connector-node: { id: ticketdesk, enabled: true, as: org-administrator, tenant: { subdomain: globex }, client: { clientId: e2e-ticketdesk-client } }
  - expect: { connectors: { id: ticketdesk, as: org-member, fields: { state: needsReconnect, node.tenant.subdomain: globex } } }
  - expect: { mock-requests: { piece: mock-ticketdesk-server, path: "*", with: "host=globex", count: 0 } }
  - api-call: { path: /v1/connectors, as: org-administrator, absent: mock-ticketdesk-server }
  - api-call: { path: /v1/connectors, as: org-member, absent: mock-ticketdesk-server }
  - api-call: { path: /v1/mcp/connections, as: org-member, absent: mock-ticketdesk-server }
then:
  - expect: { secret-absent: { secret: mock-ticketdesk-server } }
  - expect: { mock-requests: { piece: mock-ticketdesk-server, path: /oauth/tokens, with: "grant_type=authorization_code", count: 1 } }
  - expect: { connectors: { id: ticketdesk, as: org-member, fields: { state: needsReconnect } } }
guards:
  - vam:crates/vam-orchestrator/src/connectors.rs
  - vam:crates/vam-orchestrator/src/api/connectors.rs
  - vam:crates/vam-orchestrator/src/connector_exchange.rs
  - vam:crates/vam-orchestrator/src/connector_client.rs
  - vam:crates/vam-orchestrator/src/mcp_oauth_refresh.rs
status: active

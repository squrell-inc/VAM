id: secret-never-reaches-guest-encoded
title: A host tool that returns a secret in encoded and split forms gives the guest none of them
description: >
  The host tool prints the org secret raw, base64, base64url, hex, percent-encoded, JSON-escaped,
  split across a line break and inside larger base64 blobs. The run still succeeds, and no form
  of the secret, nor any run of 12 or more of its bytes, is in the thread, the run events, the
  receipt or the workspace. The test node's fixture adapter makes the output; the host's
  redaction is what is judged.
tags: [egress, chat]
needs: process
given:
  - org-admin
  - api-token
  - skill-host-fixtures
  - agent-with-host-fixtures
when:
  - chat: "e2e-step:forms Read the token with the host tool"
then:
  - expect: { run: succeeded }
  - expect: { secret-absent: { secret: api-token } }
guards:
  - vam:crates/vam-orchestrator/src/host_tools.rs
  - vam:crates/vam-orchestrator/src/brokers.rs
  - vam:crates/vam-security/src/secret_forms.rs
  - vam:crates/vam-network/src/secrets.rs
  - vam:crates/vam-orchestrator/src/connection_egress.rs
  - vam:crates/vam-network/src/broker.rs
mock:
  - when: { step: forms, toolName: host_secret_forms }
    reply: { text: Read it. }
  - when: { step: forms, toolName: load_skill }
    reply: { toolCall: { name: host_secret_forms, args: {} } }
  - when: { step: forms, stepStart: true }
    reply: { toolCall: { name: load_skill, args: { skill: skill-host-fixtures-secret-never-reaches-guest-encoded } } }
status: active

id: stop-ends-a-run-parked-across-a-restart
title: Stop ends a run still parked on an approval after vamd restarted, with no guest booted
tags: [approval, context]
needs: process
description: 'The guest is gone with the restart. Stop rejects the approval as stopped by the user, vamd writes the end of the task itself (the pending call is answered "Not run: stopped by user"), and a follow-up on the thread sees it.'
given:
  - org-admin
  - agent-with-guarded-tool
when:
  - chat: "e2e-step:ask Write the note"
  - expect: { approval: pending, tool: write_file }
  - restart-vamd: {}
  - expect: { approval: pending, tool: write_file }
  - stop: {}
  - expect: { run: failed }
  - expect: { event: hitl.decided, fields: { data.decision: REJECTED } }
  - expect: { event: run.completed, fields: { error: { contains: "stopped by user" } } }
  - expect: { file: { path: note.txt, absent: true } }
  - chat: { text: "e2e-step:after What happened?", thread: continue }
then:
  - expect: { run: succeeded }
  - expect: { event: inference.completed, fields: { data.outcomePreview: { contains: "Stopped, as you asked" } } }
guards:
  - vam:crates/vam-orchestrator/src/session_end.rs
  - vam:crates/vam-orchestrator/src/api/stop.rs
  - vam:crates/vam-orchestrator/src/reconcile.rs
mock:
  - when: { step: after, anyContains: "stopped by user" }
    reply: { text: "Stopped, as you asked." }
  - when: { step: after }
    reply: { text: "I do not know." }
  - when: { step: ask }
    reply: { toolCall: { name: write_file, args: { path: note.txt, content: e2e } } }
status: active

id: skill-cannot-send-a-secret-to-an-unpinned-host
title: A host HTTP tool does not attach a stored Authorization value to a host the secret is not pinned to
description: >
  A published skill's host HTTP tool requires an egress secret named `...-auth-header` and is
  allowed to reach `target.e2e-http.example`. The secret is pinned to another host,
  `pinned.e2e-http.example`. The call is refused before any request exists, with a
  `secret_not_permitted` tool error that names the host and carries no part of the secret.
  An MCP connection's own `{id}/auth-header` row is the same case taken further: its kind is
  `connection`, which this adapter never reads (unit tests in `host_tools_http.rs` and
  `tests/mcp_credentials_stay_host_side.rs`; a static connection cannot be made without a live
  MCP server, so the scenario uses a pinned egress secret).
tags: [egress, chat]
needs: process
given:
  - org-admin
  - pinned-http-auth
  - agent-with-http-auth
when:
  - chat: "e2e-step:get Fetch the report"
then:
  - expect: { run: succeeded }
  - expect: { thread: { role: tool, contains: "secret_not_permitted" } }
  - expect: { secret-absent: { secret: pinned-http-auth } }
guards:
  - vam:crates/vam-orchestrator/src/host_tools_http.rs
  - vam:crates/vam-orchestrator/src/secrets.rs
mock:
  - when: { step: get, toolName: host_http_get }
    reply: { text: The tool refused to send the secret. }
  - when: { step: get, toolName: load_skill }
    reply: { toolCall: { name: host_http_get, args: { url: "https://target.e2e-http.example/report" } } }
  - when: { step: get, stepStart: true }
    reply: { toolCall: { name: load_skill, args: { skill: skill-http-with-auth-skill-cannot-send-a-secret-to-an-unpinned-host } } }
status: active

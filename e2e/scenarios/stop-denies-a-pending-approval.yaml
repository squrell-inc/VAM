id: stop-denies-a-pending-approval
title: A message leaves a pending approval open; Stop denies it as stopped by the user
tags: [chat, approval]
needs: process
description: While a tool call waits for approval, a steer is accepted and the approval stays open. Stop denies the approval with the reason "stopped by user" and ends the task; a follow-up sees the reason in the thread.
given:
  - org-admin
  - agent-with-guarded-tool
when:
  - chat: "e2e-step:ask Write the note"
  - expect: { approval: pending, tool: write_file }
  - send: { text: "Actually, call it memo" }
  - expect: { approval: pending, tool: write_file }
  - stop: {}
  - expect: { run: failed }
  - expect: { event: hitl.decided, fields: { data.decision: REJECTED } }
  - expect: { file: { path: note.txt, absent: true } }
  - chat: { text: "e2e-step:after What happened?", thread: continue }
then:
  - expect: { run: succeeded }
  - expect: { event: inference.completed, fields: { data.outcomePreview: { contains: "Stopped, as you asked" } } }
guards:
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/approvals/**
  - vam:crates/vam-runtime/src/hitl_checkpoint.rs
mock:
  - when: { step: after, anyContains: "stopped by user" }
    reply: { text: "Stopped, as you asked." }
  - when: { step: after }
    reply: { text: "I do not know." }
  - when: { step: ask }
    reply: { toolCall: { name: write_file, args: { path: note.txt, content: e2e } } }
status: active

id: vault-secret-is-not-in-the-guest
title: An org secret the session uses never appears in the guest's environment, boot arguments or workspace
description: >
  An org secret is in the vault and the agent's skill requires it, so the session uses it (the
  host tool reads it). The agent then dumps the shell's environment, PID 1's environment and the
  kernel command line. No form of the secret is in the thread, the run events, the receipt or
  the workspace. The skill is attached through the existing host fixture skill; if the session
  does not in fact bind the secret, this proves only that a vault secret leaks nothing.
tags: [egress, chat]
needs: firecracker
given:
  - org-admin
  - api-token
  - skill-host-fixtures
  - agent-with-shell-and-secret-skill
when:
  - chat: "e2e-step:dump Dump the guest's environment"
then:
  - expect: { run: succeeded }
  - expect: { thread: { role: tool, contains: tool-env-read } }
  - expect: { secret-absent: { secret: api-token } }
guards:
  - vam:crates/vam-runtime/src/exec.rs
  - vam:crates/vam-orchestrator/src/secrets.rs
  - vam:crates/vam-security/src/secret_forms.rs
mock:
  - when: { step: dump, toolName: run }
    reply: { text: Dumped. }
  - when: { step: dump, toolName: host_secret_forms }
    reply:
      toolCall:
        name: run
        args:
          command: |
            E=$(env)
            if [ -n "$E" ]; then echo tool-env-"read"; fi
            printf '%s\n' "$E"
            tr '\0' '\n' </proc/1/environ 2>/dev/null
            cat /proc/cmdline
  - when: { step: dump, toolName: load_skill }
    reply: { toolCall: { name: host_secret_forms, args: {} } }
  - when: { step: dump, stepStart: true }
    reply: { toolCall: { name: load_skill, args: { skill: skill-host-fixtures-vault-secret-is-not-in-the-guest } } }
status: active

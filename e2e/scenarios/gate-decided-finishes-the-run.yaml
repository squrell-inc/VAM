id: gate-decided-finishes-the-run
title: A playbook run pauses at its gate; deciding it finishes the run
tags: [gate, playbook]
needs: process
given:
  - org-admin
  - agent-plain
  - playbook-with-gate
when:
  - start-playbook: { playbook: playbook-with-gate, label: run }
  - expect: { step: confirm, state: waiting }
  - decide-gate: { option: go }
then:
  - expect: { run: succeeded }
  - expect: { step: confirm, state: decided }
guards:
  - vam:crates/vam-orchestrator/src/playbooks/**
  - vam:crates/vam-orchestrator/src/workflow.rs
mock:
  - when: { step: run, lastRole: user, contains: "Missing required steps: finish" }
    reply: { toolCall: { name: step_complete, args: { step_id: finish, outcome: done } } }
  - when: { step: run, afterTool: step_complete }
    reply: { text: step done }
  - when: { step: run }
    reply: { toolCall: { name: step_complete, args: { step_id: prepare, outcome: done } } }
status: active

id: quiet-hours-hold-slack-until-morning
title: Quiet hours hold Slack messages and the list shows the approval at once
tags: [notifications, approval, slow]
needs: process
description: Quiet hours cover the next minute. An approval parks; it is in the app list at once and no Slack message is sent. When the window ends one message arrives. A kind marked always is sent during the window. Quiet hours are HH:MM in a zone, so the window is a whole minute and the scenario waits for it; it is left out of the smoke set.
given:
  - org-admin
  - agent-with-guarded-tool
  - slack-bot-token
  - slack-app-token
  - notify-broker
when:
  - node-notify: { slack: { botToken: slack-bot-token, appToken: slack-app-token }, appUrl: "https://vam.example.test" }
  - link-contact: { channel: slack, account: "T1/U1", verify: true }
  # Runner shorthand: start is the current UTC minute, end is one minute later (HH:MM values go to the API).
  - notify-prefs: { quietHours: now, always: [question.asked] }
  - chat: "e2e-step:one Write the first note"
  - expect: { approval: pending, tool: write_file }
  - expect: { notifications: { kind: approval.pending, run: latest, count: 1, state: open } }
  - expect: { channel-messages: { to: "T1/U1", kind: approval.pending, absent: true } }
then:
  - expect: { channel-messages: { to: "T1/U1", kind: approval.pending, count: 1, within: 150s } }
  - expect: { notifications: { kind: approval.pending, run: latest, count: 1, state: open } }
guards:
  - vam:brokers/vam-notify/src/**
  - vam:crates/vam-orchestrator/src/notifications.rs
mock:
  - when: { step: one, afterTool: write_file }
    reply: { text: first written }
  - when: { step: one }
    reply: { toolCall: { name: write_file, args: { path: first.txt, content: e2e } } }
status: active

id: oversize-response-with-a-secret-never-reaches-the-guest
title: A response over the scrub buffer from a host that holds a session secret never reaches the guest
description: >
  The org has an egress secret bound to the test node's fake origin (`oversize.e2e.test`). A host
  tool plays a guest that opens the proxy's TLS-terminating socket (port 55) itself, as hostile
  guest code would: the guest's own proxy carries no `CONNECT`, and in process mode a tool process
  cannot open the socket, so the host opens it. It asks the origin for a small body (fits the
  scrub buffer; the secret in it is replaced by the placeholder), a body over the buffer that the
  origin builds from the secret it was just sent, and a second body over the buffer asked for
  without any placeholder, which the origin builds from the secret it remembers. The proxy refuses
  both oversize responses with a 502 before any of their bytes reach the guest. The tool checks
  the raw bytes itself and reports `leak-none` (the host redacts tool output, which would hide a
  leak), and no form of the secret is in the thread, the run events, the receipt or the workspace.
  The test node's buffer for this origin is 64 KiB so the bodies stay small; the default is 8 MiB
  (`DEFAULT_SCRUB_BUFFER`). A process guest runs the same host-side gate and proxy as a microVM
  guest, so this proves the proxy, not the guest's lack of a route (`guest-has-no-route-off-the-vm`).
tags: [chat, egress]
needs: process
given:
  - org-admin
  - egress-token
  - skill-egress-probe
  - agent-with-egress-probe
when:
  - chat: "e2e-step:probe Ask the origin for three bodies"
then:
  - expect: { run: succeeded }
  - expect: { thread: { role: tool, contains: small-ok } }
  - expect: { thread: { role: tool, contains: oversize-refused } }
  - expect: { thread: { role: tool, contains: later-refused } }
  - expect: { thread: { role: tool, contains: leak-none } }
  - expect: { secret-absent: { secret: egress-token } }
guards:
  - vam:crates/vam-network/src/proxy/mitm.rs
  - vam:crates/vam-network/src/broker.rs
  - vam:crates/vam-network/src/secrets.rs
  - vam:crates/vam-network/src/proxy/fixture.rs
  - vam:crates/vam-orchestrator/src/host_tools_fixtures.rs
mock:
  - when: { step: probe, toolName: host_egress_probe }
    reply: { text: Asked. }
  - when: { step: probe, toolName: load_skill }
    reply: { toolCall: { name: host_egress_probe, args: {} } }
  - when: { step: probe, stepStart: true }
    reply: { toolCall: { name: load_skill, args: { skill: skill-egress-probe-oversize-response-with-a-secret-never-reaches-the-guest } } }
status: active

id: password-change-needs-an-idempotency-key
title: A password change without an Idempotency-Key is refused and changes nothing
description: >
  Like every mutating route, the password change needs an Idempotency-Key header. Without one it
  is answered 400 and the current password still signs in.
tags: [members]
needs: process
given:
  - { piece: org-member, as: member }
when:
  - login: { as: member }
  - change-password: { as: member, idempotencyKey: false, status: 400, contains: Idempotency-Key }
then:
  - login: { as: member }
guards:
  - vam:crates/vam-orchestrator/src/api/me.rs
  - vam:crates/vam-orchestrator/src/users.rs
  - vam:crates/vam-orchestrator/src/session_tokens.rs
status: active

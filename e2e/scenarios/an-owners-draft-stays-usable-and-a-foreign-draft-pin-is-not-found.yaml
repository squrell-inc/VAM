id: an-owners-draft-stays-usable-and-a-foreign-draft-pin-is-not-found
title: An owner's draft stays usable under a restricted policy, and another member's pin on it is not found
description: >
  A member saves a draft agent and the admin restricts it. The owner still chats with the draft. A second member who pins the draft version is answered exactly as for a URN that does not exist.
tags: [members, permissions]
needs: process
given:
  - { piece: org-admin, as: admin }
  - { piece: org-member, as: m1 }
  - { piece: org-member-email, as: m2 }
  - agent-member-draft-with-host-echo
  - skill-host-echo
when:
  - put-draft: { piece: agent-member-draft-with-host-echo, as: m1, status: 200 }
  - identity-request: { as: admin, credential: key, method: put, path: "/v1/agents/{{urn:agent-member-draft-with-host-echo:m1}}/access-policy", status: 200, body: { visibility: restricted, mode: approval } }
  - chat: { text: "e2e-step:hi Hello", agent: agent-member-draft-with-host-echo, as: m1, draft: true }
  - expect: { run: succeeded }
  - identity-request: { as: m2, credential: key, method: post, path: /v1/runs, status: 404, contains: "no draft of agent '{{urn:agent-member-draft-with-host-echo:m1}}' for this user", body: { spec: { agentRef: { resourceId: { urn: "{{urn:agent-member-draft-with-host-echo:m1}}" }, version: { major: 1, prerelease: draft } }, inputs: { prompt: "e2e-step:hi Hello" } } } }
then:
  - identity-request: { as: m2, credential: key, method: post, path: /v1/runs, status: 404, contains: "no draft of agent 'urn:vam:agent:local.vam.dev/e2e/no-such-agent' for this user", body: { spec: { agentRef: { resourceId: { urn: "urn:vam:agent:local.vam.dev/e2e/no-such-agent" }, version: { major: 1, prerelease: draft } }, inputs: { prompt: "e2e-step:hi Hello" } } } }
guards:
  - vam:crates/vam-orchestrator/src/api/run_start.rs
  - vam:crates/vam-orchestrator/src/catalog_resolve.rs
  - vam:crates/vam-orchestrator/src/agent_access.rs
  - vam:crates/vam-orchestrator/src/catalog.rs
mock:
  - when: { step: hi, stepStart: true }
    reply: { text: Hello. }
status: active

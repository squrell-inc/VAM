id: access-follows-the-agent-across-its-releases
title: Access follows the agent across its releases, and a revoke ends it for every version
description: >
  A member approved for an agent runs both its first release (pinned) and its latest after a second release. When the admin revokes the access, a run of either version is refused.
tags: [members, permissions]
needs: process
given:
  - { piece: org-admin, as: admin }
  - { piece: org-publisher, as: pub }
  - { piece: org-member, as: member }
  - agent-inline-probe
when:
  - put-draft: { piece: agent-inline-probe, as: pub, status: 200 }
  - identity-request: { as: pub, credential: key, method: post, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/release", status: 200, body: { version: { major: 1, minor: 0, patch: 0 } } }
  - identity-request: { as: pub, credential: key, method: put, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/access-policy", status: 200, body: { visibility: org, mode: approval } }
  - identity-request: { as: member, credential: key, method: post, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/access", status: 202, body: { message: "please" }, remember: { field: request.requestId, as: acr } }
  - identity-request: { as: pub, credential: key, method: post, path: "/v1/access-requests/{{acr}}/decide", status: 200, body: { decision: approve } }
  - identity-request: { as: pub, credential: key, method: put, path: /v1/agents, status: 200, body: { spec: { resourceId: { urn: "{{urn:agent-inline-probe:pub}}" }, displayName: Plain chat agent, description: "Plain chat agent, second release", role: Tester, systemInstructions: "Answer briefly. Finish with task_complete.", allowAnyPlaybook: true } } }
  - identity-request: { as: pub, credential: key, method: post, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/release", status: 200, body: { version: { major: 1, minor: 1, patch: 0 } } }
  - identity-request: { as: member, credential: key, method: post, path: /v1/runs, status: 202, body: { spec: { agentRef: { resourceId: { urn: "{{urn:agent-inline-probe:pub}}" }, version: { major: 1, minor: 0, patch: 0 } }, inputs: { prompt: "Hello", model: mock-model } } } }
  - identity-request: { as: member, credential: key, method: post, path: /v1/runs, status: 202, body: { spec: { agentRef: { resourceId: { urn: "{{urn:agent-inline-probe:pub}}" } }, inputs: { prompt: "Hello", model: mock-model } } } }
  - identity-request: { as: admin, credential: key, method: post, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/access/{member.userId}/revoke", status: 200, body: { reason: "left the team" } }
then:
  - identity-request: { as: member, credential: key, method: post, path: /v1/runs, status: 403, contains: "agent_access_required:", body: { spec: { agentRef: { resourceId: { urn: "{{urn:agent-inline-probe:pub}}" }, version: { major: 1, minor: 0, patch: 0 } }, inputs: { prompt: "Hello", model: mock-model } } } }
  - identity-request: { as: member, credential: key, method: post, path: /v1/runs, status: 403, contains: "agent_access_required:", body: { spec: { agentRef: { resourceId: { urn: "{{urn:agent-inline-probe:pub}}" } }, inputs: { prompt: "Hello", model: mock-model } } } }
guards:
  - vam:crates/vam-orchestrator/src/agent_access.rs
  - vam:crates/vam-orchestrator/src/api/agent_access.rs
  - vam:crates/vam-orchestrator/src/api/run_start.rs
  - vam:crates/vam-orchestrator/src/catalog_resolve.rs
status: active

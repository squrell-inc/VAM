id: parked-approval-survives-a-restart
title: A run parked on an approval is still pending after vamd restarts, and Approve finishes it
tags: [approval, context]
needs: process
given:
  - org-admin
  - agent-with-guarded-tool
when:
  - chat: "e2e-step:ask Write the note"
  - expect: { approval: pending, tool: write_file }
  - restart-vamd: {}
  - expect: { approval: pending, tool: write_file }
  - approve: latest
then:
  - expect: { run: succeeded }
  - expect: { event: tool.completed, tool: write_file }
  - expect: { file: { path: note.txt, present: true } }
guards:
  - vam:crates/vam-orchestrator/src/reconcile.rs
  - vam:crates/vam-orchestrator/src/manager.rs
  - vam:crates/vam-orchestrator/src/run_checkpoint.rs
  - vam:crates/vam-runtime/src/hitl_checkpoint.rs
  - vam:crates/vam-core/src/process_vmm.rs
mock:
  - when: { afterTool: write_file }
    reply: { text: done }
  - when: { step: ask }
    reply: { toolCall: { name: write_file, args: { path: note.txt, content: e2e } } }
status: active

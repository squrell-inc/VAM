id: admin-supplied-client-lets-members-connect-without-the-secret-leaving-the-node
title: A member connects a connector that uses the admin's client, and the secret never leaves the node
description: >
  The admin enabled Filebox with the client id and secret registered with the provider. The member connects
  from the tile: the app asks the provider's pinned authorization endpoint for a code and hands the code, the
  verifier and the redirect URI to the node, which exchanges them with the org secret at the pinned token
  endpoint (the provider sees the admin's client id and the current secret, the verifier and the redirect URI).
  The tile reads connected and a read tool runs with the member's token. An app that holds the tokens itself is
  refused, so is a connection that names another token endpoint or client id, and so is an exchange with a
  redirect URI that is not the app's (the provider sees no second exchange). Neither the client secret nor the
  member's tokens are in the thread, events, receipt, workspace or any connector, MCP or vault listing.
tags: [connectors, members, permissions]
needs: process
given:
  - org-admin
  - org-member
  - org-administrator
  - marketplace-community-connectors
  - mock-filebox-server
  - agent-plain
when:
  - marketplace-add: { piece: marketplace-community-connectors, as: org-admin }
  - marketplace-refresh: { marketplace: marketplace-community-connectors, as: org-admin }
  - marketplace-install: { marketplace: marketplace-community-connectors, listing: filebox-connector, as: org-admin }
  - connector-node: { id: filebox, enabled: true, as: org-administrator, client: { clientId: e2e-filebox-client, clientSecret: { piece: mock-filebox-server, which: current } } }
  - connector-connect: { id: filebox, piece: mock-filebox-server, via: tokens, as: org-member, refused: true, contains: exchange }
  - connector-connect: { id: filebox, piece: mock-filebox-server, via: tokens, tokenEndpoint: "https://evil.example/token", as: org-member, refused: true }
  - connector-connect: { id: filebox, piece: mock-filebox-server, via: tokens, clientId: someone-elses-client, as: org-member, refused: true }
  - connector-connect: { id: filebox, piece: mock-filebox-server, as: org-member }
  - expect: { mock-requests: { piece: mock-filebox-server, path: /token, with: "grant_type=authorization_code", count: 1, has: ["client_id=e2e-filebox-client", "client-secret=current", code_verifier, "redirect_uri=squrell://oauth"], lacks: ["client-secret=none", "client-secret=wrong"] } }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connected, trust: unverified } } }
  - chat: { text: "e2e-step:read Search my files", as: org-member }
  - expect: { run: succeeded }
  - expect: { mock-requests: { piece: mock-filebox-server, path: /mcp, has: [authorization, "tool-ok=search_files"] } }
  - connector-connect: { id: filebox, piece: mock-filebox-server, redirectUri: "https://evil.example/callback", as: org-member, refused: true }
  - expect: { mock-requests: { piece: mock-filebox-server, path: /token, with: "grant_type=authorization_code", count: 1 } }
  - api-call: { path: /v1/connectors, as: org-administrator, absent: mock-filebox-server }
  - api-call: { path: /v1/connectors, as: org-member, absent: mock-filebox-server }
  - api-call: { path: /v1/mcp/connections, as: org-member, absent: mock-filebox-server }
  - api-call: { path: /v1/mcp/connections, as: org-administrator, absent: mock-filebox-server }
  - api-call: { path: /v1/secrets, as: org-administrator, absent: mock-filebox-server }
then:
  - expect: { secret-absent: { secret: mock-filebox-server } }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connected } } }
guards:
  - vam:crates/vam-orchestrator/src/connectors.rs
  - vam:crates/vam-orchestrator/src/api/connectors.rs
  - vam:crates/vam-orchestrator/src/api/mcp_connections.rs
  - vam:crates/vam-orchestrator/src/mcp_oauth_refresh.rs
  - vam:crates/vam-orchestrator/src/mcp_registry.rs
  - vam:crates/vam-orchestrator/src/connector_exchange.rs
mock:
  - when: { step: read, toolName: filebox__search_files }
    reply: { text: Searched. }
  - when: { step: read, stepStart: true }
    reply: { toolCall: { name: filebox__search_files, args: {} } }
status: active

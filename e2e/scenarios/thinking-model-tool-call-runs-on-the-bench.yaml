id: thinking-model-tool-call-runs-on-the-bench
title: A model that returns reasoning with a tool call still runs the tool (bench check)
tags: [chat]
needs: process
description: The real-model form of the thinking check. One chat asks for a saved note; a trial passes when the tool runs and the inference event reports the reasoning size. A check, not a score.
model:
  task: thinking-tool-call
  version: 0.0.0-lane
  k: 1
given:
  - org-admin
  - agent-with-builtins
when:
  - chat: "e2e-step:think Save the note"
  - expect: { event: tool.completed, tool: write_file }
then:
  - expect: { file: { path: note.txt, present: true } }
  - expect: { event: inference.completed, fields: { data.reasoningBytes: { present: true } } }
guards:
  - vam:crates/vam-runtime/src/agent.rs
  - vam:crates/vam-inference/src/provider.rs
mock:
  - when: { step: think, afterTool: write_file }
    reply: { text: saved }
  - when: { step: think }
    reply:
      reasoning: weigh-the-options-7
      toolCall: { name: write_file, args: { path: note.txt, content: kept } }
status: active

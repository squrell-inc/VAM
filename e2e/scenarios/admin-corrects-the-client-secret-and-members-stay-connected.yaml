id: admin-corrects-the-client-secret-and-members-stay-connected
title: An admin corrects or rotates the client secret and members stay connected, until the client id changes
description: >
  The admin enables Filebox with a secret the provider does not accept. The member's connect is refused with a
  reason that says the client id or secret the admin entered was refused, nothing is stored and the tile still
  reads connect. The admin saves the right secret (enabled stays on) and the member connects. The provider then
  rotates its client secret: the admin saves the new one, the access token expires, and the next call refreshes
  with the new secret; the member is not asked to reconnect. When the admin changes the client id, the member's
  tile reads that they must reconnect, because their tokens belong to the old client.
tags: [connectors, members, permissions]
needs: process
given:
  - org-admin
  - org-member
  - org-administrator
  - marketplace-community-connectors
  - mock-filebox-server
  - agent-plain
when:
  - marketplace-add: { piece: marketplace-community-connectors, as: org-admin }
  - marketplace-refresh: { marketplace: marketplace-community-connectors, as: org-admin }
  - marketplace-install: { marketplace: marketplace-community-connectors, listing: filebox-connector, as: org-admin }
  - connector-node: { id: filebox, enabled: true, as: org-administrator, client: { clientId: e2e-filebox-client, clientSecret: { piece: mock-filebox-server, which: wrong } } }
  - connector-connect: { id: filebox, piece: mock-filebox-server, as: org-member, refused: true, contains: client id or secret }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connect } } }
  - connector-node: { id: filebox, enabled: true, as: org-administrator, client: { clientId: e2e-filebox-client, clientSecret: { piece: mock-filebox-server, which: current } } }
  - connector-connect: { id: filebox, piece: mock-filebox-server, as: org-member }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connected } } }
  - mock-provider: { piece: mock-filebox-server, rotateSecret: true }
  - connector-node: { id: filebox, enabled: true, as: org-administrator, client: { clientId: e2e-filebox-client, clientSecret: { piece: mock-filebox-server, which: rotated } } }
  - mock-provider: { piece: mock-filebox-server, expire: true }
  - chat: { text: "e2e-step:read Search my files", as: org-member }
  - expect: { run: succeeded }
  - expect: { mock-requests: { piece: mock-filebox-server, path: /token, with: "grant_type=refresh_token", count: 1, has: ["client-secret=current"], lacks: ["client-secret=old", "client-secret=wrong"] } }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connected } } }
  - connector-node: { id: filebox, enabled: true, as: org-administrator, client: { clientId: e2e-filebox-client-2, clientSecret: { piece: mock-filebox-server, which: rotated } } }
then:
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: needsReconnect, node.client.clientId: e2e-filebox-client-2 } } }
  - expect: { secret-absent: { secret: mock-filebox-server } }
guards:
  - vam:crates/vam-orchestrator/src/connectors.rs
  - vam:crates/vam-orchestrator/src/api/connectors.rs
  - vam:crates/vam-orchestrator/src/mcp_oauth_refresh.rs
  - vam:crates/vam-orchestrator/src/host_tools.rs
mock:
  - when: { step: read, toolName: filebox__search_files }
    reply: { text: Searched. }
  - when: { step: read, stepStart: true }
    reply: { toolCall: { name: filebox__search_files, args: {} } }
status: pending
expectFail: { step: when.3, class: product }

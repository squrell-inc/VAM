id: new-password-equal-to-current-is-refused
title: A new password equal to the current one is refused and nothing is signed out
description: >
  A member asks to change their password to the one they already have. The answer is 400, their
  session still works and the password still signs in.
tags: [members]
needs: process
given:
  - { piece: org-member, as: member }
when:
  - login: { as: member }
  - change-password: { as: member, new: same, status: 400, contains: must differ }
then:
  - identity-request: { as: member, credential: session, path: /v1/me, status: 200 }
  - login: { as: member }
guards:
  - vam:crates/vam-orchestrator/src/api/me.rs
  - vam:crates/vam-orchestrator/src/users.rs
  - vam:crates/vam-orchestrator/src/session_tokens.rs
status: active

id: scheduled-triage-parks-on-a-revoked-connection-and-resumes-once
title: A scheduled triage parks when Microsoft revokes the connection, and resumes once after the member reconnects
description: >
  The member connected with an access token that is already stale and approved the morning triage. Microsoft
  revokes the connection before the run. When the schedule fires, the run parks waiting for the member to
  reconnect, one connection.needs_reauth notification is open, and Graph saw nothing. The member reconnects;
  the run resumes and succeeds, and Graph saw exactly one search.
tags: [connectors, schedule, notifications]
needs: process
given:
  - org-admin
  - org-member
  - marketplace-squrell
  - mock-microsoft-login
  - mock-microsoft-graph
  - schedule-broker
when:
  - marketplace-refresh: { marketplace: marketplace-squrell, as: org-admin }
  - marketplace-install: { marketplace: marketplace-squrell, listing: microsoft-365, as: org-admin }
  - connector-node: { id: microsoft-365, enabled: true, consent: { tenant: 11111111-1111-4111-8111-111111111111 }, as: org-admin }
  - connector-connect: { id: microsoft-365, piece: mock-microsoft-login, tenant: 11111111-1111-4111-8111-111111111111, upn: member@e2e.example, expiresIn: 0, as: org-member }
  - mock-provider: { piece: mock-microsoft-login, revoke: true }
  - chat: { text: "e2e-step:plan Run my morning triage every weekday", agent: "urn:vam:agent:hub.squrell.cloud/squrell/executive-assistant", as: org-member }
  - expect: { approval: pending, tool: schedule_create }
  - approve: { as: org-member }
  - expect: { run: succeeded }
  - wait-scheduled-run: { within: 40s, label: triage }
  - expect: { run: paused }
  - expect: { notifications: { kind: connection.needs_reauth, as: org-member, count: 1, state: open, within: 30s } }
  - expect: { mock-requests: { piece: mock-microsoft-graph, path: "*", count: 0 } }
  - mock-provider: { piece: mock-microsoft-login, revoke: false }
  - connector-connect: { id: microsoft-365, piece: mock-microsoft-login, tenant: 11111111-1111-4111-8111-111111111111, upn: member@e2e.example, as: org-member }
then:
  - expect: { run: succeeded }
  - expect: { mock-requests: { piece: mock-microsoft-graph, path: /v1.0/me/messages, method: GET, count: 1, has: [bearer=current] } }
  - expect: { notifications: { kind: connection.needs_reauth, as: org-member, state: open, absent: true, within: 30s } }
guards:
  - vam:crates/vam-orchestrator/src/connectors.rs
  - vam:crates/vam-orchestrator/src/api/reauth.rs
  - vam:crates/vam-orchestrator/src/notifications.rs
  - vam:crates/vam-orchestrator/src/grants.rs
mock:
  # The run parked on the revoked connection continues here once the member reconnects.
  - when: { step: triage, lastRole: user, contains: "Human approval was granted" }
    reply: { toolCall: { name: step_complete, args: { step_id: triage, outcome: done } } }
  - when: { afterTool: schedule_create }
    reply: { text: Scheduled. }
  - when: { step: plan, stepStart: true }
    reply:
      toolCall:
        name: schedule_create
        args:
          title: Morning triage
          # A weekday morning cannot be waited for: the scenario schedules it ten seconds ahead.
          when: { once: { in: PT10S } }
          run:
            message: "e2e-step:triage Run the morning triage mock-script:scheduled-triage-parks-on-a-revoked-connection-and-resumes-once"
            workspace: { mode: SAME }
            thread: { mode: NEW, name: morning-triage }
            playbookRef: { resourceId: { urn: "urn:vam:playbook:hub.squrell.cloud/squrell/morning-triage" } }
            inputs: { lookbackHours: 24 }
            onBusy: QUEUE
  - when: { step: triage, toolName: step_complete }
    reply: { text: Triage done. }
  - when: { step: triage, toolName: mail_search }
    reply: { toolCall: { name: step_complete, args: { step_id: triage, outcome: done } } }
  - when: { step: triage, toolName: load_skill }
    reply: { toolCall: { name: mail_search, args: { sinceHours: 24 } } }
  - when: { step: triage, stepStart: true }
    reply: { toolCall: { name: load_skill, args: { skill: m365-mail } } }
status: active

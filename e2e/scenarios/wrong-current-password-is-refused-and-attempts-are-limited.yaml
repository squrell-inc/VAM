id: wrong-current-password-is-refused-and-attempts-are-limited
title: A wrong current password is refused, leaves the password unchanged, and too many wrong tries are throttled
description: >
  A wrong current password is answered 403 with a fixed message and the password still signs in.
  After five wrong tries in all the sixth is answered 429, and the right current password is
  answered 429 too until the wait has passed.
tags: [members]
needs: process
given:
  - { piece: org-member, as: member }
when:
  - login: { as: member }
  - change-password: { as: member, current: wrong, status: 403, contains: current password is incorrect }
then:
  - login: { as: member }
  - change-password: { as: member, current: wrong, status: 403, contains: current password is incorrect }
  - change-password: { as: member, current: wrong, status: 403, contains: current password is incorrect }
  - change-password: { as: member, current: wrong, status: 403, contains: current password is incorrect }
  - change-password: { as: member, current: wrong, status: 403, contains: current password is incorrect }
  - change-password: { as: member, current: wrong, status: 429, contains: too many wrong password attempts }
  - change-password: { as: member, current: right, status: 429, contains: too many wrong password attempts }
guards:
  - vam:crates/vam-orchestrator/src/api/me.rs
  - vam:crates/vam-orchestrator/src/users.rs
  - vam:crates/vam-orchestrator/src/session_tokens.rs
  - vam:crates/vam-orchestrator/src/api/rate_limit.rs
status: pending
expectFail: { step: when.1, class: product }

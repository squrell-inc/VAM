id: schedule-for-a-new-workspace-runs-there
title: A schedule made for a new workspace runs in a Space with that label, not in the chat's
tags: [schedule, triggers]
needs: process
description: The agent makes a once-schedule whose workspace is NEW with a name. When it fires, the run happens in a Space with that label, and its file is there.
given:
  - org-admin
  - agent-with-schedule-tools
  - schedule-broker
when:
  - chat: "e2e-step:create Write a note in a new workspace"
  - expect: { approval: pending, tool: schedule_create }
  - approve: latest
  - expect: { run: succeeded }
  - expect: { thread: { role: tool, contains: "sch_" } }
  - wait-scheduled-run: { within: 30s, label: fired }
then:
  - expect: { run: succeeded }
  - expect: { file: { path: fired.txt, present: true } }
  - expect: { spaces: { fields: { name: nightly-space } } }
guards:
  - vam:crates/vam-orchestrator/src/host_tools.rs
  - vam:crates/vam-orchestrator/src/gateway.rs
  - vam:crates/vam-orchestrator/src/grants.rs
mock:
  - when: { step: create, stepStart: true }
    reply:
      toolCall:
        name: schedule_create
        args:
          title: Nightly note
          when: { once: { in: PT6S } }
          run:
            message: "e2e-step:fired Write fired.txt mock-script:schedule-for-a-new-workspace-runs-there"
            workspace: { mode: NEW, name: nightly-space }
            thread: { mode: NEW, name: nightly-note }
            onBusy: QUEUE
  - when: { step: create }
    reply: { text: Scheduled. }
  - when: { step: fired, toolName: write_file }
    reply: { text: done }
  - when: { step: fired, stepStart: true }
    reply: { toolCall: { name: write_file, args: { path: fired.txt, content: fired } } }
status: active

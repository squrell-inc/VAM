id: member-changes-own-password-and-signs-in-with-the-new-one
title: A member changes their own password, the old one stops working and the new one signs in
description: >
  A member signs in, changes their password with that session and is told to sign in again. The
  old password is then refused at login and the new one works.
tags: [members]
needs: process
given:
  - { piece: org-member, as: member }
when:
  - login: { as: member }
  - change-password: { as: member, status: 200, contains: reloginRequired }
then:
  - login: { as: member, password: previous, refused: true }
  - login: { as: member }
guards:
  - vam:crates/vam-orchestrator/src/api/me.rs
  - vam:crates/vam-orchestrator/src/users.rs
  - vam:crates/vam-orchestrator/src/session_tokens.rs
status: pending
expectFail: { step: when.1, class: product }

id: a-retried-access-write-replays-the-first-answer
title: A retried access write replays the first answer and does nothing twice
description: >
  The same Idempotency-Key with the same request gives the first answer again for the policy, the request, the decision and the revoke. The same key with another body is refused with 409. My requests shows one row.
tags: [members, permissions]
needs: process
given:
  - { piece: org-admin, as: admin }
  - { piece: org-member, as: member }
  - agent-plain
when:
  - identity-request: { as: admin, credential: key, method: put, path: "/v1/agents/{{urn:agent-plain}}/access-policy", status: 200, body: { visibility: org, mode: approval }, idempotencyKey: pol }
  - identity-request: { as: admin, credential: key, method: put, path: "/v1/agents/{{urn:agent-plain}}/access-policy", status: 200, body: { visibility: org, mode: approval }, idempotencyKey: pol }
  - identity-request: { as: member, credential: key, method: post, path: "/v1/agents/{{urn:agent-plain}}/access", status: 202, body: { message: "please" }, remember: { field: request.requestId, as: acr }, idempotencyKey: req }
  - identity-request: { as: member, credential: key, method: post, path: "/v1/agents/{{urn:agent-plain}}/access", status: 202, body: { message: "please" }, fields: { request.requestId: "{{acr}}" }, idempotencyKey: req }
  - identity-request: { as: member, credential: key, method: post, path: "/v1/agents/{{urn:agent-plain}}/access", status: 409, body: { message: "other" }, contains: "different request", idempotencyKey: req }
  - identity-request: { as: admin, credential: key, method: post, path: "/v1/access-requests/{{acr}}/decide", status: 200, body: { decision: approve }, idempotencyKey: dec }
  - identity-request: { as: admin, credential: key, method: post, path: "/v1/access-requests/{{acr}}/decide", status: 200, body: { decision: approve }, fields: { request.state: approved }, idempotencyKey: dec }
  - identity-request: { as: admin, credential: key, method: post, path: "/v1/agents/{{urn:agent-plain}}/access/{member.userId}/revoke", status: 200, body: { reason: "left" }, idempotencyKey: rev }
  - identity-request: { as: admin, credential: key, method: post, path: "/v1/agents/{{urn:agent-plain}}/access/{member.userId}/revoke", status: 200, body: { reason: "left" }, fields: { request.state: revoked }, idempotencyKey: rev }
then:
  - identity-request: { as: member, credential: key, path: "/v1/me/access", status: 200, fields: { requests.0.requestId: "{{acr}}", requests.1: { absent: true } } }
guards:
  - vam:crates/vam-orchestrator/src/agent_access.rs
  - vam:crates/vam-orchestrator/src/api/agent_access.rs
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/api/paging.rs
status: pending
expectFail: { step: when.3, class: product }

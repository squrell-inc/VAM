id: a-member-browses-requests-and-leaves-an-agent-from-the-cli
title: A member browses, requests, adds and leaves agents from the CLI
description: >
  The member browses the agents they may ask for, requests one that needs approval and adds one that is open, pages through the requests with a query, then leaves an agent and sees the request withdrawn. Hints name the next command.
tags: [members, permissions]
needs: process
given:
  - { piece: org-admin, as: admin }
  - { piece: org-publisher, as: pub }
  - { piece: org-member, as: member }
  - agent-plain
  - agent-inline-probe
when:
  - identity-request: { as: admin, credential: key, method: put, path: "/v1/agents/{{urn:agent-plain}}/access-policy", status: 200, body: { visibility: org, mode: approval } }
  - put-draft: { piece: agent-inline-probe, as: pub, status: 200 }
  - identity-request: { as: pub, credential: key, method: post, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/release", status: 200, body: { version: { major: 1, minor: 0, patch: 0 } } }
  - identity-request: { as: pub, credential: key, method: put, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/access-policy", status: 200, body: { visibility: org, mode: open } }
  - cli: { as: member, args: [agent, browse], root: { from: version/empty }, exit: ok, contains: ["{{urn:agent-plain}}", "none"] }
  - cli: { as: member, args: [agent, request, "{{urn:agent-plain}}", -m, please], root: { from: version/empty }, exit: ok, contains: ["pending"], remember: { as: acr, after: "request " } }
  - cli: { as: member, args: [agent, add, "{{urn:agent-inline-probe:pub}}"], root: { from: version/empty }, exit: ok, contains: ["approved"] }
then:
  - cli: { as: member, args: [access, mine, --page-size, "1", --all], root: { from: version/empty }, exit: ok, contains: ["{{acr}}", "{{urn:agent-inline-probe:pub}}"] }
  - cli: { as: member, args: [agent, leave, "{{urn:agent-plain}}"], root: { from: version/empty }, exit: ok }
  - cli: { as: member, args: [--json, access, mine], root: { from: version/empty }, exit: ok, contains: ["withdrawn"] }
  - cli: { as: member, args: [agent, leave, "{{urn:agent-plain}}"], root: { from: version/empty }, exitCode: 4, contains: ["vam access mine"] }
  - cli: { as: member, args: [agent, request, "{{urn:agent-inline-probe:pub}}"], root: { from: version/empty }, exitCode: 5, contains: ["already usable"] }
guards:
  - vam:crates/vam-cli/src/main.rs
  - vam:crates/vam-cli/src/cmd/catalog.rs
  - vam:crates/vam-cli/src/cmd/access.rs
  - vam:crates/vam-cli/src/client.rs
  - vam:crates/vam-cli/src/http_error.rs
status: active

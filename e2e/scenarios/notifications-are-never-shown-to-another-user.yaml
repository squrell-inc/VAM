id: notifications-are-never-shown-to-another-user
title: Another member sees none of the owner's notifications and cannot read, mark or fetch them by id
tags: [members, approval, notifications]
needs: process
description: The owner's run parks on an approval. A second member's list and badge are empty, and their get, read and acted calls on the owner's record id answer 404. The owner's record stays unread and unresolved.
given:
  - org-admin
  - { piece: org-member, as: bob }
  - agent-with-guarded-tool
when:
  - chat: "e2e-step:ask Write the note"
  - expect: { approval: pending, tool: write_file }
  - expect: { notifications: { kind: approval.pending, run: latest, count: 1, state: open } }
  - expect: { notifications: { as: bob, count: 0 } }
  - expect: { notification-summary: { as: bob, action: 0, warn: 0, unread: 0 } }
  - notification-mark: { action: get, as: bob, status: 404 }
  - notification-mark: { action: read, as: bob, status: 404 }
  - notification-mark: { action: acted, as: bob, status: 404 }
then:
  - expect:
      notifications:
        kind: approval.pending
        run: latest
        count: 1
        state: open
        unread: true
        fields:
          readAt: { absent: true }
          actedAt: { absent: true }
          resolvedAt: { absent: true }
  - expect: { approval: pending, tool: write_file }
guards:
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/keys.rs
mock:
  - when: { step: ask, afterTool: write_file }
    reply: { text: written }
  - when: { step: ask }
    reply: { toolCall: { name: write_file, args: { path: note.txt, content: e2e } } }
status: active

id: vm-boots-and-registers-over-vsock
title: A chat on a microVM node boots the guest, registers over vsock and writes a file
tags: [chat, workspace]
needs: firecracker
given:
  - org-admin
  - agent-with-builtins
when:
  - chat: "e2e-step:write Save the note"
then:
  - expect: { run: succeeded }
  - expect: { event: session.booted }
  - expect: { file: { path: note.txt, present: true } }
guards:
  - vam:crates/vam-orchestrator/src/manager.rs
  - vam:crates/vam-core/src/vmm.rs
  - vam:crates/vam-vsock/**
  - vam:crates/vam-runtime/src/main.rs
  - vam:scripts/base/Dockerfile
  - vam:scripts/base/pins
  - vam:scripts/build-rootfs.sh
mock:
  - when: { step: write, afterTool: write_file }
    reply: { text: saved }
  - when: { step: write }
    reply: { toolCall: { name: write_file, args: { path: note.txt, content: hello } } }
status: active
# Passes on a jailed node whose sessions restore from the golden snapshot (the file is committed after the run), as well as on a cold-booting one.

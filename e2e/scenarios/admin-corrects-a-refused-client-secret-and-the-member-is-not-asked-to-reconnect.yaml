id: admin-corrects-a-refused-client-secret-and-the-member-is-not-asked-to-reconnect
title: An admin who saves the corrected secret for the same client brings back a member whose refresh the provider refused
description: >
  The member is connected through the admin's client. The provider rotates its client secret before the admin has
  saved the new one: the member's next call refreshes with the old secret, the provider refuses the client, and the
  tile reads that the member must reconnect (the reason names the admin's client). The admin saves the new secret
  for the same client id. The member's tile reads connected again without a sign-in, and the next call refreshes
  with the new secret and runs. The grant itself was never revoked, so nothing but the admin's secret had to change.
tags: [connectors, members, permissions]
needs: process
given:
  - org-admin
  - org-member
  - org-administrator
  - marketplace-community-connectors
  - mock-filebox-server
  - agent-plain
when:
  - marketplace-add: { piece: marketplace-community-connectors, as: org-admin }
  - marketplace-refresh: { marketplace: marketplace-community-connectors, as: org-admin }
  - marketplace-install: { marketplace: marketplace-community-connectors, listing: filebox-connector, as: org-admin }
  - connector-node: { id: filebox, enabled: true, as: org-administrator, client: { clientId: e2e-filebox-client, clientSecret: { piece: mock-filebox-server, which: current } } }
  - connector-connect: { id: filebox, piece: mock-filebox-server, as: org-member }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connected } } }
  - mock-provider: { piece: mock-filebox-server, rotateSecret: true }
  - mock-provider: { piece: mock-filebox-server, expire: true }
  - chat: { text: "e2e-step:read Search my files", as: org-member }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: needsReconnect } } }
  - expect: { mock-requests: { piece: mock-filebox-server, path: /token, with: "grant_type=refresh_token", count: 1, has: ["client-secret=old"] } }
  - connector-node: { id: filebox, enabled: true, as: org-administrator, client: { clientId: e2e-filebox-client, clientSecret: { piece: mock-filebox-server, which: rotated } } }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connected } } }
  - chat: { text: "e2e-step:read Search my files", as: org-member }
then:
  - expect: { run: succeeded }
  - expect: { mock-requests: { piece: mock-filebox-server, path: /token, with: "refresh=fresh", count: 1, has: ["grant_type=refresh_token", "client-secret=current"] } }
  - expect: { mock-requests: { piece: mock-filebox-server, path: /mcp, has: [authorization, "tool-ok=search_files"] } }
  - expect: { connectors: { id: filebox, as: org-member, fields: { state: connected } } }
  - expect: { secret-absent: { secret: mock-filebox-server } }
guards:
  - vam:crates/vam-orchestrator/src/connector_client.rs
  - vam:crates/vam-orchestrator/src/api/connectors.rs
  - vam:crates/vam-orchestrator/src/mcp_registry.rs
  - vam:crates/vam-orchestrator/src/host_tools.rs
mock:
  - when: { step: read, toolName: filebox__search_files }
    reply: { text: Searched. }
  - when: { step: read, stepStart: true }
    reply: { toolCall: { name: filebox__search_files, args: {} } }
status: active

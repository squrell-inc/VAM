id: receipt-verifies-offline-and-fails-on-tamper
title: A receipt verifies offline with no daemon and no key, and fails when one byte changes
tags: [chat]
needs: process
description: A plain chat has no procedure section. The built vam verifies the receipt by itself; with one byte changed it fails and names the signature.
given:
  - org-admin
  - agent-plain
when:
  - chat: "e2e-step:hello Say hello"
then:
  - expect: { run: succeeded }
  - expect:
      receipt:
        fields:
          receipt.procedure: { absent: true }
          signature.keyId: { present: true }
  - verify-receipt: {}
  - verify-receipt: { tamper: true }
guards:
  - vam:crates/vam-cli/src/cmd/evidence.rs
  - vam:crates/vam-telemetry/src/evidence.rs
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/receipt.rs
mock:
  - when: { step: hello }
    reply: { text: Hello from the mock. }
status: active

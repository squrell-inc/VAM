id: password-change-signs-out-every-session-and-keeps-api-keys
title: A password change signs out every session of the member and keeps their API key
description: >
  A member holds two sessions and an API key, all answered. After the password change both
  sessions are refused, the one that made the change included, while the API key still works and
  the new password signs in.
tags: [members]
needs: process
given:
  - { piece: org-member, as: member }
when:
  - login: { as: member }
  - login: { as: member }
  - identity-request: { as: member, credential: previous-session, path: /v1/me, status: 200 }
  - identity-request: { as: member, credential: session, path: /v1/me, status: 200 }
  - change-password: { as: member, status: 200, contains: reloginRequired }
then:
  - identity-request: { as: member, credential: previous-session, path: /v1/me, status: 401 }
  - identity-request: { as: member, credential: session, path: /v1/me, status: 401 }
  - identity-request: { as: member, credential: key, path: /v1/me, status: 200 }
  - login: { as: member }
guards:
  - vam:crates/vam-orchestrator/src/api/me.rs
  - vam:crates/vam-orchestrator/src/users.rs
  - vam:crates/vam-orchestrator/src/session_tokens.rs
status: active

id: member-cannot-file-a-fix-request-for-someone-elses-denial
title: A member cannot file a fix request for another member's denial, and nobody is notified
description: >
  One member is refused for a connector nobody enabled. A second member sends the first member's
  denial reference to `POST /v1/fix-requests` and is answered 404 with the same text the node gives
  for a reference that does not exist, so a reference reveals nothing. No `fix.requested`
  notification reaches the org administrator, the agent owner or either member.
tags: [chat, connectors, members, notifications]
needs: process
given:
  - org-admin
  - org-administrator
  - { piece: org-member, as: alice }
  - { piece: org-member, as: bob }
  - agent-with-m365-probe
when:
  - chat: { text: "e2e-step:ask Search my mail", as: alice }
  - expect: { run: succeeded }
  - expect:
      event: policy.decided
      tool: m365_probe_search
      fields:
        denial.reason: CONNECTOR_DISABLED
        denial.decisionRef: { present: true }
  - fix-request: { ref: dnl_00000000000000000000000000, as: alice, status: 404, remember: missing }
  - fix-request: { from: latest-denial, as: bob, status: 404, sameMessageAs: missing }
then:
  - expect: { notifications: { as: org-administrator, kind: fix.requested, absent: true } }
  - expect: { notifications: { kind: fix.requested, absent: true } }
  - expect: { notifications: { as: alice, kind: fix.requested, absent: true } }
  - expect: { notifications: { as: bob, kind: fix.requested, absent: true } }
  - expect: { notification-summary: { as: org-administrator, unread: 0 } }
  - expect: { notification-summary: { as: bob, unread: 0 } }
guards:
  - vam:crates/vam-orchestrator/src/notifications.rs
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/denials.rs
mock:
  - when: { step: ask, lastRole: tool, contains: ask your admin }
    reply: { text: Ask your administrator to enable Microsoft 365. }
  - when: { step: ask, toolName: load_skill }
    reply: { toolCall: { name: m365_probe_search, args: { method: GET, path: /v1.0/me/messages } } }
  - when: { step: ask, stepStart: true }
    reply: { toolCall: { name: load_skill, args: { skill: skill-m365-probe-member-cannot-file-a-fix-request-for-someone-elses-denial } } }
status: pending
expectFail: { step: when.2, class: product }

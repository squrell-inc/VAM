id: trigger-starts-a-run-as-the-grant-owner
title: An approved call leaves a grant, and a later fire starts a run as that user in the same thread
tags: [triggers, approval]
needs: process
description: The agent asks for a trigger and the user approves it. The test broker later fires the grant. The run it starts belongs to the user, lands in the thread of the first task, and its status and receipt name the trigger, the grant and the surface.
given:
  - org-admin
  - agent-with-trigger-tool
  - trigger-test-broker
when:
  - chat: "e2e-step:arm Arm the trigger"
  - expect: { approval: pending, tool: echo_arm_trigger }
  - approve: latest
  - expect: { run: succeeded }
  - expect: { grant: { tool: echo_arm_trigger, count: 1 } }
  - fire-trigger: { key: fire-1, label: fired }
then:
  - expect: { fire: { outcomes: [ACCEPTED] } }
  - expect: { run: succeeded }
  - expect: { file: { path: fired.txt, present: true } }
  - expect: { thread: { role: user, contains: "Write fired.txt" } }
  - expect:
      runs:
        latest:
          source.kind: trigger
          source.grantId: { present: true }
          source.brokerId: { present: true }
          source.fireKind: scheduled
  - expect:
      receipt:
        fields:
          receipt.requestedBy: { present: true }
          receipt.requestSurface: echo
          receipt.requestTrigger.grantId: { present: true }
          receipt.requestTrigger.brokerId: { present: true }
          receipt.requestTrigger.fireKind: scheduled
guards:
  - vam:crates/vam-orchestrator/src/host_tools.rs
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/receipt.rs
mock:
  - when: { afterTool: echo_arm_trigger }
    reply: { text: Armed. }
  - when: { step: arm, stepStart: true }
    reply:
      toolCall:
        name: echo_arm_trigger
        args:
          run:
            message: "e2e-step:fired Write fired.txt mock-script:trigger-starts-a-run-as-the-grant-owner"
            workspace: { mode: SAME }
            thread: { mode: SAME }
  - when: { step: fired, toolName: write_file }
    reply: { text: done }
  - when: { step: fired, stepStart: true }
    reply: { toolCall: { name: write_file, args: { path: fired.txt, content: fired } } }
status: active

id: an-agent-admin-adds-a-second-admin-who-can-then-decide
title: An agent admin adds a second admin, who can then decide requests for the agent
description: >
  Only an agent admin or an org admin reads or sets the admins of an agent; a catalog key alone is nothing. The publisher names a second member as admin, a name that is no user is refused, and the second admin decides a request.
tags: [members, permissions]
needs: process
given:
  - { piece: org-admin, as: admin }
  - { piece: org-publisher, as: pub }
  - { piece: org-member, as: member }
  - { piece: org-member-email, as: member2 }
  - { piece: org-member-with-a-catalog-key, as: ckey }
  - agent-inline-probe
when:
  - put-draft: { piece: agent-inline-probe, as: pub, status: 200 }
  - identity-request: { as: pub, credential: key, method: post, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/release", status: 200, body: { version: { major: 1, minor: 0, patch: 0 } } }
  - identity-request: { as: pub, credential: key, method: put, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/access-policy", status: 200, body: { visibility: org, mode: approval } }
  - identity-request: { as: member, credential: key, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/admins", status: 403 }
  - identity-request: { as: ckey, credential: key, method: put, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/admins", status: 403, body: { userIds: ["{member.userId}"] } }
  - identity-request: { as: pub, credential: key, method: put, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/admins", status: 200, body: { userIds: ["{pub.userId}", "{member2.userId}"] } }
  - identity-request: { as: pub, credential: key, method: put, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/admins", status: 400, body: { userIds: [nobody] } }
  - identity-request: { as: member, credential: key, method: post, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/access", status: 202, body: { message: "please" }, remember: { field: request.requestId, as: acr } }
then:
  - identity-request: { as: member2, credential: key, method: post, path: "/v1/access-requests/{{acr}}/decide", status: 200, body: { decision: approve } }
  - identity-request: { as: pub, credential: key, path: "/v1/agents/{{urn:agent-inline-probe:pub}}/admins", status: 200, contains: "{member2.userId}" }
guards:
  - vam:crates/vam-orchestrator/src/agent_access.rs
  - vam:crates/vam-orchestrator/src/api/agent_access.rs
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/api/paging.rs
status: active

id: broker-cannot-be-given-an-mcp-credential
title: A broker whose approved manifest names an MCP connection's token is refused at the call, and nothing reaches it
description: >
  The org has an OAuth MCP connection. A first-party broker is registered with a manifest that
  names the connection's access token as its secret and lists the MCP host as an approved egress
  domain, so the destination rule alone would let the token through. The vault row is an MCP
  connection credential, which only the host may use. The agent's call to the broker's tool is
  refused before the broker is reached: the thread says the secret is not permitted for this
  broker, the broker's own ledger counts no call, and no form of the connection's tokens is in
  the thread, the events, the receipt or the workspace.
tags: [egress, chat]
needs: process
given:
  - org-admin
  - mcp-oauth-connection
  - effects-broker-with-mcp-secret
  - agent-with-mcp-secret-broker
when:
  - chat: "e2e-step:note Save a note"
then:
  - expect: { run: succeeded }
  - expect: { thread: { role: tool, contains: "not permitted for this broker" } }
  - expect: { ledger: { piece: effects-broker-with-mcp-secret, tool: echo_create_note, count: 0 } }
  - expect: { secret-absent: { secret: mcp-oauth-connection } }
guards:
  - vam:crates/vam-orchestrator/src/caller_context.rs
  - vam:crates/vam-orchestrator/src/secrets.rs
  - vam:crates/vam-orchestrator/src/host_tools.rs
  - vam:crates/vam-orchestrator/src/connectors.rs
  - vam:crates/vam-orchestrator/src/api/connectors.rs
mock:
  - when: { step: note, toolName: echo_create_note }
    reply: { text: The broker was not given the token. }
  - when: { step: note, stepStart: true }
    reply: { toolCall: { name: echo_create_note, args: { title: weekly } } }
status: active

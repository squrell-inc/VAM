id: decision-anywhere-clears-the-notification
title: Deciding an approval from the CLI or the app clears its notification, with the surface it came from
tags: [approval, notifications]
needs: process
description: One approval is decided with the CLI and another through the API as the app. Each record closes as acted with the surface that decided it, the receipt names the same surface, and the badge drops. Marking a pending approval acted is refused; only a decision clears it.
given:
  - org-admin
  - agent-with-guarded-tool
when:
  - chat: "e2e-step:one Write the first note"
  - expect: { approval: pending, tool: write_file }
  - expect: { notifications: { kind: approval.pending, run: latest, count: 1, state: open, unread: true } }
  - approve: { via: cli }
  - expect: { run: succeeded }
  - expect:
      notifications:
        kind: approval.pending
        run: latest
        count: 1
        fields:
          resolvedReason: acted
          actedSurface: cli
  - expect: { receipt: { fields: { receipt.toolCalls.lines.0.surface: cli } } }
  - chat: "e2e-step:two Write the second note"
  - expect: { approval: pending, tool: write_file }
  - notification-mark: { action: acted, kind: approval.pending, status: 409, contains: decide_required }
  - expect: { approval: pending, tool: write_file }
  - approve: { via: app }
  - expect: { run: succeeded }
then:
  - expect:
      notifications:
        kind: approval.pending
        run: latest
        count: 1
        fields:
          resolvedReason: acted
          actedSurface: app
  - expect: { receipt: { fields: { receipt.toolCalls.lines.0.surface: app } } }
  - expect: { notification-summary: { action: 0 } }
guards:
  - vam:crates/vam-orchestrator/src/workflow.rs
  - vam:crates/vam-orchestrator/src/api/mod.rs
  - vam:crates/vam-orchestrator/src/run_facts.rs
  - vam:crates/vam-cli/src/cmd/approve.rs
mock:
  - when: { step: one, afterTool: write_file }
    reply: { text: first written }
  - when: { step: one }
    reply: { toolCall: { name: write_file, args: { path: first.txt, content: e2e } } }
  - when: { step: two, afterTool: write_file }
    reply: { text: second written }
  - when: { step: two }
    reply: { toolCall: { name: write_file, args: { path: second.txt, content: e2e } } }
status: active

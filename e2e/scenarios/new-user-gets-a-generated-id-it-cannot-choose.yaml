id: new-user-gets-a-generated-id-it-cannot-choose
title: A new user gets a generated id, and a client cannot choose one
description: >
  A user an admin creates has an opaque generated id that is not their username, and their default
  namespace comes from the username, never the id. A create that names a userId is refused with
  400 and makes no user: the same username can be created right after without one.
tags: [members]
needs: process
given:
  - { piece: org-administrator, as: admin }
  - { piece: org-member, as: member }
when:
  - create-user: { as: admin, username: "chooser-{tag}", userId: usr_aaaaaaaaaaaaaaaaaaaaaaaaaa, status: 400, contains: generated by the node }
  - create-user: { as: admin, username: "chooser-{tag}", status: 200 }
then:
  - identity-request:
      as: member
      credential: key
      path: /v1/me
      status: 200
      fields:
        userId: { matches: "^usr_[a-z2-7]{26}$" }
        username: "{member.username}"
        defaultNamespace: "{member.username}"
guards:
  - vam:crates/vam-orchestrator/src/api/users_admin.rs
  - vam:crates/vam-orchestrator/src/users.rs
  - vam:crates/vam-orchestrator/src/api/me.rs
status: pending
expectFail: { step: when.0, class: product }

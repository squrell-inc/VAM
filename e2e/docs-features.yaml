# The feature register: every shipped feature, the page that teaches it (`dev`), the page that
# explains it (`arch`), and what proves it. Checked by `vam-e2e check` (rule `docs-feature`).
#   proves:       active scenario ids, or tests: a file under a crate's `tests/` or `path::fn` where
#                 `fn` has a #[test] or #[tokio::test] attribute (a bare `src/` file is not a proof)
#   unproven:     why no test proves it (a reason, never a proof; a row has `proves` or `unproven`)
#   pending_page: true while a `dev` or `arch` page is not written yet (its wave removes the flag)
# Pages are slugs under docs/src/content/docs. A listed page that has left docs-baseline.txt must
# be `shipped` and name at least one of the row`s proofs in its own `proves`.

# Lima template for VAM local Linux development on Apple Silicon (M3+).
# Usage: limactl start --name=vam ./scripts/lima-macos.yaml
#
# Provides nested KVM inside an aarch64 Ubuntu 24.04 VM for local VAM development.
# See docs/getting-started/macos-lima.md for build/fetch/start scripts.

vmType: vz
arch: aarch64
nestedVirtualization: true

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

cpus: 4
memory: 6GiB
disk: 40GiB

mounts:
  - location: "~"
    writable: false
  - location: "/tmp/lima"
    writable: true

portForwards:
  - guestPort: 8080
    hostPort: 8080
    proto: tcp

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if getent group kvm >/dev/null && id -u "${LIMA_USER}" >/dev/null 2>&1; then
        usermod -aG kvm "${LIMA_USER}"
      fi
